
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
.wrap{

.top-row{display:flex;align-items:center;justify-content:space-between;}

.bdot{width:8px;height:8px;background:#ff4444;border-radius:50%;}

/* main card */
.card{

}
.card-right{display:flex;align-items:center;gap:10px;}
.live-badge{

}
.grade-pill{background-color:#162820;border:1px solid #2a4035;border-radius:10px;padding:5px 13px;text-align:center;}
.grade-label{color:#5a8070;font-size:11px;font-weight:700;}
.grade-num{color:#fff;font-size:18px;font-weight:900;}
.sep{width:3px;height:44px;background:#00c896;border-radius:2px;flex-shrink:0;}
.subject-name{color:#fff;font-size:28px;font-weight:900;flex:1;text-align:right;}
.card-left{text-align:left;flex-shrink:0;}
.date-num{color:#fff;font-size:34px;font-weight:900;line-height:1;}
.date-month{color:#ccc;font-size:12px;font-weight:600;}
.date-day{color:#00c896;font-size:12px;font-weight:800;}
/* time card */
.time-card{
  background-color:#0d201a;border:1px solid #1e3d2e;border-radius:14px;

}
.time-label-col{display:flex;flex-direction:column;gap:2px;}
.time-label{color:#5a8070;font-size:12px;font-weight:700;}
.time-value{color:#fff;font-size:26px;font-weight:900;letter-spacing:1px;}
.time-accent{color:#00c896;}
.time-sep-line{width:1px;height:40px;background:#1e3d2e;}
.time-icon{font-size:32px;}
/* qr box */
.qr-box{
  background-color:#0d201a;border:1px solid #1e3d2e;border-radius:14px;
  padding:12px 16px;display:flex;align-items:center;gap:14px;
}
.qr-wrap{background:#fff;border-radius:10px;padding:5px;flex-shrink:0;width:76px;height:76px;display:flex;align-items:center;justify-content:center;}
#qrcode canvas,#qrcode img{width:66px!important;height:66px!important;}
.qr-text-col{display:flex;flex-direction:column;gap:3px;flex:1;}
.qr-title{color:#fff;font-size:13px;font-weight:800;line-height:1.4;}
.qr-sub{color:#00c896;font-size:12px;font-weight:700;}
.qr-hint{color:#4a7060;font-size:11px;font-weight:600;}
/* footer */
.footer{display:flex;align-items:center;justify-content:space-between;}
.phone-pill{
  background-color:#0d201a;border:1px solid #1e3d2e;border-radius:30px;
  padding:7px 16px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px;

.handle{color:#3a5a4a;font-size:13px;font-weight:600;}
