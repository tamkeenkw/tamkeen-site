<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>باقات أكاديمية مسار — عرض خاص</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --crimson:#5C0F0F; --crimson-2:#7A1515; --cream:#FAF7F2; --cream-2:#F2EDE5; --text:#1A0808; --muted:#7A6060; --line:rgba(92,15,15,.09); --gold:#C9A14A; }
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--text);line-height:1.7;min-height:100vh}
.hero{background:var(--crimson);color:#fff;padding:40px 22px 30px;text-align:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;bottom:-40px;left:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05)}
.brand{font-size:24px;font-weight:900;margin-bottom:4px}
.brand span{color:rgba(255,255,255,.6);font-size:12px;font-weight:700;letter-spacing:2px;display:block;margin-top:2px}
.hero h1{font-size:19px;font-weight:800;margin-top:18px}
.hero .by{margin-top:10px;display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:100px;padding:7px 18px;font-size:13.5px;font-weight:700}
.hero .by b{color:#fff}
.wrap{max-width:640px;margin:0 auto;padding:22px 18px 60px}
.intro{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:18px;font-size:13.5px;color:var(--muted);font-weight:600;text-align:center;border-top:3px solid var(--gold)}
.pkg{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:0;margin-bottom:18px;overflow:hidden;box-shadow:0 8px 30px rgba(92,15,15,.06)}
.pkg-img{width:100%;height:150px;object-fit:cover;background:var(--cream-2);display:block}
.pkg-body{padding:20px 22px}
.pkg-name{font-size:19px;font-weight:900;color:var(--crimson);margin-bottom:6px}
.pkg-desc{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:14px}
.pkg-price{display:flex;align-items:baseline;gap:6px;margin-bottom:14px}
.pkg-price b{font-size:30px;font-weight:900;color:var(--text)}
.pkg-price span{font-size:15px;color:var(--muted);font-weight:700}
.pkg-price .free{font-size:24px;font-weight:900;color:#1d7a3a}
.pkg-feats{list-style:none;margin:0 0 16px;padding:0}
.pkg-feats li{display:flex;gap:9px;align-items:flex-start;font-size:14px;font-weight:600;color:var(--text);padding:5px 0}
.pkg-feats li svg{width:17px;height:17px;flex-shrink:0;margin-top:3px;stroke:var(--crimson);fill:none;stroke-width:2.6}
.pkg-inc{font-size:12.5px;color:var(--muted);font-weight:700;background:var(--cream);border-radius:10px;padding:9px 13px;margin-bottom:14px}
.cert-note{font-size:12.5px;color:var(--crimson);font-weight:700;margin-bottom:14px}
.buy{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--crimson);color:#fff;border:none;border-radius:13px;padding:15px;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:900;cursor:pointer;transition:all .22s;box-shadow:0 8px 22px rgba(92,15,15,.2)}
.buy:hover{background:var(--crimson-2);transform:translateY(-2px)}
.buy svg{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.4}
.state{text-align:center;padding:50px 20px;color:var(--muted);font-weight:700}
.spin{display:inline-block;width:26px;height:26px;border:3px solid var(--cream-2);border-top-color:var(--crimson);border-radius:50%;animation:s .7s linear infinite;margin-bottom:12px}
@keyframes s{to{transform:rotate(360deg)}}
.foot{text-align:center;font-size:12px;color:var(--muted);font-weight:600;margin-top:24px;line-height:1.9}
.foot .secure{display:inline-flex;align-items:center;gap:6px;color:var(--crimson);font-weight:800}
.foot .secure svg{width:14px;height:14px;stroke:var(--crimson);fill:none;stroke-width:2.4}
</style>
</head>
<body>
<div class="hero">
  <div class="brand">أكاديمية مسار<span>MASAR ACADEMY</span></div>
  <h1>باقات وعضويات معتمدة</h1>
  <div class="by" id="byBox" style="display:none">يقدّمها لك: <b id="byName">—</b></div>
</div>

<div class="wrap">
  <div class="intro">اختر الباقة المناسبة واضغط «اشترِ» — بتكمّل الدفع بأمان عبر بوابة مسار، والشهادة معتمدة من الهيئة العامة للتعليم التطبيقي والتدريب.</div>
  <div id="list"><div class="state"><div class="spin"></div><div>جاري تحميل الباقات...</div></div></div>
  <div class="foot">
    <div class="secure"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>دفع آمن عبر بوابة مسار</div>
    <div style="margin-top:6px">© 2026 أكاديمية مسار — معهد تمكين</div>
  </div>
</div>

<script>
/* ============ الإعدادات ============ */
var ORDERS_URL = 'https://script.google.com/macros/s/AKfycbzdbbZqhVSENHtXhF366KpzZRDKMazE3hKJlrhxUSzS9h3r945KL7eqtxAAWHYcX-yCMA/exec';
var MEMBER_URL = 'https://script.google.com/macros/s/AKfycbzCehigMhjfTqti8QlGvjp1U90fxZxPEMrTlDZsKip3fMhSdniWb8hzkiEaCY0X9ZUK/exec';
var CART_URL   = '/masar-cart';
var CKEY       = 'masar_cart';

/* كود المدرب المُحيل من الرابط */
var REF = (function(){ try{ var r=new URLSearchParams(location.search).get('ref'); return r?String(r).trim():''; }catch(e){ return ''; } })();

/* ============ أدوات ============ */
function arNum(n){ return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d];}); }
function fmtPrice(p){ return (Math.round(Number(p)*1000)/1000).toString(); }

/* ============ تحميل اسم المدرب (اختياري) ============ */
function loadTrainerName(){
  if(!REF) return;
  var cb = 'cb_m_' + Date.now();
  window[cb] = function(d){
    try{
      if(d && d.ok && d.name){
        document.getElementById('byName').textContent = d.name;
        document.getElementById('byBox').style.display = 'inline-block';
      }
    }catch(e){}
    try{ delete window[cb]; }catch(e){}
    if(sc && sc.parentNode) sc.parentNode.removeChild(sc);
  };
  var sc = document.createElement('script');
  sc.src = MEMBER_URL + '?action=verify&memberId=' + encodeURIComponent(REF) + '&callback=' + cb + '&t=' + Date.now();
  sc.onerror = function(){ try{ delete window[cb]; }catch(e){} };
  document.body.appendChild(sc);
}

/* ============ تحميل باقات العمولة ============ */
function loadPackages(){
  fetch(ORDERS_URL + '?action=commissionPackages&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      var pkgs = (d && d.packages) ? d.packages : [];
      render(pkgs);
    })
    .catch(function(){
      document.getElementById('list').innerHTML =
        '<div class="state">تعذّر تحميل الباقات — حدّث الصفحة.</div>';
    });
}

function render(pkgs){
  var box = document.getElementById('list');
  if(!pkgs.length){
    box.innerHTML = '<div class="state">لا توجد باقات متاحة حالياً.</div>';
    return;
  }
  box.innerHTML = pkgs.map(function(p){
    var img = p.image ? '<img class="pkg-img" src="'+p.image+'" alt="'+(p.name||'')+'" onerror="this.style.display=\'none\'">' : '';
    var priceHtml = Number(p.price) <= 0
      ? '<span class="free">مجانية</span>'
      : '<b>'+fmtPrice(p.price)+'</b><span>د.ك</span>';
    var feats = (p.features && p.features.length)
      ? '<ul class="pkg-feats">'+ p.features.map(function(f){
          return '<li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'+f+'</li>';
        }).join('') +'</ul>'
      : '';
    var inc = (p.count && p.count>0) ? '<div class="pkg-inc">🎓 تشمل '+arNum(p.count)+' دورة تدريبية</div>' : '';
    var cert = (p.hasCertFee && Number(p.certFee)>0)
      ? '<div class="cert-note">+ '+fmtPrice(p.certFee)+' د.ك لكل شهادة معتمدة (اختيارية)</div>' : '';
    var desc = p.desc ? '<div class="pkg-desc">'+p.desc+'</div>' : '';
    return '<div class="pkg">'+ img +
      '<div class="pkg-body">'+
        '<div class="pkg-name">'+((p.type==='عضوية')?'🎫 ':'')+(p.name||'باقة')+'</div>'+ desc +
        '<div class="pkg-price">'+priceHtml+'</div>'+
        feats + inc + cert +
        '<button class="buy" onclick="buy(\''+String(p.id).replace(/'/g,"\\'")+'\','+(p.hasCertFee?'true':'false')+')">'+
          '<svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>'+
          'اشترِ الباقة</button>'+
      '</div></div>';
  }).join('');
}

/* ============ الشراء: نسبة الإحالة + إضافة للسلة + تحويل ============ */
function buy(pkgId, hasCertFee){
  /* 1) خزّن كود المُحيل ٣٠ يوم */
  try{ if(REF) localStorage.setItem('masar_ref', JSON.stringify({ code:REF, t:Date.now() })); }catch(e){}
  /* 2) أضف الباقة للسلة بنفس صيغة مسار */
  try{
    var cart = JSON.parse(localStorage.getItem(CKEY) || '[]');
    var exists = cart.some(function(it){ return it.kind==='package' && String(it.id)===String(pkgId); });
    if(!exists){ cart.push({ kind:'package', id:pkgId, cert:(hasCertFee ? null : false) }); }
    localStorage.setItem(CKEY, JSON.stringify(cart));
  }catch(e){}
  /* 3) حوّل لسلة مسار */
  location.href = CART_URL;
}

/* ============ تشغيل ============ */
loadTrainerName();
loadPackages();
</script>
</body>
</html>
