<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TMadmin — لوحة المالك</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#5C0F0F; --crimson-2:#7A1515; --cream:#FAF7F2; --cream-2:#F2EDE5;
  --text:#1A0808; --muted:#7A6060; --white:#fff; --line:rgba(92,15,15,.09);
  --green:#2E7D32; --green-bg:#E8F5E9; --yellow:#B26A00; --yellow-bg:#FFF8E1;
  --blue:#1565C0; --blue-bg:#E3F2FD; --red:#C62828; --red-bg:#FDECEC;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:inherit}

/* ===== الدخول ===== */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--crimson);z-index:50;padding:16px}
.gate-box{background:var(--cream);border-radius:20px;padding:36px 28px;width:100%;max-width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gate-box .logo{font-weight:900;font-size:30px;color:var(--crimson);letter-spacing:1px}
.gate-box p{color:var(--muted);margin:6px 0 22px}
.gate-box input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:22px;letter-spacing:8px;background:#fff;outline:none}
.gate-box input:focus{border-color:var(--crimson)}
.gate-box .err{color:var(--red);min-height:22px;margin-top:8px;font-size:13px}
.btn{background:var(--crimson);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;transition:.15s}
.btn:hover{background:var(--crimson-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--crimson);border:1.5px solid var(--crimson)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.gate-box .btn{width:100%;margin-top:6px}

/* ===== الهيدر ===== */
header{background:var(--crimson);color:#fff;padding:16px 20px 0;position:sticky;top:0;z-index:10}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1200px;margin:auto}
.top h1{font-size:20px;font-weight:900}
.top h1 small{font-weight:500;opacity:.7;font-size:13px;margin-right:6px}
.top-actions{display:flex;gap:8px;align-items:center}
.top select{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 10px;outline:none}
.top select option{color:var(--text)}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:7px 11px;cursor:pointer}
nav{display:flex;gap:4px;max-width:1200px;margin:14px auto 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:transparent;color:rgba(255,255,255,.7);border:0;padding:11px 16px;border-radius:12px 12px 0 0;font-weight:700;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--cream);color:var(--crimson)}

main{max-width:1200px;margin:auto;padding:20px 16px 60px}
.view{display:none}.view.on{display:block}

/* ===== البطاقات ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:16px;padding:16px;border:1px solid var(--line)}
.kpi .n{font-size:28px;font-weight:900;color:var(--crimson);line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:18px}
.card{background:#fff;border-radius:16px;border:1px solid var(--line);padding:18px;margin-bottom:14px}
.card h3{font-size:16px;font-weight:800;color:var(--crimson);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 .sub{font-size:12px;color:var(--muted);font-weight:500}

/* ترتيب */
.rank{list-style:none}
.rank li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.rank li:last-child{border:0}
.rank .pos{width:26px;height:26px;border-radius:50%;background:var(--cream-2);color:var(--crimson);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.rank li:first-child .pos{background:var(--crimson);color:#fff}
.rank .nm{flex:1;min-width:0}
.rank .nm b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm span{font-size:12px;color:var(--muted)}
.rank .val{font-weight:900;color:var(--crimson)}
.bar{height:5px;background:var(--cream-2);border-radius:5px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--crimson);border-radius:5px}

/* جدول */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--cream-2);color:var(--crimson);font-weight:800;text-align:right;padding:10px;white-space:nowrap;font-size:13px}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:#FFFCF8}
.num{font-weight:800;text-align:center}
th.num{text-align:center}

.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.p-green{background:var(--green-bg);color:var(--green)}
.p-yellow{background:var(--yellow-bg);color:var(--yellow)}
.p-blue{background:var(--blue-bg);color:var(--blue)}
.p-red{background:var(--red-bg);color:var(--red)}
.p-gray{background:var(--cream-2);color:var(--muted)}

/* اختيار */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:30px;padding:8px 16px;cursor:pointer;font-weight:700;color:var(--text)}
.chip.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.chip small{font-weight:500;opacity:.7;margin-right:4px}

.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;outline:none;margin-bottom:14px}
.search:focus{border-color:var(--crimson)}

/* موظف */
.emp-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--crimson);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.emp-head h2{font-size:20px;font-weight:900}
.emp-head p{color:var(--muted);font-size:13px}
.absent-list{display:flex;flex-wrap:wrap;gap:6px}
.staff-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.staff-bar .chips{margin:0;flex:1}
.shift-line{font-size:13px;color:var(--muted);margin-top:3px}
.shift-line b{color:var(--crimson)}
.today-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.today-row:last-child{border:0}
.today-row b{flex:1;min-width:120px}
.today-row .t{font-size:13px;color:var(--muted);min-width:90px}
/* إعدادات الدوام */
.sch-days{display:flex;flex-wrap:wrap;gap:6px}
.sch-days button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer;color:var(--muted)}
.sch-days button.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.sch-times{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.sch-times label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}
.sch-times input{padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);outline:none}
.sch-times input:focus{border-color:var(--crimson);background:#fff}
.sch-emp{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.sch-emp.custom{background:#FFFCF8;border-color:rgba(92,15,15,.2)}
.sch-emp-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sch-emp-top b{flex:1}
.sch-save{position:sticky;bottom:12px;display:flex;gap:8px}
.per-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:10px}
.per-row .per-n{font-size:12px;font-weight:800;color:var(--crimson);min-width:54px;padding-bottom:10px}
.per-x{background:none;border:0;color:var(--red);font-size:18px;cursor:pointer;padding:0 6px 8px}
.ses{display:block;white-space:nowrap}
/* التقارير */
.rep{border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:10px;overflow:hidden}
.rep-h{display:flex;gap:8px;align-items:center;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.rep-h b{flex:1;min-width:140px}
.rep-b{border-top:1px dashed var(--line);padding:12px 14px;background:var(--cream);display:grid;gap:12px}
.rep-f h5{font-size:12.5px;color:var(--crimson);margin-bottom:4px}
.rep-f .v{white-space:pre-wrap;font-size:14px}
.rep-f table{background:#fff;border-radius:8px;font-size:13px}
.rep-f td,.rep-f th{padding:6px 8px}
.rep-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.rep-filters select{padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;outline:none;min-width:160px}

/* المهام */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.form .full{grid-column:1/-1}
.form label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:4px}
.form input,.form select,.form textarea{width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);outline:none}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--crimson);background:#fff}
.form textarea{min-height:70px;resize:vertical}
.staff-pick{display:flex;flex-wrap:wrap;gap:6px}
.staff-pick .chip{padding:6px 12px;font-size:13px}
.task{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:#fff;border-right:4px solid var(--blue)}
.task.done{border-right-color:var(--green);opacity:.75}
.task.late{border-right-color:var(--red)}
.task.prog{border-right-color:var(--yellow)}
.task-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.task b{font-size:15px}
.task .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.task .desc{font-size:14px;margin-top:8px;white-space:pre-wrap}
.task .note{background:var(--green-bg);color:var(--green);padding:8px 10px;border-radius:9px;margin-top:8px;font-size:13px}
.task-act{display:flex;gap:6px;align-items:center}
.task-act select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--cream);font-size:13px}

.empty{text-align:center;color:var(--muted);padding:30px 10px}
.loading{text-align:center;padding:50px 10px;color:var(--muted)}
.spin{width:30px;height:30px;border:3px solid var(--cream-2);border-top-color:var(--crimson);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;transition:.3s;z-index:60}
.toast.show{transform:translateX(-50%) translateY(0)}
.note-line{font-size:12px;color:var(--muted);margin-top:-8px;margin-bottom:14px}

/* ===== المدربين ===== */
.tr-layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.tr-side{position:sticky;top:130px;padding:14px;margin:0;max-height:calc(100vh - 150px);display:flex;flex-direction:column}
.tr-side .search{margin-bottom:10px}
.tr-sort{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.tr-sort button{border:1.5px solid var(--line);background:var(--cream);border-radius:9px;padding:7px 4px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.tr-sort button.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.tr-count{font-size:12px;color:var(--muted);margin:2px 4px 8px}
.tr-list{overflow-y:auto;flex:1;margin:0 -6px;padding:0 6px}
.tr-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:12px;padding:9px 8px;cursor:pointer;text-align:right;color:var(--text)}
.tr-item:hover{background:var(--cream)}
.tr-item.on{background:var(--cream-2);box-shadow:inset -3px 0 0 var(--crimson)}
.tr-rank{width:18px;font-size:11px;color:var(--muted);font-weight:700;text-align:center;flex-shrink:0}
.tr-av{width:34px;height:34px;border-radius:50%;background:var(--cream-2);color:var(--crimson);display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.tr-item.on .tr-av{background:var(--crimson);color:#fff}
.tr-nm{flex:1;min-width:0}
.tr-nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-nm small{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:4px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot-g{background:var(--green)}.dot-b{background:var(--blue)}.dot-x{background:#C9B8B8}
.tr-metric{font-size:12px;font-weight:800;color:var(--crimson);white-space:nowrap}

.tr-hero{background:linear-gradient(135deg,var(--crimson),#3E0909);color:#fff;border:0}
.tr-hero-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.tr-hero h2{font-size:22px;font-weight:900}
.tr-hero p{opacity:.75;font-size:13px;margin-top:2px}
.avatar.lg{width:60px;height:60px;font-size:26px;background:rgba(255,255,255,.15);flex-shrink:0}
.tr-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tr-kpis div{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 6px;text-align:center}
.tr-kpis b{display:block;font-size:22px;font-weight:900}
.tr-kpis span{font-size:11px;opacity:.75}

.tr-titles{display:flex;flex-wrap:wrap;gap:6px}
.tr-titles span{background:var(--cream);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:13px}
.tr-titles i{font-style:normal;color:var(--crimson);font-weight:800;font-size:12px}

.tl-month{display:flex;align-items:center;gap:10px;margin:16px 0 6px;color:var(--crimson);font-weight:800;font-size:14px}
.tl-month:first-of-type{margin-top:0}
.tl-month i{flex:1;height:1px;background:var(--line)}
.tl-month small{background:var(--cream-2);border-radius:20px;padding:1px 9px;font-size:12px}
.tl-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tl-row:last-child{border:0}
.tl-date{width:46px;text-align:center;background:var(--cream);border-radius:10px;padding:5px 0;flex-shrink:0}
.tl-row.up .tl-date{background:var(--green-bg);color:var(--green)}
.tl-date b{display:block;font-size:18px;font-weight:900;line-height:1.1}
.tl-date small{font-size:10px;color:var(--muted)}
.tl-body{flex:1;min-width:0}
.tl-body b{font-size:14px}
.tl-tags{display:flex;gap:6px;margin-top:4px;align-items:center;flex-wrap:wrap}
.tl-time{font-size:12px;color:var(--muted)}
.tl-stats{display:flex;gap:12px;align-items:center;flex-shrink:0}
.tl-stats span{text-align:center;font-size:11px;color:var(--muted)}
.tl-stats span b{display:block;font-size:15px;color:var(--text);font-weight:800}
.tl-stats .pill{font-size:12px}

@media(max-width:900px){
  .tr-layout{grid-template-columns:1fr}
  .tr-side{position:static;max-height:none}
  .tr-list{max-height:290px}
  .tr-kpis{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:560px){
  .tl-row{flex-wrap:wrap}
  .tl-stats{width:100%;padding-right:58px;gap:14px}
}

@media(max-width:600px){
  .top h1 small{display:none}
  .kpi .n{font-size:24px}
  main{padding:14px 12px 50px}
}

/* ===== النشرات والاستفسارات ===== */
.nq-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.nq-tabs .chip b{background:var(--red);color:#fff;border-radius:20px;padding:0 7px;font-size:11px;margin-right:6px}
.nq-tabs .chip.on b{background:rgba(255,255,255,.3)}
.nq-card{border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;background:#fff;border-right:4px solid var(--red)}
.nq-card.replied{border-right-color:var(--blue)}
.nq-card.closed{border-right-color:var(--green)}
.nq-card.cancel{border-right-color:#C9B8B8;opacity:.7}
.nq-card.notice{border-right-color:var(--crimson)}
.nq-card.archived{border-right-color:#C9B8B8;opacity:.7}
.nq-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.nq-top b{font-size:15px}
.nq-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nq-box{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:9px}
.nq-box .k{font-size:12px;font-weight:800;color:var(--crimson);margin-bottom:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nq-box .v{font-size:14px;white-space:pre-wrap;line-height:1.85}
.nq-box.reply{background:var(--blue-bg);border-color:rgba(21,101,192,.15)}
.nq-box.reply .k{color:var(--blue)}
.nq-box.dec{background:var(--green-bg);border-color:rgba(46,125,50,.15)}
.nq-box.dec .k{color:var(--green)}
.nq-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.nq-dec{margin-top:10px}
.nq-dec textarea{width:100%;min-height:60px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);outline:none;resize:vertical}
.nq-dec textarea:focus{border-color:var(--crimson);background:#fff}
.nq-quick{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}
.nq-quick button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.nq-quick button:hover{border-color:var(--crimson);color:var(--crimson)}
.nq-ev{border:1.5px dashed rgba(92,15,15,.2);border-radius:12px;padding:10px 12px;background:#FFFCF8}
.nq-ev .h{font-size:12px;font-weight:800;color:var(--crimson);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nq-ev label{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:13.5px;cursor:pointer;border-bottom:1px dashed var(--line)}
.nq-ev label:last-child{border:0}
.nq-ev input{width:16px;height:16px;accent-color:var(--crimson);flex-shrink:0}
.nq-ev .none{font-size:13px;color:var(--muted)}
.nq-readers{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:16mm 15mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
.pl{font-family:'Tajawal',sans-serif;color:#1A0808;direction:rtl;font-size:14px;line-height:1.9}
.pl-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #5C0F0F;padding-bottom:12px;gap:20px}
.pl-org{font-size:22px;font-weight:900;color:#5C0F0F}
.pl-sub{font-size:12px;color:#7A6060}
.pl-ref{font-size:13px;text-align:left;white-space:nowrap}
.pl-title{text-align:center;font-size:19px;font-weight:900;color:#5C0F0F;margin:22px 0 16px;letter-spacing:.5px}
.pl-meta{width:100%;border-collapse:collapse;margin-bottom:16px}
.pl-meta td{border:1px solid #DDD0C4;padding:8px 12px;font-size:13.5px}
.pl-meta td:first-child{background:#F6EFE9;color:#5C0F0F;font-weight:800;width:140px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pl-sec{margin:12px 0}
.pl-sec .k{font-weight:900;color:#5C0F0F;margin-bottom:4px}
.pl-sec .v{white-space:pre-wrap;border:1px solid #DDD0C4;border-radius:8px;padding:10px 12px}
.pl-sign{display:flex;justify-content:space-between;gap:40px;margin-top:48px}
.pl-sign div{flex:1;text-align:center;font-weight:800}
.pl-sign i{display:block;border-top:1.5px solid #999;margin-top:46px;padding-top:4px;font-style:normal;font-weight:500;font-size:12px;color:#7A6060}
.pl-foot{margin-top:28px;border-top:1px solid #DDD0C4;padding-top:8px;font-size:11px;color:#7A6060;text-align:center}

/* ===== إعدادات البصمة والبريك ===== */
.set-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.set-row b{flex:1;min-width:120px}
.set-row .hint{font-size:11.5px;color:var(--muted);font-weight:500;display:block;margin-top:2px}
.tg{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;cursor:pointer;user-select:none}
.tg input{display:none}
.tg i{width:38px;height:22px;border-radius:20px;background:#D9CFCF;position:relative;transition:.15s;flex-shrink:0}
.tg i:after{content:'';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.tg input:checked+i{background:var(--crimson)}
.tg input:checked+i:after{right:19px}
.set-lim{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700}
.set-lim input{width:70px;padding:6px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--cream);text-align:center;outline:none}
.set-lim input:disabled{opacity:.4}

/* ===== PDF التقارير ===== */
.rep-pdf{margin-right:auto;border:1px solid var(--line);background:#fff;color:var(--crimson);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:800;cursor:pointer}
.rep-pdf:hover{background:var(--crimson);color:#fff}
.pl-rep{break-inside:avoid-page;margin-bottom:18px}
.pl-rep + .pl-rep{break-before:page}
.pl-rep .rep-f{margin:10px 0}
.pl-rep .rep-f h5{font-size:13.5px;color:#5C0F0F;margin-bottom:4px}
.pl-rep table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.pl-rep th{background:#F6EFE9!important;color:#5C0F0F;border:1px solid #DDD0C4;padding:6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pl-rep td{border:1px solid #DDD0C4;padding:6px}
.pl-rep .v{white-space:pre-wrap;font-size:13px}

/* ===== أعمالي ===== */
.wk-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.wk-hero h2{font-size:22px;font-weight:900;color:var(--crimson)}
.wk-hero p{color:var(--muted);font-size:13px;margin-top:2px}
.wk-stats{display:flex;gap:8px;flex-wrap:wrap}
.wk-stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:78px}
.wk-stat b{display:block;font-size:20px;font-weight:900;line-height:1.2}
.wk-stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.wk-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wk-add .t{flex:1;min-width:220px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--cream);outline:none;font-size:15px}
.wk-add .t:focus{border-color:var(--crimson);background:#fff}
.wk-opts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.wk-opts select,.wk-opts input[type=date],.wk-opts input[type=time]{padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);outline:none;font-size:13px}
.wk-q{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:800;color:var(--muted);cursor:pointer}
.wk-q.on{background:var(--crimson);border-color:var(--crimson);color:#fff}
.wk-done-ck{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--green);cursor:pointer}
.wk-done-ck input{accent-color:var(--green);width:16px;height:16px}
.wk-notes{width:100%;margin-top:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);outline:none;min-height:60px;resize:vertical;display:none}
.wk-grp{margin:18px 0 8px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px;color:var(--crimson)}
.wk-grp i{flex:1;height:1px;background:var(--line)}
.wk-grp small{background:var(--cream-2);border-radius:20px;padding:1px 9px;font-size:12px}
.wk-grp.late{color:var(--red)}
.wk{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.wk.p-urg{border-right:4px solid var(--red)}
.wk.p-imp{border-right:4px solid var(--yellow)}
.wk.done{opacity:.7}
.wk.done .wk-t{text-decoration:line-through;color:var(--muted)}
.wk-ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--crimson);background:#fff;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:900}
.wk-ck:hover{background:var(--cream-2)}
.wk.done .wk-ck{background:var(--green);border-color:var(--green)}
.wk-body{flex:1;min-width:0}
.wk-t{font-weight:800;font-size:15px;word-break:break-word}
.wk-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center;font-size:12px;color:var(--muted)}
.wk-n{font-size:13px;color:var(--text);margin-top:6px;white-space:pre-wrap;opacity:.85}
.wk-act{display:flex;gap:4px;flex-shrink:0}
.wk-act button{border:0;background:var(--cream);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:12px;font-weight:800;color:var(--muted)}
.wk-act button:hover{background:var(--cream-2);color:var(--crimson)}
.wk-edit{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wk-edit input,.wk-edit select,.wk-edit textarea{width:100%;padding:7px 9px;border-radius:9px;border:1.5px solid var(--line);background:var(--cream);font-size:13px;outline:none}
.wk-edit .full{grid-column:1/-1}
nav button .nb{background:#fff;color:var(--crimson);border-radius:20px;padding:0 7px;font-size:11px;font-weight:900;margin-right:5px}
nav button.on .nb{background:var(--crimson);color:#fff}

/* ===== إيديو كلاود ===== */
.edu-tbl tr.click{cursor:pointer}
.edu-tbl tr.open td{background:#FFFCF8}
.edu-sub td{background:#FFFCF8!important;padding:0 10px 12px}
.edu-sub table{font-size:13px}
.edu-sub th{background:#fff;font-size:12px}
.edu-money{font-weight:900;color:var(--green);white-space:nowrap}
.edu-x{opacity:.5;text-decoration:line-through}
.edu-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.edu-tools .search{margin:0;flex:1;min-width:200px}
</style>
</head>
<body>

<!-- ===== الدخول ===== -->
<div id="gate">
  <div class="gate-box">
    <div class="logo">TMadmin</div>
    <p>لوحة المالك — معهد تمكين</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <div class="err" id="pinErr"></div>
    <button class="btn" id="pinBtn" onclick="login()">دخول</button>
  </div>
</div>

<header>
  <div class="top">
    <h1>TMadmin <small>لوحة المالك</small></h1>
    <div class="top-actions">
      <select id="month" onchange="onMonth()"></select>
      <button class="icon-btn" title="تحديث" onclick="refresh()">↻</button>
      <button class="icon-btn" title="خروج" onclick="logout()">⎋</button>
    </div>
  </div>
  <nav id="nav">
    <button data-v="mywork" class="on">أعمالي <span class="nb" id="wkBadge" style="display:none"></span></button>
    <button data-v="courses">الدورات</button>
    <button data-v="edu">إيديو كلاود</button>
    <button data-v="demand">الأكثر طلباً</button>
    <button data-v="staff">الموظفين</button>
    <button data-v="reports">التقارير</button>
    <button data-v="trainers">المدربين</button>
    <button data-v="tasks">المهام</button>
    <button data-v="notices">النشرات والاستفسارات</button>
  </nav>
</header>

<main>
  <section class="view on" id="v-mywork"></section>
  <section class="view" id="v-courses"></section>
  <section class="view" id="v-edu"></section>
  <section class="view" id="v-demand"></section>
  <section class="view" id="v-staff"></section>
  <section class="view" id="v-reports"></section>
  <section class="view" id="v-trainers"></section>
  <section class="view" id="v-tasks"></section>
  <section class="view" id="v-notices"></section>
</main>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ضع رابط نشر TMAdmin.gs هنا */
const API = 'https://script.google.com/macros/s/AKfycbz-eLL94d6hIhKEVkBSou_w344_bJGpNlQQqvqe5RT2b5T5eL20fAPJZFX2HoL3EDIkEA/exec';

let PIN = '';
let VIEW = 'mywork';
let STAFF_SEL = '';
let TRAINER_SEL = '';
const CACHE = {};
const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DAYS_AR = {Sunday:'الأحد',Monday:'الاثنين',Tuesday:'الثلاثاء',Wednesday:'الأربعاء',Thursday:'الخميس',Friday:'الجمعة',Saturday:'السبت'};

/* ===== أدوات ===== */
const $ = id => document.getElementById(id);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2400); }
function monthLabel(ym){
  if (ym === 'all') return 'كل الفترات';
  const [y, m] = ym.split('-'); return AR_MONTHS[+m - 1] + ' ' + y;
}
function fmtDate(s){
  if (!s) return '—';
  const [y, m, d] = s.split('-'); return +d + ' ' + AR_MONTHS[+m - 1] + ' ' + y;
}
function loading(id){ $(id).innerHTML = '<div class="loading"><div class="spin"></div>جاري التحميل…</div>'; }
function errBox(id, msg){ $(id).innerHTML = '<div class="empty">⚠️ ' + esc(msg) + '<br><br><button class="btn sm" onclick="refresh()">إعادة المحاولة</button></div>'; }

function api(params){
  return new Promise((resolve, reject) => {
    const cb = 'tm_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const qs = new URLSearchParams(Object.assign({}, params, { pin: PIN, callback: cb })).toString();
    const s = document.createElement('script');
    const t = setTimeout(() => { cleanup(); reject(new Error('انتهت مهلة الاتصال')); }, 30000);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = data => {
      cleanup();
      if (data && data.auth === false){ logout(true); reject(new Error('الرمز غير صحيح')); return; }
      data && data.ok ? resolve(data) : reject(new Error((data && data.error) || 'خطأ غير معروف'));
    };
    s.onerror = () => { cleanup(); reject(new Error('تعذّر الاتصال بالسكربت')); };
    s.src = API + '?' + qs;
    document.body.appendChild(s);
  });
}

/* ===== الدخول ===== */
async function login(){
  const v = $('pin').value.trim();
  if (!v) return;
  $('pinBtn').disabled = true; $('pinErr').textContent = '';
  PIN = v;
  try{
    const d = await api({ action: 'login' });
    try{ sessionStorage.setItem('tmpin', PIN); }catch(e){}
    CACHE.staffList = d.staff || [];
    fillMonths(d.months || []);
    $('gate').style.display = 'none';
    show(VIEW);
  }catch(e){
    PIN = '';
    $('pinErr').textContent = e.message;
  }finally{ $('pinBtn').disabled = false; }
}
function logout(silent){
  PIN = '';
  try{ sessionStorage.removeItem('tmpin'); }catch(e){}
  Object.keys(CACHE).forEach(k => delete CACHE[k]);
  $('pin').value = '';
  $('gate').style.display = 'flex';
  if (silent) $('pinErr').textContent = 'انتهت الجلسة، أدخل الرمز من جديد';
}
function fillMonths(list){
  const cur = new Date().toISOString().slice(0, 7);
  if (list.indexOf(cur) < 0) list.unshift(cur);
  $('month').innerHTML = list.map(m => `<option value="${m}">${monthLabel(m)}</option>`).join('')
    + '<option value="all">كل الفترات</option>';
  $('month').value = cur;
}
const M = () => $('month').value;

/* ===== التنقل ===== */
$('nav').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
  show(b.dataset.v);
});
function show(v){
  VIEW = v;
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  $('month').style.visibility = (v === 'trainers' || v === 'tasks' || v === 'notices' || v === 'mywork') ? 'hidden' : 'visible';
  ({ mywork: loadWork, edu: loadEdu, courses: loadCourses, demand: loadCourses, staff: loadStaff, reports: loadReports, trainers: loadTrainers, tasks: loadTasks, notices: loadNotices })[v]();
}
function onMonth(){ show(VIEW); }
function refresh(){ Object.keys(CACHE).forEach(k => { if (k !== 'staffList') delete CACHE[k]; }); show(VIEW); }


/* ===== أعمالي (قائمة أعمال المالك + الجدولة) — تنحفظ بتبويب «أعمالي» عن طريق سكربت الحضور ===== */
const WK_CATS = ['تمكين', 'مسار', 'إيديو كلاود', 'حكومي', 'شخصي', 'أخرى'];
let WK_TAB = 'todo', WK_CAT = '', WK_EDIT = '', WK_SAVING = false;
let WKF = { title: '', date: '', time: '', priority: 'عادي', cat: '', repeat: 'بدون', notes: '', done: false, quick: 'today' };
const wkPad = n => String(n).padStart(2, '0');
const wkYMD = d => d.getFullYear() + '-' + wkPad(d.getMonth() + 1) + '-' + wkPad(d.getDate());
const wkAdd = (ymd, n) => { const d = new Date(ymd + 'T12:00:00'); d.setDate(d.getDate() + n); return wkYMD(d); };
function wkDayLbl(ymd, today){
  if (!ymd) return '';
  if (ymd === today) return 'اليوم';
  if (ymd === wkAdd(today, 1)) return 'بكرة';
  if (ymd === wkAdd(today, -1)) return 'أمس';
  const d = new Date(ymd + 'T12:00:00');
  return DAY_SHORT[d.getDay()] + ' ' + d.getDate() + ' ' + AR_MONTHS[d.getMonth()];
}
function wkTime(t){ if (!t) return ''; const [h, m] = t.split(':').map(Number); return (h % 12 || 12) + ':' + wkPad(m) + ' ' + (h < 12 ? 'ص' : 'م'); }

async function loadWork(force){
  if (!CACHE.work || force) { if (!CACHE.work) loading('v-mywork'); }
  try{
    if (!CACHE.work || force) CACHE.work = await napi({ action: 'admin_work_list' });
    renderWork();
  }catch(e){
    $('v-mywork').innerHTML = '<div class="card"><div class="empty">⚠️ ' + esc(e.message) + '<br><br><button class="btn sm" onclick="loadWork(true)">إعادة المحاولة</button></div></div>';
  }
}
function wkBadge(){
  const d = CACHE.work; if (!d) return;
  const n = d.list.filter(w => !w.done && w.date && w.date <= d.today).length;
  const b = $('wkBadge'); if (!b) return;
  b.style.display = n ? 'inline' : 'none'; b.textContent = n;
}
function wkSaveForm(){
  if (!$('wkTitle')) return;
  WKF.title = $('wkTitle').value; WKF.time = $('wkTimeIn').value; WKF.priority = $('wkPri').value;
  WKF.cat = $('wkCat').value; WKF.repeat = $('wkRep').value; WKF.notes = $('wkNotes').value; WKF.done = $('wkDone').checked;
  if (WKF.quick === 'pick') WKF.date = $('wkDateIn').value;
}
function wkQuick(q){ wkSaveForm(); WKF.quick = q; renderWork(); if ($('wkTitle')) $('wkTitle').focus(); }

function renderWork(){
  const d = CACHE.work, today = d.today, all = d.list;
  wkBadge();
  const cats = [...new Set(all.map(w => w.cat).filter(Boolean))];
  const list = all.filter(w => !WK_CAT || w.cat === WK_CAT);
  const open = list.filter(w => !w.done);
  const late = open.filter(w => w.date && w.date < today);
  const tod = open.filter(w => w.date === today);
  const week = open.filter(w => w.date > today && w.date <= wkAdd(today, 7));
  const doneToday = list.filter(w => w.done && String(w.doneAt).slice(0, 10) === today);

  let h = `<div class="wk-hero"><div><h2>أعمالي</h2><p>${wkDayLbl(today, '') || ''} ${fmtDate(today)} · الساعة ${esc(d.now)}</p></div>
    <div class="wk-stats">
      <div class="wk-stat"><b style="color:var(--red)">${late.length}</b><span>متأخرة</span></div>
      <div class="wk-stat"><b style="color:var(--crimson)">${tod.length}</b><span>اليوم</span></div>
      <div class="wk-stat"><b style="color:var(--blue)">${week.length}</b><span>هالأسبوع</span></div>
      <div class="wk-stat"><b style="color:var(--green)">${doneToday.length}</b><span>أنجزت اليوم</span></div>
    </div></div>`;

  /* إضافة */
  const qd = { today: 'اليوم', tomorrow: 'بكرة', week: 'بعد أسبوع', none: 'بدون تاريخ', pick: 'تاريخ ثاني' };
  h += `<div class="card">
    <div class="wk-add">
      <input class="t" id="wkTitle" placeholder="شنو تبي تسوي؟ (مثال: الاتصال بديوان الخدمة المدنية بخصوص المناقصة)" value="${esc(WKF.title)}" onkeydown="if(event.key==='Enter')wkCreate()">
      <button class="btn" id="wkBtn" onclick="wkCreate()">إضافة</button>
    </div>
    <div class="wk-opts">
      ${Object.keys(qd).map(k => `<button type="button" class="wk-q ${WKF.quick === k ? 'on' : ''}" onclick="wkQuick('${k}')">${qd[k]}</button>`).join('')}
      <input type="date" id="wkDateIn" value="${esc(WKF.date)}" style="display:${WKF.quick === 'pick' ? 'inline-block' : 'none'}">
      <input type="time" id="wkTimeIn" value="${esc(WKF.time)}" title="الوقت (اختياري)">
      <select id="wkPri">${['عادي', 'مهم', 'عاجل'].map(p => `<option ${WKF.priority === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
      <select id="wkCat"><option value="">بدون قسم</option>${WK_CATS.map(c => `<option ${WKF.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      <select id="wkRep" title="التكرار">${['بدون', 'يومي', 'أسبوعي', 'شهري'].map(r => `<option value="${r}" ${WKF.repeat === r ? 'selected' : ''}>${r === 'بدون' ? 'بدون تكرار' : 'يتكرر ' + r}</option>`).join('')}</select>
      <button type="button" class="wk-q" onclick="const n=$('wkNotes');n.style.display=n.style.display==='block'?'none':'block'">+ تفاصيل</button>
      <label class="wk-done-ck"><input type="checkbox" id="wkDone" ${WKF.done ? 'checked' : ''}>أنجزته (سجّله بالمنجز)</label>
    </div>
    <textarea class="wk-notes" id="wkNotes" placeholder="تفاصيل أو ملاحظات" style="display:${WKF.notes ? 'block' : 'none'}">${esc(WKF.notes)}</textarea>
  </div>`;

  /* التبويبات + القسم */
  const doneN = list.filter(w => w.done).length;
  h += `<div class="chips">
    <button class="chip ${WK_TAB === 'todo' ? 'on' : ''}" onclick="WK_TAB='todo';wkSaveForm();renderWork()">المطلوب <small>${open.length}</small></button>
    <button class="chip ${WK_TAB === 'done' ? 'on' : ''}" onclick="WK_TAB='done';wkSaveForm();renderWork()">المنجز <small>${doneN}</small></button>
    ${cats.length ? '<span style="width:1px;background:var(--line);margin:0 4px"></span>' + ['', ...cats].map(c => `<button class="chip ${WK_CAT === c ? 'on' : ''}" onclick="WK_CAT='${esc(c)}';wkSaveForm();renderWork()">${c ? esc(c) : 'كل الأقسام'}</button>`).join('') : ''}
    <button class="chip" onclick="wkSaveForm();loadWork(true)">↻</button>
  </div>`;

  if (WK_TAB === 'todo'){
    const sortT = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99') || ({ 'عاجل': 0, 'مهم': 1 }[a.priority] ?? 2) - ({ 'عاجل': 0, 'مهم': 1 }[b.priority] ?? 2);
    const groups = [
      ['متأخرة', late, 'late'],
      ['اليوم', tod, ''],
      ['بكرة', open.filter(w => w.date === wkAdd(today, 1)), ''],
      ['هالأسبوع', open.filter(w => w.date > wkAdd(today, 1) && w.date <= wkAdd(today, 7)), ''],
      ['لاحقاً', open.filter(w => w.date > wkAdd(today, 7)), ''],
      ['بدون تاريخ', open.filter(w => !w.date), '']
    ];
    let any = false;
    groups.forEach(([t, arr, cls]) => {
      if (!arr.length) return; any = true;
      h += `<div class="wk-grp ${cls}"><span>${t}</span><i></i><small>${arr.length}</small></div>` + arr.slice().sort(sortT).map(w => wkItem(w, today)).join('');
    });
    if (!any) h += '<div class="card"><div class="empty">ما عندك شي مطلوب 👌 — أضف أول عمل من فوق</div></div>';
  } else {
    const done = list.filter(w => w.done).sort((a, b) => String(b.doneAt).localeCompare(String(a.doneAt)));
    if (!done.length) h += '<div class="card"><div class="empty">ما سجّلت إنجازات للحين</div></div>';
    const byDay = {};
    done.forEach(w => { const k = String(w.doneAt).slice(0, 10) || w.date || '—'; (byDay[k] = byDay[k] || []).push(w); });
    Object.keys(byDay).sort().reverse().forEach(k => {
      h += `<div class="wk-grp"><span>${k === '—' ? 'بدون تاريخ' : wkDayLbl(k, today)}</span><i></i><small>${byDay[k].length} إنجاز</small></div>` + byDay[k].map(w => wkItem(w, today)).join('');
    });
  }
  $('v-mywork').innerHTML = h;
}
function wkItem(w, today){
  const idx = CACHE.work.list.indexOf(w);
  const pri = w.priority === 'عاجل' ? 'p-urg' : w.priority === 'مهم' ? 'p-imp' : '';
  const dateLbl = w.date ? wkDayLbl(w.date, today) : '';
  let h = `<div class="wk ${pri} ${w.done ? 'done' : ''}">
    <button class="wk-ck" title="${w.done ? 'رجّعه مفتوح' : 'تم'}" onclick="wkToggle(${idx})">${w.done ? '✓' : ''}</button>
    <div class="wk-body"><div class="wk-t">${esc(w.title)}</div>
      <div class="wk-meta">
        ${dateLbl ? `<span class="pill ${!w.done && w.date < today ? 'p-red' : w.date === today ? 'p-yellow' : 'p-gray'}">📅 ${esc(dateLbl)}</span>` : ''}
        ${w.time ? `<span class="pill p-blue">⏰ ${wkTime(w.time)}</span>` : ''}
        ${w.priority !== 'عادي' ? `<span class="pill ${w.priority === 'عاجل' ? 'p-red' : 'p-yellow'}">${esc(w.priority)}</span>` : ''}
        ${w.cat ? `<span class="pill p-gray">${esc(w.cat)}</span>` : ''}
        ${w.repeat && w.repeat !== 'بدون' ? `<span class="pill p-gray">🔁 ${esc(w.repeat)}</span>` : ''}
        ${w.done && w.doneAt ? `<span>أُنجز ${esc(String(w.doneAt).slice(11))}</span>` : ''}
      </div>
      ${w.notes ? `<div class="wk-n">${esc(w.notes)}</div>` : ''}
      ${WK_EDIT === w.id ? `<div class="wk-edit">
        <input class="full" id="we-t" value="${esc(w.title)}">
        <input type="date" id="we-d" value="${esc(w.date)}"><input type="time" id="we-h" value="${esc(w.time)}">
        <select id="we-p">${['عادي', 'مهم', 'عاجل'].map(p => `<option ${w.priority === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
        <select id="we-c"><option value="">بدون قسم</option>${WK_CATS.map(c => `<option ${w.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
        <select id="we-r" class="full">${['بدون', 'يومي', 'أسبوعي', 'شهري'].map(r => `<option value="${r}" ${w.repeat === r ? 'selected' : ''}>${r === 'بدون' ? 'بدون تكرار' : 'يتكرر ' + r}</option>`).join('')}</select>
        <textarea class="full" id="we-n" placeholder="تفاصيل">${esc(w.notes)}</textarea>
        <button class="btn sm" onclick="wkSaveEdit(${idx})">حفظ</button><button class="btn ghost sm" onclick="WK_EDIT='';renderWork()">إلغاء</button>
      </div>` : ''}
    </div>
    <div class="wk-act">
      ${!w.done ? `<button title="أجّلها لبكرة" onclick="wkPostpone(${idx})">بكرة ⏭</button>` : ''}
      <button title="تعديل" onclick="wkSaveForm();WK_EDIT='${esc(w.id)}';renderWork()">✎</button>
      <button title="حذف" onclick="wkDel(${idx})">🗑</button>
    </div></div>`;
  return h;
}
async function wkCreate(){
  if (WK_SAVING) return;
  wkSaveForm();
  const title = WKF.title.trim();
  if (!title){ $('wkTitle').focus(); return toast('اكتب العمل'); }
  const today = CACHE.work.today;
  const date = WKF.done ? today : WKF.quick === 'today' ? today : WKF.quick === 'tomorrow' ? wkAdd(today, 1) : WKF.quick === 'week' ? wkAdd(today, 7) : WKF.quick === 'pick' ? WKF.date : '';
  if (WKF.quick === 'pick' && !date) return toast('اختر التاريخ');
  WK_SAVING = true; $('wkBtn').disabled = true;
  try{
    const r = await napi({ action: 'admin_work_add', title, date, time: WKF.time, priority: WKF.priority, cat: WKF.cat, repeat: WKF.repeat, notes: WKF.notes.trim(), done: WKF.done });
    toast(r.message || 'انضاف ✓');
    WKF = { title: '', date: '', time: '', priority: 'عادي', cat: '', repeat: 'بدون', notes: '', done: false, quick: 'today' };
    await loadWork(true);
    if ($('wkTitle')) $('wkTitle').focus();
  }catch(e){ toast(e.message); if ($('wkBtn')) $('wkBtn').disabled = false; }
  WK_SAVING = false;
}
async function wkToggle(i){
  const w = CACHE.work.list[i]; wkSaveForm();
  w.done = !w.done; renderWork();
  try{ const r = await napi({ action: 'admin_work_done', id: w.id, done: w.done }); toast(r.message || 'تم'); loadWork(true); }
  catch(e){ w.done = !w.done; renderWork(); toast(e.message); }
}
async function wkPostpone(i){
  const w = CACHE.work.list[i], today = CACHE.work.today; wkSaveForm();
  const nd = wkAdd(w.date && w.date > today ? w.date : today, 1);
  try{ await napi({ action: 'admin_work_update', id: w.id, date: nd }); toast('تأجلت لـ ' + wkDayLbl(nd, today)); loadWork(true); }
  catch(e){ toast(e.message); }
}
async function wkSaveEdit(i){
  const w = CACHE.work.list[i];
  const b = { action: 'admin_work_update', id: w.id, title: $('we-t').value, date: $('we-d').value, time: $('we-h').value,
              priority: $('we-p').value, cat: $('we-c').value, repeat: $('we-r').value, notes: $('we-n').value };
  try{ await napi(b); WK_EDIT = ''; toast('تم التعديل ✓'); loadWork(true); }
  catch(e){ toast(e.message); }
}
async function wkDel(i){
  const w = CACHE.work.list[i];
  if (!confirm('حذف «' + w.title + '»؟')) return;
  wkSaveForm();
  try{ await napi({ action: 'admin_work_delete', id: w.id }); toast('انحذف'); loadWork(true); }
  catch(e){ toast(e.message); }
}

/* ===== الدورات ===== */
async function getCourses(){
  const k = 'c_' + M();
  if (!CACHE[k]) CACHE[k] = await api({ action: 'courses', month: M() });
  return CACHE[k];
}
async function loadCourses(){
  const target = VIEW === 'demand' ? 'v-demand' : 'v-courses';
  loading(target);
  try{
    const d = await getCourses();
    VIEW === 'demand' ? renderDemand(d) : renderCourses(d);
  }catch(e){ errBox(target, e.message); }
}

function rankList(items, field, label, emptyMsg){
  if (!items.length) return `<div class="empty">${emptyMsg}</div>`;
  const max = Math.max(...items.map(x => x[field])) || 1;
  return '<ul class="rank">' + items.map((c, i) => `
    <li><div class="pos">${i + 1}</div>
      <div class="nm"><b>${esc(c.name)}</b><span>${esc(c.trainer || '')}${c.date ? ' · ' + fmtDate(c.date) : ''}</span>
        <div class="bar"><i style="width:${Math.round(c[field] * 100 / max)}%"></i></div></div>
      <div class="val">${c[field]} <small style="font-weight:500;color:var(--muted);font-size:11px">${label}</small></div>
    </li>`).join('') + '</ul>';
}

function renderCourses(d){
  const t = d.totals;
  let h = `
  <div class="kpis">
    <div class="kpi"><div class="n">${t.courses}</div><div class="l">دورة</div><div class="s">${t.online} أونلاين · ${t.onsite} حضوري</div></div>

    <div class="kpi"><div class="n">${t.attended}</div><div class="l">حضروا</div><div class="s">نسبة الحضور ${t.rate}%</div></div>
    <div class="kpi"><div class="n">${t.certs}</div><div class="l">شهادة صادرة</div></div>
  </div>
  <div class="grid2">
    <div class="card"><h3>الأعلى حضوراً <span class="sub">${monthLabel(d.month)}</span></h3>${rankList(d.topAttendance, 'attended', 'حاضر', 'ما فيه حضور مسجّل لهالشهر')}</div>
    <div class="card"><h3>الأكثر شهادات <span class="sub">${monthLabel(d.month)}</span></h3>${rankList(d.topCerts, 'certs', 'شهادة', 'ما صدرت شهادات لدورات هالشهر')}</div>
  </div>

      <th class="num">مسجلين</th><th class="num">حضروا</th><th class="num">نسبة</th><th class="num">شهادات</th></tr></thead><tbody>
      ${d.courses.map(c => `<tr>

        <td class="num">${c.regs}</td><td class="num">${c.attended}</td>

        <td class="num">${c.certs}</td></tr>`).join('')}
      </tbody></table></div>`;
  h += '</div>';

function diagBox(d){
  const g = d.diag; if (!g) return '';
  const miss = (g.regMissing || []).length + (g.certMissing || []).length;
  if (d.totals.regs > 0 && !miss) return '';
  const li = arr => arr.map(x => `<li style="padding:4px 0">${esc(x.name)} <span class="pill p-gray">${x.n}</span></li>`).join('');
  return `<div class="card" style="border-color:var(--yellow);background:var(--yellow-bg)">
    <h3 style="color:var(--yellow)">فحص الربط <span class="sub">صوّرها وأرسلها لو الأرقام مو مضبوطة</span></h3>
    <div style="font-size:13px;line-height:1.9">
      تبويب التسجيلات: ${g.regRows || 0} صف · انربط ${g.regMatched || 0} · مستثنى (اشتراك/غير مكتمل) ${g.regSkipped || 0}<br>

/* ===== الموظفين ===== */
const DAY_SHORT = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const minTxt = m => m >= 60 ? Math.floor(m / 60) + ' س' + (m % 60 ? ' ' + (m % 60) + ' د' : '') : m + ' د';
function daysTxt(days){
  const d = days.slice().sort();
  const run = d.length > 1 && d.every((x, i) => i === 0 || x === d[i - 1] + 1);
  return run ? DAY_SHORT[d[0]] + ' – ' + DAY_SHORT[d[d.length - 1]] : d.map(x => DAY_SHORT[x]).join('، ');
}
const ltr = x => `<span dir="ltr" style="unicode-bidi:isolate">${x}</span>`;
const perTxt = sh => (sh.periods || []).map(p => ltr(p.start + ' – ' + p.end)).join(' و ');
function shiftTxt(sh){ return `<b>${daysTxt(sh.days)}</b> · <b>${perTxt(sh)}</b> · سماحية ${sh.grace} د`; }

async function loadStaff(){
  loading('v-staff');
  try{
    const ym = M() === 'all' ? new Date().toISOString().slice(0, 7) : M();
    const k = 's_' + ym;
    const bk = 'b_' + ym;
    await Promise.all([
      CACHE[k] ? null : api({ action: 'staff', month: ym }).then(d => { CACHE[k] = d; }),
      CACHE[bk] ? null : napi({ action: 'admin_breaks', month: ym }).then(d => { CACHE[bk] = d; }, e => { CACHE[bk] = { ok: false, err: e.message, byEmp: {} }; })
    ]);
    renderStaff(CACHE[k]);
  }catch(e){ errBox('v-staff', e.message); }
}
function todayPill(t){
  if (!t) return '';
  return ({
    present: `<span class="pill p-green">${t.inside ? 'بالدوام' : 'حاضر'}</span>`,
    partial: `<span class="pill p-red">غاب فترة</span>`,
    late: `<span class="pill p-yellow">متأخر ${minTxt(t.lateMin)}</span>`,
    absent: `<span class="pill p-red">غايب — ما سجل حضور</span>`,
    pending: `<span class="pill p-gray">لسه ما بدا دوامه</span>`,
    off: `<span class="pill p-gray">مو يوم دوامه</span>`,
    holiday: `<span class="pill p-blue">عطلة: ${esc(t.name || '')}</span>`
  })[t.status] || '';
}
function renderStaff(d){

    `</div><button class="btn ghost sm" onclick="openSched()">⚙︎ أوقات الدوام</button><button class="btn ghost sm" onclick="openPunchSet()">☕ البصمة والبريك</button></div>`;

  }

  const s = d.staff.find(x => x.name === STAFF_SEL);
  h += `<div class="card">
    <div class="emp-head"><div class="avatar">${esc(s.name.trim()[0] || '؟')}</div>

    <div class="kpis" style="margin-bottom:0">
      <div class="kpi"><div class="n" style="color:var(--green)">${s.present}</div><div class="l">يوم داوم</div><div class="s">من ${s.workDays} يوم دوام</div></div>
      <div class="kpi"><div class="n" style="color:var(--red)">${s.absent}</div><div class="l">يوم غياب</div></div>
      <div class="kpi"><div class="n" style="color:var(--yellow)">${s.late}</div><div class="l">يوم تأخير</div><div class="s">${s.lateMins ? 'مجموع ' + minTxt(s.lateMins) : '—'}</div></div>
      <div class="kpi"><div class="n" style="color:var(--yellow)">${s.early}</div><div class="l">خروج مبكر</div></div>
      ${s.shift.periods.length > 1 ? `<div class="kpi"><div class="n" style="color:var(--red)">${s.missed}</div><div class="l">فترة فايتة</div><div class="s">حضر يوم وغاب فترة</div></div>` : ''}
      <div class="kpi"><div class="n">${s.hours}</div><div class="l">ساعة دوام</div><div class="s">معدل ${s.avgHours} س/يوم</div></div>
      <div class="kpi"><div class="n" style="color:var(--muted)">${s.incomplete}</div><div class="l">يوم ناقص</div><div class="s">بدون تسجيل خروج</div></div>
      <div class="kpi"><div class="n" style="color:var(--blue)">${minTxt(bOf(s.name).total)}</div><div class="l">مجموع البريك</div><div class="s">${bOf(s.name).count} بريك${bOf(s.name).over ? ' · تجاوز الحد ' + bOf(s.name).over + ' يوم' : ''}</div></div>

      s.missedPeriods.map(a => `<span class="pill p-red">${DAYS_AR[a.dayName] || a.dayName} ${fmtDate(a.date)} · ${ltr(a.period)}</span>`).join('') + '</div></div>';
  }
  if (s.lateDays.length || s.earlyDays.length){
    h += `<div class="grid2">`;
    if (s.lateDays.length) h += `<div class="card" style="margin:0"><h3>أيام التأخير <span class="sub">${s.lateDays.length} يوم · ${minTxt(s.lateMins)}</span></h3><div class="absent-list">` +
      s.lateDays.map(a => `<span class="pill p-yellow">${DAYS_AR[a.dayName] || a.dayName} ${fmtDate(a.date)} · ${minTxt(a.lateMin)}${s.shift.periods.length > 1 ? ' · فترة ' + ltr(a.period) : ''}</span>`).join('') + '</div></div>';
    if (s.earlyDays.length) h += `<div class="card" style="margin:0"><h3>خروج قبل الوقت <span class="sub">${s.earlyDays.length} يوم</span></h3><div class="absent-list">` +
      s.earlyDays.map(a => `<span class="pill p-yellow">${DAYS_AR[a.dayName] || a.dayName} ${fmtDate(a.date)} · قبل ${minTxt(a.earlyMin)}${s.shift.periods.length > 1 ? ' · فترة ' + ltr(a.period) : ''}</span>`).join('') + '</div></div>';
    h += `</div>`;
  }

  h += `<div class="card"><h3>سجل الدوام</h3>`;

  else h += `<div class="tbl-wrap"><table><thead><tr><th>اليوم</th><th>التاريخ</th><th>الدخول</th><th>الخروج</th><th class="num">البريك</th><th class="num">المدة</th><th></th></tr></thead><tbody>` +

      const outCol = x.sessions.map(z => `<span class="ses">${z.out ? esc(z.out) : '<span class="pill p-yellow">بدون خروج</span>'}</span>`).join('') +

      const missed = per.filter(q => q.missed).map(q => `<span class="pill p-red">غاب فترة ${ltr(q.label)}</span>`).join(' ');
      return `<tr><td>${DAYS_AR[x.dayName] || x.dayName}${x.holiday ? ' <span class="pill p-blue">عطلة</span>' : x.offDay ? ' <span class="pill p-gray">مو يوم دوامه</span>' : ''}${missed ? '<br>' + missed : ''}</td><td style="white-space:nowrap">${fmtDate(x.date)}</td>
        <td>${inCol}</td><td>${outCol}</td>
        <td class="num">${(() => { const t = bOf(s.name).days[x.date]; if (!t) return '—';
          const tip = (t.list || []).map(b => b.start + ' ← ' + (b.end || 'مفتوح')).join(' | ');

    }).join('') + '</tbody></table></div>';
  h += '</div>';
  h += `<p class="note-line" style="margin-top:0">الغياب ينحسب بس بأيام دوام الموظف، ومن أول يوم سجل فيه حضور${s.from ? ' (' + fmtDate(s.from) + ')' : ''}. التأخير = الدخول بعد وقت البداية + السماحية.</p>`;
  $('v-staff').innerHTML = h;
}

/* ===== إعدادات أوقات الدوام ===== */
let SCH = null;
async function openSched(){
  loading('v-staff');
  try{
    const d = await api({ action: 'schedule' });
    const sc = JSON.parse(JSON.stringify(d.schedule));
    const names = (d.staff || []).map(s => s.name);
    /* نربط الدوام الخاص بالأسماء الحالية */
    const staff = {};
    Object.keys(sc.staff || {}).forEach(k => {
      const n = names.find(x => trNorm(x).trim() === trNorm(k).trim()) || k;
      staff[n] = sc.staff[k];
      if (names.indexOf(n) < 0) names.push(n);
    });
    sc.staff = staff;
    SCH = { sc, names };
    renderSched();
  }catch(e){ errBox('v-staff', e.message); }
}
function schShift(scope){ return scope === 'def' ? SCH.sc.def : SCH.sc.staff[SCH.names[scope]]; }
function schDaysHtml(scope, sh){
  return '<div class="sch-days">' + [0,1,2,3,4,5,6].map(d =>
    `<button type="button" class="${sh.days.indexOf(d) > -1 ? 'on' : ''}" onclick="schDay(${scope === 'def' ? "'def'" : scope},${d},this)">${DAY_SHORT[d]}</button>`).join('') + '</div>';
}
function schTimesHtml(scope, sh){
  const sc = scope === 'def' ? "'def'" : scope;
  const names = ['الأولى', 'الثانية', 'الثالثة'];
  return sh.periods.map((p, i) => `<div class="per-row">
      <span class="per-n">${sh.periods.length > 1 ? 'الفترة ' + names[i] : 'الدوام'}</span>
      <div class="sch-times" style="margin:0"><div><label>يبدأ</label><input type="time" value="${p.start}" onchange="schPer(${sc},${i},'start',this.value)"></div>
      <div><label>ينتهي</label><input type="time" value="${p.end}" onchange="schPer(${sc},${i},'end',this.value)"></div></div>
      ${sh.periods.length > 1 ? `<button class="per-x" title="حذف الفترة" onclick="schDelPer(${sc},${i})">✕</button>` : ''}
    </div>`).join('') +
    `<div class="per-row">${sh.periods.length < 3 ? `<button class="btn ghost sm" onclick="schAddPer(${sc})">+ إضافة فترة</button>` : ''}
      <div class="sch-times" style="margin:0"><div><label>سماحية التأخير (دقيقة)</label><input type="number" min="0" max="180" value="${sh.grace}" style="width:120px" onchange="schSet(${sc},'grace',+this.value||0)"></div></div></div>`;
}
function schPer(scope, i, f, v){ schShift(scope).periods[i][f] = v; }
function schAddPer(scope){
  const sh = schShift(scope), last = sh.periods[sh.periods.length - 1];
  const h = Math.min(22, +last.end.slice(0, 2) + 2);
  sh.periods.push({ start: String(h).padStart(2, '0') + ':00', end: String(Math.min(23, h + 4)).padStart(2, '0') + ':00' });
  renderSched();
}
function schDelPer(scope, i){ schShift(scope).periods.splice(i, 1); renderSched(); }
function renderSched(){
  const sc = SCH.sc;
  let h = `<div class="staff-bar"><h2 style="font-size:19px;font-weight:900;color:var(--crimson);flex:1">⚙︎ أوقات الدوام</h2>
      <button class="btn ghost sm" onclick="SCH=null;loadStaff()">رجوع</button></div>
    <div class="card"><h3>الدوام العام <span class="sub">ينطبق على كل الموظفين إلا اللي لهم دوام خاص</span></h3>
      <label style="font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:6px">أيام الدوام</label>
      ${schDaysHtml('def', sc.def)}${schTimesHtml('def', sc.def)}
      <p class="note-line" style="margin:10px 0 0">لو الدوام فترتين (صباحي ومسائي) اضغط «+ إضافة فترة». الموظف يسجل دخول وخروج لكل فترة، والتأخير والغياب ينحسبون لكل فترة لحالها.</p>
      <div class="sch-times"><div><label>احتساب الغياب يبدأ من (اختياري)</label><input type="date" value="${sc.from || ''}" onchange="SCH.sc.from=this.value"></div></div>
    </div>
    <div class="card"><h3>دوام خاص لموظف <span class="sub">مثلاً دوام جزئي أو أيام مختلفة</span></h3>` +
    SCH.names.map((n, i) => {
      const sh = sc.staff[n];
      return `<div class="sch-emp ${sh ? 'custom' : ''}"><div class="sch-emp-top"><b>${esc(n)}</b>

  const shifts = [['الدوام العام', SCH.sc.def]].concat(Object.keys(SCH.sc.staff).map(n => [n, SCH.sc.staff[n]]));
  for (const [n, sh] of shifts){
    const ps = sh.periods.slice().sort((a, b) => a.start < b.start ? -1 : 1);
    for (let i = 0; i < ps.length; i++){
      if (!ps[i].start || !ps[i].end || ps[i].start >= ps[i].end) return toast(n + ': وقت النهاية لازم بعد البداية');

let TR_SORT = 'count';
const TODAY = new Date().toISOString().slice(0, 10);
const trNorm = s => String(s).replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').toLowerCase();
const initial = n => esc(String(n).replace(/^(د|أ|م)\.\s*/, '').trim()[0] || '؟');

async function loadTrainers(){
  loading('v-trainers');
  try{
    if (!CACHE.trainers){
      const d = await api({ action: 'trainers' });
      d.trainers.forEach(t => {
        const past = t.courses.filter(c => c.date && c.date <= TODAY);
        const next = t.courses.filter(c => c.date && c.date > TODAY);
        t.rate = t.regs ? Math.round(t.attended * 100 / t.regs) : 0;
        t.avg = t.count ? Math.round(t.regs / t.count) : 0;
        t.last = past.length ? past.map(c => c.date).sort().pop() : '';
        t.first = t.courses.map(c => c.date).filter(Boolean).sort()[0] || '';
        t.upcoming = next.length;
        const days = t.last ? (Date.now() - new Date(t.last).getTime()) / 864e5 : 9999;
        t.status = t.upcoming ? 'قادم' : days <= 60 ? 'نشط' : 'متوقف';
      });
      CACHE.trainers = d;
    }
    $('v-trainers').innerHTML = `
      <div class="tr-layout">
        <aside class="tr-side card">
          <input class="search" id="trSearch" placeholder="🔍 ابحث عن مدرب…" oninput="renderTrList()">
          <div class="tr-sort">
            ${[['count','الأكثر دورات'],['regs','الأكثر مسجلين'],['rate','أعلى حضور'],['last','الأحدث']].map(([k,l]) =>
              `<button class="${TR_SORT === k ? 'on' : ''}" data-s="${k}" onclick="setTrSort('${k}')">${l}</button>`).join('')}
          </div>
          <div class="tr-count" id="trCount"></div>
          <div class="tr-list" id="trList"></div>
        </aside>
        <section class="tr-main" id="trDetail"></section>
      </div>`;
    renderTrList();
  }catch(e){ errBox('v-trainers', e.message); }
}

function setTrSort(k){
  TR_SORT = k;
  document.querySelectorAll('.tr-sort button').forEach(b => b.classList.toggle('on', b.dataset.s === k));
  renderTrList();
}

function renderTrList(){
  const q = trNorm(($('trSearch') || {}).value || '');
  const all = CACHE.trainers.trainers;
  const f = all.filter(t => !q || trNorm(t.name).indexOf(q) > -1).sort((a, b) =>
    TR_SORT === 'last' ? (b.last || '').localeCompare(a.last || '') :
    TR_SORT === 'rate' ? (b.rate - a.rate) || (b.regs - a.regs) :
    (b[TR_SORT] - a[TR_SORT]) || (b.regs - a.regs));
  $('trCount').textContent = f.length + ' مدرب' + (q ? ' من ' + all.length : '');
  if (!f.length){ $('trList').innerHTML = '<div class="empty">ما فيه مدرب بهالاسم</div>'; return; }
  if (!TRAINER_SEL || !f.some(t => t.name === TRAINER_SEL)) TRAINER_SEL = f[0].name;
  const metric = t => TR_SORT === 'regs' ? t.regs + ' مسجل' : TR_SORT === 'rate' ? t.rate + '%' :
                      TR_SORT === 'last' ? (t.last ? fmtDate(t.last) : '—') : t.count + ' دورة';
  $('trList').innerHTML = f.map((t, i) => `
    <button class="tr-item ${t.name === TRAINER_SEL ? 'on' : ''}" onclick="pickTrainer(this, ${all.indexOf(t)})">
      <span class="tr-rank">${i + 1}</span>
      <span class="tr-av">${initial(t.name)}</span>
      <span class="tr-nm"><b>${esc(t.name)}</b><small><i class="dot dot-${t.status === 'نشط' ? 'g' : t.status === 'قادم' ? 'b' : 'x'}"></i>${t.status}</small></span>
      <span class="tr-metric">${metric(t)}</span>
    </button>`).join('');
  renderTrDetail();
}

function pickTrainer(el, idx){
  TRAINER_SEL = CACHE.trainers.trainers[idx].name;
  document.querySelectorAll('.tr-item').forEach(b => b.classList.toggle('on', b === el));
  renderTrDetail();
  if (window.innerWidth < 900) $('trDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function courseRow(c){
  const up = c.date > TODAY;
  return `<div class="tl-row ${up ? 'up' : ''}">
    <div class="tl-date"><b>${c.date ? +c.date.slice(8) : '—'}</b><small>${c.date ? AR_MONTHS[+c.date.slice(5, 7) - 1] : ''}</small></div>
    <div class="tl-body">
      <b>${esc(c.name)}</b>
      <div class="tl-tags"><span class="pill ${c.mode === 'أونلاين' ? 'p-blue' : 'p-yellow'}">${c.mode}</span>${up ? '<span class="pill p-green">قادمة</span>' : ''}${c.time ? `<span class="tl-time">${esc(c.time)}</span>` : ''}</div>
    </div>
    ${up ? '<div class="tl-stats"><span><b>' + c.regs + '</b>مسجل</span></div>' : `<div class="tl-stats">
      <span><b>${c.regs}</b>مسجل</span><span><b>${c.attended}</b>حضر</span><span><b>${c.certs}</b>شهادة</span>
      <span class="pill ${c.rate >= 60 ? 'p-green' : c.rate >= 30 ? 'p-yellow' : 'p-red'}">${c.rate}%</span></div>`}

function renderTrDetail(){
  const t = CACHE.trainers.trainers.find(x => x.name === TRAINER_SEL);
  if (!t){ $('trDetail').innerHTML = ''; return; }
  const upcoming = t.courses.filter(c => c.date > TODAY).sort((a, b) => a.date.localeCompare(b.date));
  const past = t.courses.filter(c => !(c.date > TODAY));
  const best = past.filter(c => c.attended > 0).slice().sort((a, b) => b.attended - a.attended).slice(0, 3);

  /* تجميع السابقة حسب الشهر */
  const groups = {};
  past.forEach(c => { const k = c.date ? c.date.slice(0, 7) : 'بدون تاريخ'; (groups[k] = groups[k] || []).push(c); });
  const gKeys = Object.keys(groups).sort().reverse();

  /* تكرار الدورات */
  const rep = {};
  t.courses.forEach(c => rep[c.name] = (rep[c.name] || 0) + 1);
  const repList = Object.keys(rep).sort((a, b) => rep[b] - rep[a]);

  $('trDetail').innerHTML = `
    <div class="card tr-hero">
      <div class="tr-hero-top">
        <div class="avatar lg">${initial(t.name)}</div>
        <div style="flex:1;min-width:0">
          <h2>${esc(t.name)}</h2>
          <p>${t.first ? 'من ' + fmtDate(t.first) : ''}${t.last ? ' · آخر دورة ' + fmtDate(t.last) : ''}</p>
        </div>
        <span class="pill ${t.status === 'نشط' ? 'p-green' : t.status === 'قادم' ? 'p-blue' : 'p-gray'}" style="font-size:13px">${t.status}</span>
      </div>
      <div class="tr-kpis">
        <div><b>${t.count}</b><span>دورة</span></div>
        <div><b>${t.unique}</b><span>عنوان مختلف</span></div>
        <div><b>${t.regs}</b><span>مسجل</span></div>
        <div><b>${t.avg}</b><span>متوسط/دورة</span></div>
        <div><b>${t.rate}%</b><span>نسبة الحضور</span></div>
        <div><b>${t.certs}</b><span>شهادة</span></div>
      </div>
    </div>

    ${upcoming.length ? `<div class="card"><h3>دورات قادمة <span class="sub">${upcoming.length}</span></h3>${upcoming.map(courseRow).join('')}</div>` : ''}

    <div class="grid2" style="margin-bottom:0">
      <div class="card"><h3>أبرز دوراته <span class="sub">حسب الحضور</span></h3>
        ${best.length ? '<ul class="rank">' + best.map((c, i) => `<li><div class="pos">${i + 1}</div>
          <div class="nm"><b>${esc(c.name)}</b><span>${fmtDate(c.date)}</span></div>
          <div class="val">${c.attended} <small style="font-weight:500;color:var(--muted);font-size:11px">حاضر</small></div></li>`).join('') + '</ul>'
          : '<div class="empty">ما فيه حضور مسجّل</div>'}
      </div>
      <div class="card"><h3>العناوين اللي يقدمها <span class="sub">${repList.length}</span></h3>
        <div class="tr-titles">${repList.map(n => `<span>${esc(n)}${rep[n] > 1 ? ` <i>×${rep[n]}</i>` : ''}</span>`).join('')}</div>
      </div>
    </div>

    <div class="card"><h3>سجل الدورات <span class="sub">${past.length} دورة</span></h3>
      ${gKeys.length ? gKeys.map(k => `
        <div class="tl-month"><span>${k === 'بدون تاريخ' ? k : monthLabel(k)}</span><i></i><small>${groups[k].length}</small></div>
        ${groups[k].map(courseRow).join('')}`).join('') : '<div class="empty">ما قدّم دورات للحين</div>'}
    </div>`;
}

/* ===== المهام ===== */
let TASK_FILTER = 'open';
let PICKED = [];
async function loadTasks(force){
  if (!CACHE.tasks || force) loading('v-tasks');
  try{
    if (!CACHE.tasks || force) CACHE.tasks = await api({ action: 'tasks' });
    renderTasks();
  }catch(e){ errBox('v-tasks', e.message); }
}
function renderTasks(){
  const d = CACHE.tasks, staff = d.staff || [];
  const tasks = d.tasks || [];
  const open = tasks.filter(t => t.status !== 'منجز').length;
  const late = tasks.filter(t => t.late).length;
  const done = tasks.filter(t => t.status === 'منجز').length;

  let h = `<div class="card"><h3>مهمة جديدة</h3>
    <div class="form">
      <div class="full"><label>الموظف (تقدر تختار أكثر من واحد)</label><div class="staff-pick">` +
      staff.map(s => `<button type="button" class="chip ${PICKED.indexOf(s.name) > -1 ? 'on' : ''}" onclick="togglePick('${esc(s.name).replace(/'/g, "\\'")}')">${esc(s.name)} <small>${esc(s.title)}</small></button>`).join('') +
      `</div></div>
      <div class="full"><label>عنوان المهمة</label><input id="tTitle" placeholder="مثال: تجهيز قاعة دورة الأحد"></div>
      <div class="full"><label>التفاصيل</label><textarea id="tDesc" placeholder="اختياري"></textarea></div>
      <div><label>الأولوية</label><select id="tPri"><option>عادية</option><option>مهمة</option><option>عاجلة</option></select></div>
      <div><label>تاريخ التسليم</label><input id="tDue" type="date"></div>
      <div><label>رابط ملف (اختياري)</label><input id="tLink" type="url" placeholder="https://drive.google.com/…"></div>
      <div class="full"><button class="btn" id="tBtn" onclick="addTask()">إرسال المهمة</button></div>
    </div></div>

    <div class="kpis">
      <div class="kpi"><div class="n" style="color:var(--blue)">${open}</div><div class="l">مفتوحة</div></div>
      <div class="kpi"><div class="n" style="color:var(--red)">${late}</div><div class="l">متأخرة</div></div>
      <div class="kpi"><div class="n" style="color:var(--green)">${done}</div><div class="l">منجزة</div></div>
    </div>
    <div class="chips">
      ${[['open', 'المفتوحة'], ['late', 'المتأخرة'], ['done', 'المنجزة'], ['all', 'الكل']].map(([k, l]) =>
        `<button class="chip ${TASK_FILTER === k ? 'on' : ''}" onclick="TASK_FILTER='${k}';renderTasks()">${l}</button>`).join('')}
    </div>`;

  const list = tasks.filter(t => TASK_FILTER === 'all' ? true : TASK_FILTER === 'done' ? t.status === 'منجز' :
    TASK_FILTER === 'late' ? t.late : t.status !== 'منجز');
  if (!list.length) h += '<div class="card"><div class="empty">ما فيه مهام هني</div></div>';
  else h += list.map(t => {
    const cls = t.status === 'منجز' ? 'done' : t.late ? 'late' : t.status === 'قيد التنفيذ' ? 'prog' : '';
    const pri = t.priority === 'عاجلة' ? 'p-red' : t.priority === 'مهمة' ? 'p-yellow' : 'p-gray';
    return `<div class="task ${cls}">
      <div class="task-top">
        <div><b>${esc(t.title)}</b>
          <div class="meta"><span>👤 ${esc(t.staff)}</span><span class="pill ${pri}">${esc(t.priority)}</span>
            ${t.due ? `<span>📅 ${fmtDate(t.due)}${t.late ? ' <span class="pill p-red">متأخرة</span>' : ''}</span>` : ''}
            <span>أُنشئت ${esc(t.created)}</span></div></div>
        <div class="task-act">
          <select onchange="setStatus('${esc(t.id)}', this.value)">
            ${['جديد', 'قيد التنفيذ', 'منجز'].map(s => `<option ${s === t.status ? 'selected' : ''}>${s}</option>`).join('')}
          </select>
          <button class="btn ghost sm" onclick="delTask('${esc(t.id)}')">حذف</button>
        </div>
      </div>
      ${t.desc ? `<div class="desc">${esc(t.desc)}</div>` : ''}
      ${/^https?:/.test(t.link) ? `<div class="meta"><a href="${esc(t.link)}" target="_blank" rel="noopener" style="color:var(--crimson)">📎 الملف المرفق</a></div>` : ''}
      ${t.note || t.doneAt ? `<div class="note">✓ ${t.doneAt ? 'أُنجزت ' + esc(t.doneAt) : ''}${t.note ? ' — ' + esc(t.note) : ''}</div>` : ''}
    </div>`;
  }).join('');
  $('v-tasks').innerHTML = h;
}
function togglePick(n){
  const i = PICKED.indexOf(n); i > -1 ? PICKED.splice(i, 1) : PICKED.push(n);
  const keep = { t: $('tTitle').value, d: $('tDesc').value, p: $('tPri').value, du: $('tDue').value, l: $('tLink').value };
  renderTasks();
  $('tTitle').value = keep.t; $('tDesc').value = keep.d; $('tPri').value = keep.p; $('tDue').value = keep.du; $('tLink').value = keep.l;
}
async function addTask(){
  const title = $('tTitle').value.trim();
  if (!PICKED.length) return toast('اختر موظف');
  if (!title) return toast('اكتب عنوان المهمة');
  $('tBtn').disabled = true;
  try{
    await api({ action: 'addTask', staff: PICKED.join('|'), title, desc: $('tDesc').value.trim(),
                priority: $('tPri').value, due: $('tDue').value, link: $('tLink').value.trim() });
    toast('انرسلت المهمة ✓');
    PICKED = [];
    loadTasks(true);
  }catch(e){ toast(e.message); $('tBtn').disabled = false; }
}
async function setStatus(id, status){
  try{ await api({ action: 'setStatus', id, status }); toast('تم التحديث'); loadTasks(true); }
  catch(e){ toast(e.message); }
}
async function delTask(id){
  if (!confirm('حذف المهمة نهائياً؟')) return;
  try{ await api({ action: 'deleteTask', id }); toast('انحذفت'); loadTasks(true); }
  catch(e){ toast(e.message); }
}

const STAFF_API = 'https://script.google.com/macros/s/AKfycbxo8IAaZ5dkS-PPmrHqHBVymJRFQKDyuvANhmbeI0wfYcrD4nV6bXA6oUctt2qPauTV/exec';
const NQ_TYPES = ['تأخير', 'غياب', 'خروج مبكر', 'عدم تسليم مهمة', 'عدم تسجيل خروج', 'أخرى'];
const NQ_TPL = {

  'عدم تسليم مهمة': 'نود الاستفسار عن أسباب عدم تسليم المهام المذكورة أعلاه في موعدها المحدد.',
  'عدم تسجيل خروج': 'نود الاستفسار عن أسباب عدم تسجيل الخروج في نظام الحضور في التواريخ المذكورة أعلاه.',
  'أخرى': ''
};
const NQ_DECISIONS = ['حفظ الاستفسار — العذر مقبول', 'تنبيه شفهي', 'لفت نظر', 'إنذار كتابي', 'خصم من الراتب'];
let NQ_TAB = 'inq', NQ_FILTER = 'pending', NQ_LIST = [], NQ_NLIST = [];
let NQF = { emp: '', type: '', facts: '', details: '', hours: '48' };
let NBF = { title: '', body: '', aud: 'الكل', pri: 'عادي' };
let NQ_EV = { key: '', loading: false, list: [], err: '' };

async function napi(body){
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 40000);
  let r;
  try{
    r = await fetch(STAFF_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({}, body, { key: PIN })), signal: ctrl.signal });
  }catch(e){ throw new Error(e.name === 'AbortError' ? 'انتهت مهلة الاتصال' : 'تعذّر الاتصال بسكربت الحضور'); }
  finally{ clearTimeout(t); }
  const txt = await r.text(); let d;
  try{ d = JSON.parse(txt); }catch(e){ throw new Error('رد غير متوقع من سكربت الحضور — تأكد إنك نشرت نسخة جديدة منه'); }
  if (d.auth === false) throw new Error('رمز دخول اللوحة مو نفس مفتاح الإدارة بسكربت الحضور (ADMIN_KEY_INITIAL) — حطه نفسه وشغّل setup');
  if (!d.ok) throw new Error(d.message || 'تعذّر الطلب');
  return d;
}
async function loadNotices(force){
  if (!CACHE.notices || force) loading('v-notices');
  try{
    if (!CACHE.notices || force) CACHE.notices = await napi({ action: 'admin_load' });
    renderNotices();
  }catch(e){
    $('v-notices').innerHTML = '<div class="card"><div class="empty">⚠️ ' + esc(e.message) + '<br><br><button class="btn sm" onclick="loadNotices(true)">إعادة المحاولة</button></div></div>';
  }
}
const nqNo = id => String(id || '').replace(/^[^-]+-/, '');
const nqN = s => trNorm(String(s || '')).replace(/\s+/g, ' ').trim();
function nqParse(s){ const m = String(s || '').match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) : null; }
function nqWhen(s){
  const d = nqParse(s); if (!d) return esc(s || '—');
  const h = d.getHours(), ap = h < 12 ? 'ص' : 'م';
  return DAY_SHORT[d.getDay()] + ' ' + d.getDate() + ' ' + AR_MONTHS[d.getMonth()] + ' · ' + (h % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0') + ' ' + ap;
}
function nqDay(ymd){ return DAY_SHORT[new Date(ymd + 'T12:00:00').getDay()] + ' ' + fmtDate(ymd); }
function nqOver(q){ const d = nqParse(q.deadline); return d && d.getTime() < Date.now(); }
function nqLateReply(q){ const a = nqParse(q.repliedAt), b = nqParse(q.deadline); return a && b && a > b; }
function nqSave(){
  if ($('nqFacts')){ NQF.facts = $('nqFacts').value; NQF.details = $('nqDetails').value; NQF.hours = $('nqHours').value; }
  if ($('nbTitle')){ NBF.title = $('nbTitle').value; NBF.body = $('nbBody').value; NBF.aud = $('nbAud').value; NBF.pri = $('nbPri').value; }
}
function nqSetTab(t){ nqSave(); NQ_TAB = t; renderNotices(); }
function nqSetFilter(f){ nqSave(); NQ_FILTER = f; renderNotices(); }

    <button class="chip ${NQ_TAB === 'ntc' ? 'on' : ''}" onclick="nqSetTab('ntc')">النشرات</button>
    <button class="chip ${NQ_TAB === 'sts' ? 'on' : ''}" onclick="nqSetTab('sts')">سجل الموظفين</button>

function nqStatusPill(q){
  if (q.status === 'بانتظار الرد') return '<span class="pill p-red">بانتظار رد الموظف</span>' + (nqOver(q) ? ' <span class="pill p-red">انتهت المهلة</span>' : '');

  if (q.status === 'مغلق') return '<span class="pill p-green">مغلق</span>';
  return '<span class="pill p-gray">ملغي</span>';
}
function nqInqCard(q, i){
