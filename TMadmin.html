      <div>${nqStatusPill(q)}</div></div>
    ${q.facts ? `<div class="nq-box"><div class="k">الوقائع</div><div class="v">${esc(q.facts)}</div></div>` : ''}
    ${q.details ? `<div class="nq-box"><div class="k">نص الاستفسار</div><div class="v">${esc(q.details)}</div></div>` : ''}
    ${q.reply ? `<div class="nq-box reply"><div class="k">رد الموظف · ${nqWhen(q.repliedAt)}${nqLateReply(q) ? ' <span class="pill p-red">بعد المهلة</span>' : ''}</div><div class="v">${esc(q.reply)}</div></div>` : ''}
    ${q.decision ? `<div class="nq-box dec"><div class="k">قرار الإدارة · ${nqWhen(q.closedAt)}</div><div class="v">${esc(q.decision)}</div></div>` : ''}
    ${open ? `<div class="nq-dec">
        <div class="nq-quick">${NQ_DECISIONS.map(x => `<button type="button" onclick="nqQuick(${i}, this.textContent)">${x}</button>`).join('')}</div>
        <textarea id="nqDec-${i}" placeholder="قرار الإدارة (يشوفه الموظف بعد الإغلاق)"></textarea></div>` : ''}
    <div class="nq-act">
      ${open ? `<button class="btn sm" onclick="nqClose(${i})">إغلاق بالقرار</button>` : ''}
      <button class="btn ghost sm" onclick="nqPrintInq(${i})">🖨 طباعة الكتاب</button>
      ${q.status === 'بانتظار الرد' ? `<button class="btn ghost sm" onclick="nqCancel(${i})">إلغاء</button>` : ''}
    </div></div>`;
}
function nqQuick(i, t){ const el = $('nqDec-' + i); el.value = el.value.trim() ? el.value.trim() + '\n' + t : t; el.focus(); }
function nqPickEmp(i){ nqSave(); NQF.emp = CACHE.notices.staff[i]; renderNotices(); }
function nqPickType(i){
  nqSave();
  const old = NQF.type; NQF.type = NQ_TYPES[i];
  if (!NQF.details.trim() || NQF.details === NQ_TPL[old]) NQF.details = NQ_TPL[NQF.type];
  renderNotices();
}

/* الوقائع من سجل الحضور والمهام */
function nqYm(offset){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + offset); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
async function nqLoadEvents(){
  const key = NQF.emp + '|' + NQF.type;
  NQ_EV = { key, loading: true, list: [], err: '' }; nqRenderEvents();
  try{
    const list = [], me = nqN(NQF.emp);
    if (NQF.type === 'عدم تسليم مهمة'){
      if (!CACHE.tasks) CACHE.tasks = await api({ action: 'tasks' });
      (CACHE.tasks.tasks || []).filter(t => t.status !== 'منجز' && nqN(t.staff).split('|').some(x => x.trim() === me) && (t.late || (t.due && t.due < TODAY)))
        .forEach(t => list.push({ date: t.due || '', text: `مهمة «${t.title}» — موعد التسليم ${t.due ? nqDay(t.due) : '—'} — الحالة: ${t.status}` }));
    } else if (NQF.type !== 'أخرى'){
      for (const ym of [nqYm(0), nqYm(-1)]){
        const k = 's_' + ym;
        if (!CACHE[k]) CACHE[k] = await api({ action: 'staff', month: ym });
        const s = (CACHE[k].staff || []).find(x => nqN(x.name) === me);
        if (!s) continue;
        const inOf = dt => ((s.days || []).find(x => x.date === dt) || {}).in || '';
        if (NQF.type === 'تأخير') (s.lateDays || []).forEach(a => list.push({ date: a.date, text: `${nqDay(a.date)} — دخول ${inOf(a.date) || '—'} (تأخير ${minTxt(a.lateMin)})` }));
        if (NQF.type === 'غياب') (s.absentDays || []).forEach(a => list.push({ date: a.date, text: `${nqDay(a.date)} — غياب بدون تسجيل حضور` }));
        if (NQF.type === 'خروج مبكر') (s.earlyDays || []).forEach(a => list.push({ date: a.date, text: `${nqDay(a.date)} — خروج قبل نهاية الدوام بـ ${minTxt(a.earlyMin)}` }));
        if (NQF.type === 'عدم تسجيل خروج') (s.days || []).filter(x => x.in && !x.out && x.date < TODAY).forEach(x => list.push({ date: x.date, text: `${nqDay(x.date)} — دخول ${x.in} بدون تسجيل خروج` }));
      }
    }
    if (NQ_EV.key !== key) return;
    const seen = {};
    NQ_EV.list = list.filter(x => !seen[x.text] && (seen[x.text] = 1)).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  }catch(e){ if (NQ_EV.key === key) NQ_EV.err = e.message; }
  if (NQ_EV.key === key){ NQ_EV.loading = false; nqRenderEvents(); }
}
function nqRenderEvents(){
  const box = $('nqEvents'); if (!box) return;
  if (!NQF.emp || !NQF.type){ box.innerHTML = ''; return; }
  if (NQF.type === 'أخرى'){ box.innerHTML = ''; return; }
  const key = NQF.emp + '|' + NQF.type;
  if (NQ_EV.key !== key){ nqLoadEvents(); return; }
  const src = NQF.type === 'عدم تسليم مهمة' ? 'المهام المتأخرة' : 'سجل الحضور — الشهر الحالي والسابق';
  let h = `<div class="nq-ev"><div class="h"><span>من ${src}</span><span style="color:var(--muted);font-weight:500">اختر اللي تبي تحطه بالوقائع</span></div>`;
  if (NQ_EV.loading) h += '<div class="none">جاري الجلب…</div>';
  else if (NQ_EV.err) h += `<div class="none">⚠️ ${esc(NQ_EV.err)}</div>`;
  else if (!NQ_EV.list.length) h += `<div class="none">ما لقيت ${esc(NQF.type)} مسجّل لـ ${esc(NQF.emp)} — تقدر تكتب الوقائع بيدك</div>`;
  else {
    const cur = ($('nqFacts') ? $('nqFacts').value : NQF.facts).split('\n').map(x => x.trim());
    h += NQ_EV.list.map((e, i) => `<label><input type="checkbox" ${cur.indexOf(e.text) > -1 ? 'checked' : ''} onchange="nqToggleEv(${i}, this.checked)">${esc(e.text)}</label>`).join('');
  }
  box.innerHTML = h + '</div>';
}
function nqToggleEv(i, on){
  const ta = $('nqFacts'), line = NQ_EV.list[i].text;
  let lines = ta.value.split('\n').map(x => x.trim()).filter(Boolean).filter(x => x !== line);
  if (on) lines.push(line);
  ta.value = lines.join('\n'); NQF.facts = ta.value;
}
async function nqIssue(){
  nqSave();
  if (!NQF.emp) return toast('اختر الموظف');
  if (!NQF.type) return toast('اختر نوع المخالفة');
  if (!NQF.facts.trim() && !NQF.details.trim()) return toast('اكتب الوقائع أو نص الاستفسار');
  if (!confirm('إصدار استفسار لـ ' + NQF.emp + ' بخصوص ' + NQF.type + '؟')) return;
  $('nqBtn').disabled = true;
  try{
    const r = await napi({ action: 'admin_createInquiry', emp: NQF.emp, type: NQF.type, facts: NQF.facts.trim(), details: NQF.details.trim(), hours: NQF.hours });
    toast(r.message || 'تم ✓');
    NQF = { emp: '', type: '', facts: '', details: '', hours: '48' }; NQ_EV = { key: '', loading: false, list: [], err: '' };
    NQ_FILTER = 'pending'; loadNotices(true);
  }catch(e){ toast(e.message); $('nqBtn').disabled = false; }
}
async function nqClose(i){
  const q = NQ_LIST[i], dec = ($('nqDec-' + i).value || '').trim();
  if (!dec) return toast('اكتب قرار الإدارة أو اختر واحد من فوق');
  if (q.status === 'بانتظار الرد' && !confirm('الموظف ما ردّ للحين. تبي تغلق الاستفسار؟')) return;
  nqSave();
  try{ await napi({ action: 'admin_closeInquiry', id: q.id, decision: dec }); toast('تم إغلاق الاستفسار ✓'); loadNotices(true); }
  catch(e){ toast(e.message); }
}
async function nqCancel(i){
  const q = NQ_LIST[i];
  if (!confirm('إلغاء الاستفسار رقم ' + nqNo(q.id) + '؟ بيختفي من صفحة الموظف.')) return;
  nqSave();
  try{ await napi({ action: 'admin_cancelInquiry', id: q.id }); toast('تم الإلغاء'); loadNotices(true); }
  catch(e){ toast(e.message); }
}

/* ---------- النشرات ---------- */
function nqNtcHtml(d){
  const staff = d.staff || [];
  let h = `<div class="card"><h3>نشرة جديدة <span class="sub">تطلع للموظفين بصفحتهم ويأكدون الاطلاع</span></h3>
    <div class="form">
      <div class="full"><label>العنوان</label><input id="nbTitle" value="${esc(NBF.title)}" placeholder="مثال: تعديل مواعيد الدوام خلال فترة المعرض"></div>
      <div class="full"><label>نص النشرة</label><textarea id="nbBody" style="min-height:110px" placeholder="اكتب النشرة…">${esc(NBF.body)}</textarea></div>
      <div><label>موجّهة إلى</label><select id="nbAud"><option value="الكل">كل الموظفين</option>${staff.map(n => `<option ${NBF.aud === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select></div>
      <div><label>الأهمية</label><select id="nbPri">${['عادي', 'مهم', 'عاجل'].map(p => `<option ${NBF.pri === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
      <div class="full"><button class="btn" id="nbBtn" onclick="nqPost()">نشر</button></div>
    </div></div>`;
  NQ_NLIST = d.notices || [];
  if (!NQ_NLIST.length) return h + '<div class="card"><div class="empty">ما فيه نشرات للحين</div></div>';
  return h + NQ_NLIST.map((n, i) => {
    const targets = n.audience === 'الكل' ? staff : [n.audience];
    const readMap = {}; (n.readers || []).forEach(r => readMap[nqN(r.name)] = r.at);
    const done = targets.filter(t => readMap[nqN(t)]);
    const pri = n.priority === 'عاجل' ? 'p-red' : n.priority === 'مهم' ? 'p-yellow' : 'p-gray';
    return `<div class="nq-card notice ${n.status !== 'منشورة' ? 'archived' : ''}">
      <div class="nq-top"><div><b>${esc(n.title)}</b>
        <div class="nq-meta"><span>رقم <bdi dir="ltr">${esc(nqNo(n.id))}</bdi></span><span>${esc(n.date)}</span><span>${n.audience === 'الكل' ? 'كل الموظفين' : '👤 ' + esc(n.audience)}</span><span class="pill ${pri}">${esc(n.priority)}</span>${n.status !== 'منشورة' ? '<span class="pill p-gray">مؤرشفة</span>' : ''}</div></div>
        <span class="pill ${done.length === targets.length ? 'p-green' : 'p-yellow'}">اطّلع ${done.length} من ${targets.length}</span></div>
      <div class="nq-box"><div class="v">${esc(n.body)}</div></div>
      <div class="nq-readers">${targets.map(t => readMap[nqN(t)]
          ? `<span class="pill p-green" title="${esc(nqWhen(readMap[nqN(t)]))}">✓ ${esc(t)}</span>`
          : `<span class="pill p-gray">${esc(t)}</span>`).join('')}</div>
      <div class="nq-act"><button class="btn ghost sm" onclick="nqPrintNtc(${i})">🖨 طباعة</button>
        ${n.status === 'منشورة' ? `<button class="btn ghost sm" onclick="nqArchive(${i})">أرشفة</button>` : ''}</div>
    </div>`;
  }).join('');
}
async function nqPost(){
  nqSave();
  if (!NBF.title.trim() || !NBF.body.trim()) return toast('اكتب العنوان والنص');
  $('nbBtn').disabled = true;
  try{
    const r = await napi({ action: 'admin_postNotice', title: NBF.title.trim(), body: NBF.body.trim(), audience: NBF.aud, priority: NBF.pri });
    toast(r.message || 'تم النشر ✓'); NBF = { title: '', body: '', aud: 'الكل', pri: 'عادي' }; loadNotices(true);
  }catch(e){ toast(e.message); $('nbBtn').disabled = false; }
}
async function nqArchive(i){
  const n = NQ_NLIST[i];
  if (!confirm('أرشفة النشرة؟ بتختفي من صفحة الموظفين.')) return;
  nqSave();
  try{ await napi({ action: 'admin_archiveNotice', id: n.id }); toast('تمت الأرشفة'); loadNotices(true); }
  catch(e){ toast(e.message); }
}

/* ---------- سجل الموظفين ---------- */
function nqStatsHtml(d){
  const st = (d.stats || []).slice().sort((a, b) => b.total - a.total);
  if (!st.length) return '<div class="card"><div class="empty">ما فيه موظفين</div></div>';
  return `<div class="card"><h3>عدد الاستفسارات لكل موظف <span class="sub">من أول استفسار صدر</span></h3>
    <div class="tbl-wrap"><table><thead><tr><th>الموظف</th><th class="num">المجموع</th>${NQ_TYPES.map(t => `<th class="num">${t}</th>`).join('')}<th class="num">بانتظار رده</th><th></th></tr></thead><tbody>` +
    st.map(s => `<tr><td><b>${esc(s.name)}</b></td>
      <td class="num"><span class="pill ${s.total >= 3 ? 'p-red' : s.total ? 'p-yellow' : 'p-green'}">${s.total}</span></td>
      ${NQ_TYPES.map(t => `<td class="num">${(s.byType || {})[t] || '—'}</td>`).join('')}
      <td class="num">${s.pending || '—'}</td>
      <td><button class="btn ghost sm" onclick="nqNewFor('${esc(s.name).replace(/'/g, "\\'")}')">استفسار جديد</button></td></tr>`).join('') +
    '</tbody></table></div></div>';
}
function nqNewFor(n){ NQF.emp = n; NQ_TAB = 'inq'; renderNotices(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ---------- الطباعة ---------- */
function nqLetterHead(no, date){
  return `<div class="pl-head"><div><div class="pl-org">معهد تمكين للتدريب الأهلي</div>
    <div class="pl-sub">شركة إيديو كلود لخدمات استشارات التعليم · المرقاب — دولة الكويت · سجل تجاري 487977</div></div>
    <div class="pl-ref">الرقم: <bdi dir="ltr">${esc(nqNo(no))}</bdi><br>التاريخ: ${esc(date)}</div></div>`;
}
function nqPrint(html){ $('printArea').innerHTML = '<div class="pl">' + html + '<div class="pl-foot">صادر من نظام الموظفين — معهد تمكين للتدريب الأهلي</div></div>'; window.print(); }
function nqPrintInq(i){
  const q = NQ_LIST[i];
  nqPrint(nqLetterHead(q.id, q.date) + `
    <div class="pl-title">استفسار إداري</div>
    <table class="pl-meta">
      <tr><td>الموظف</td><td>${esc(q.emp)}</td></tr>
      <tr><td>الموضوع</td><td>استفسار بخصوص ${esc(q.type)}</td></tr>
      <tr><td>آخر موعد للرد</td><td>${nqWhen(q.deadline)}</td></tr>
    </table>
    <p>السيد/ة ${esc(q.emp)} المحترم/ة،</p><p>تحية طيبة وبعد،</p>
    ${q.facts ? `<div class="pl-sec"><div class="k">الوقائع</div><div class="v">${esc(q.facts)}</div></div>` : ''}
    ${q.details ? `<div class="pl-sec"><div class="v" style="border:0;padding:0">${esc(q.details)}</div></div>` : ''}
    <p>يرجى الرد على هذا الاستفسار كتابياً خلال المهلة المحددة عبر نظام الموظفين، وفي حال عدم الرد خلال المهلة ستتخذ الإدارة الإجراء المناسب.</p>
    ${q.reply ? `<div class="pl-sec"><div class="k">رد الموظف (${nqWhen(q.repliedAt)})</div><div class="v">${esc(q.reply)}</div></div>` : ''}
    ${q.decision ? `<div class="pl-sec"><div class="k">قرار الإدارة (${nqWhen(q.closedAt)})</div><div class="v">${esc(q.decision)}</div></div>` : ''}
    <div class="pl-sign"><div>الإدارة<i>التوقيع والختم</i></div><div>الموظف<i>توقيع بالاستلام</i></div></div>`);
}
function nqPrintNtc(i){
  const n = NQ_NLIST[i];
  nqPrint(nqLetterHead(n.id, n.date) + `
    <div class="pl-title">نشرة إدارية</div>
    <table class="pl-meta">
      <tr><td>موجّهة إلى</td><td>${n.audience === 'الكل' ? 'جميع الموظفين' : esc(n.audience)}</td></tr>
      <tr><td>الموضوع</td><td>${esc(n.title)}</td></tr>
    </table>
    <div class="pl-sec"><div class="v" style="border:0;padding:0">${esc(n.body)}</div></div>
    <div class="pl-sign"><div></div><div>الإدارة<i>التوقيع والختم</i></div></div>`);
}

/* ===== البداية ===== */
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
(function init(){
  let saved = '';
  try{ saved = sessionStorage.getItem('tmpin') || ''; }catch(e){}
  if (saved){ $('pin').value = saved; login(); }
  else $('pin').focus();
})();
</script>
