<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>السيرة الذاتية للمدرب — معهد تمكين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--crimson:#5C0F0F;--crimson-2:#7a1414;--cream:#FAF7F2;--cream-2:#F4ECE2;--ink:#241616;--line:#e8ddd3;--muted:#8a6f6f;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Cairo',sans-serif;background:#e9e4dc;color:var(--ink);}
.top{background:var(--crimson);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.top .ttl{font-size:20px;font-weight:900;}
.top .ttl small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px;}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:12px;padding:11px 18px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.btn-primary{background:#fff;color:var(--crimson);}
.btn-line{background:rgba(255,255,255,.15);color:#fff;}
.wrap{display:grid;grid-template-columns:400px 1fr;gap:20px;padding:20px;align-items:start;}
@media(max-width:900px){.wrap{grid-template-columns:1fr;}}
.panel{background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 14px rgba(92,15,15,.06);position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;}
@media(max-width:900px){.panel{position:static;max-height:none;}}
.acc{border:1.5px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.acc-head{width:100%;display:flex;align-items:center;justify-content:space-between;padding:13px 15px;background:var(--cream);border:none;font-family:inherit;font-size:14px;font-weight:900;color:var(--crimson);cursor:pointer;}
.acc-head .ico{font-size:12px;transition:transform .2s;}
.acc.open .acc-head .ico{transform:rotate(180deg);}
.acc-body{display:none;padding:14px;}
.acc.open .acc-body{display:block;}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:5px;}
.fld input,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px;background:var(--cream);outline:none;color:var(--ink);}
.fld textarea{min-height:80px;resize:vertical;line-height:1.7;}
.fld input:focus,.fld textarea:focus{border-color:var(--crimson);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.entry{border:1.5px dashed var(--line);border-radius:12px;padding:11px;margin-bottom:10px;position:relative;}
.entry .del{position:absolute;left:8px;top:8px;background:#fdecec;color:#c0392b;border:none;border-radius:8px;width:26px;height:26px;font-weight:900;cursor:pointer;font-size:15px;}
.add-btn{width:100%;background:var(--cream-2);border:none;border-radius:10px;padding:10px;font-family:inherit;font-weight:800;font-size:13px;color:var(--crimson);cursor:pointer;}
.file-in{width:100%;font-family:inherit;font-size:12.5px;padding:9px;border:1.5px solid var(--line);border-radius:10px;background:var(--cream);}
.ck{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;cursor:pointer;}
.ck input{width:17px;height:17px;accent-color:var(--crimson);}
.stage{display:flex;justify-content:center;overflow-x:auto;}
.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;}

/* ===== CV A4 ===== */
.cv{width:794px;min-height:1123px;background:#fff;color:#241616;box-shadow:0 6px 30px rgba(0,0,0,.14);display:flex;flex-direction:column;}
.cv-head{background:linear-gradient(120deg,var(--crimson),var(--crimson-2));color:#fff;padding:40px 48px;display:flex;align-items:center;gap:28px;}
.cv-head .photo{width:128px;height:128px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.5);flex:0 0 auto;background:rgba(255,255,255,.15);}
.cv-head .who{flex:1;min-width:0;}
.cv-head .who .nm{font-size:38px;font-weight:900;line-height:1.15;}
.cv-head .who .rl{font-size:19px;font-weight:700;opacity:.92;margin-top:6px;}
.cv-head .who .ct{font-size:13.5px;font-weight:600;opacity:.9;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px 16px;}
.cv-body{padding:34px 48px 30px;flex:1;}
.cv-sec{margin-bottom:24px;break-inside:avoid;}
.cv-sec h3{font-size:17px;font-weight:900;color:var(--crimson);border-bottom:2px solid var(--crimson);padding-bottom:6px;margin-bottom:12px;display:inline-block;}
.cv-sec .summary{font-size:14.5px;line-height:1.9;font-weight:500;color:#3a2a2a;white-space:pre-wrap;}
.cv-item{margin-bottom:13px;}
.cv-item .r1{display:flex;justify-content:space-between;gap:12px;align-items:baseline;}
.cv-item .r1 .t{font-size:15.5px;font-weight:800;color:#2a1a1a;}
.cv-item .r1 .y{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;}
.cv-item .p{font-size:13.5px;font-weight:600;color:#6a5555;margin-top:1px;}
.cv-item .d{font-size:13px;font-weight:500;color:#4a3a3a;margin-top:4px;line-height:1.8;white-space:pre-wrap;}
.cv-list{list-style:none;display:flex;flex-direction:column;gap:7px;}
.cv-list li{display:flex;align-items:flex-start;gap:9px;font-size:13.5px;font-weight:600;color:#3a2a2a;line-height:1.7;}
.cv-list li::before{content:'';flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--crimson);margin-top:8px;}
.cv-tags{display:flex;flex-wrap:wrap;gap:8px;}
.cv-tags span{background:var(--cream-2);color:var(--crimson);border-radius:100px;padding:6px 16px;font-size:13px;font-weight:800;}
.cv-foot{margin-top:auto;background:var(--cream);border-top:2px solid var(--line);padding:14px 48px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.cv-foot img{height:44px;width:auto;}
.cv-foot .fx{font-size:11.5px;font-weight:700;color:var(--muted);text-align:left;}

@media print{
  body *{visibility:hidden;}
  #cvPrint,#cvPrint *{visibility:visible;}
  #cvPrint{display:block!important;position:absolute;inset:0;}
  #cvPrint .cv{box-shadow:none;width:100%;min-height:auto;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @page{size:A4;margin:0;}
}
#cvPrint{display:none;}
</style>
</head>
<body>
<div class="top">
  <div class="ttl">منشئ السيرة الذاتية للمدرب<small>معهد تمكين · إيديو كلاود للتدريب الأهلي</small></div>
  <div class="acts">
    <button class="btn btn-primary" id="submitBtn" onclick="submitCV()"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>إرسال السيرة للمعهد</button>
    <button class="btn btn-line" onclick="printCV()"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>طباعة</button>
    <button class="btn btn-line" onclick="downloadCV()"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>تحميل PDF</button>
  </div>
</div>

<div class="wrap">
  <div class="panel">
    <div class="acc open">
      <button class="acc-head" onclick="tacc(this)">البيانات الشخصية<span class="ico">▾</span></button>
      <div class="acc-body">
        <div class="fld"><label>الاسم الكامل</label><input id="c_name" oninput="renderCV()" placeholder="مثال: عتيق خالد العنزي"></div>
        <div class="fld"><label>المسمى / التخصص</label><input id="c_title" oninput="renderCV()" placeholder="مثال: مدرب معتمد في التطوير المؤسسي"></div>
        <div class="grid2">
          <div class="fld"><label>الهاتف</label><input id="c_phone" oninput="renderCV()" placeholder="9XXXXXXX"></div>
          <div class="fld"><label>البريد</label><input id="c_email" oninput="renderCV()" placeholder="name@email.com"></div>
        </div>
        <div class="fld"><label>المدينة / الدولة</label><input id="c_city" oninput="renderCV()" placeholder="الكويت"></div>
        <div class="fld"><label>الصورة الشخصية (اختياري)</label>
          <input type="file" id="c_photo" accept="image/*" class="file-in" onchange="onPhoto(event)">
        </div>
      </div>
    </div>

    <div class="acc open">
      <button class="acc-head" onclick="tacc(this)">نبذة مختصرة<span class="ico">▾</span></button>
      <div class="acc-body">
        <div class="fld"><textarea id="c_summary" oninput="renderCV()" placeholder="نبذة تعريفية موجزة عنك وعن خبرتك التدريبية..."></textarea></div>
      </div>
    </div>

    <div class="acc">
      <button class="acc-head" onclick="tacc(this)">المؤهلات العلمية<span class="ico">▾</span></button>
      <div class="acc-body">
        <div id="eduForm"></div>
        <button class="add-btn" onclick="addEdu()">＋ إضافة مؤهل</button>
      </div>
    </div>

    <div class="acc">
      <button class="acc-head" onclick="tacc(this)">الخبرات العملية<span class="ico">▾</span></button>
      <div class="acc-body">
        <div id="expForm"></div>
        <button class="add-btn" onclick="addExp()">＋ إضافة خبرة</button>
      </div>
    </div>

    <div class="acc">
      <button class="acc-head" onclick="tacc(this)">الدورات المقدَّمة<span class="ico">▾</span></button>
      <div class="acc-body">
        <div class="fld"><label>كل دورة في سطر</label><textarea id="c_courses" oninput="renderCV()" placeholder="مهارات العرض والإلقاء&#10;إدارة المشاريع&#10;الذكاء العاطفي"></textarea></div>
      </div>
    </div>

    <div class="acc">
      <button class="acc-head" onclick="tacc(this)">الشهادات والاعتمادات<span class="ico">▾</span></button>
      <div class="acc-body">
        <div class="fld"><label>كل شهادة في سطر</label><textarea id="c_certs" oninput="renderCV()" placeholder="مدرب معتمد TOT&#10;اعتماد ...&#10;..."></textarea></div>
      </div>
    </div>

    <div class="acc">
      <button class="acc-head" onclick="tacc(this)">المهارات<span class="ico">▾</span></button>
      <div class="acc-body">
        <div class="fld"><label>افصل بينها بفاصلة</label><input id="c_skills" oninput="renderCV()" placeholder="التواصل، القيادة، التحفيز، التصميم التدريبي"></div>
      </div>
    </div>

    <div class="acc">
      <button class="acc-head" onclick="tacc(this)">إعدادات<span class="ico">▾</span></button>
      <div class="acc-body">
        <label class="ck"><input type="checkbox" id="c_logo" checked onchange="renderCV()">إظهار شعار تمكين في التذييل</label>
      </div>
    </div>
  </div>

  <div>
    <div class="stage"><div id="cvScale" style="transform-origin:top center;"><div class="cv" id="cvPaper"></div></div></div>
    <div class="hint">معاينة بمقاس A4 — الطباعة و PDF بالحجم الكامل</div>
  </div>
</div>

<div id="cvPrint"></div>

function $(id){return document.getElementById(id);}
function v(id){const e=$(id);return e?e.value:'';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function tacc(b){b.parentNode.classList.toggle('open');}
function onPhoto(e){const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=280;let w=im.width,h=im.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(im,0,0,w,h);photo=cv.toDataURL('image/jpeg',0.72);renderCV();};im.src=r.result;};r.readAsDataURL(f);}

function collectCV(){ return { name:v('c_name'),title:v('c_title'),phone:v('c_phone'),email:v('c_email'),city:v('c_city'),photo:photo||'',summary:v('c_summary'),edu:edu,exp:exp,courses:v('c_courses'),certs:v('c_certs'),skills:v('c_skills'),logo:$('c_logo').checked }; }
async function submitCV(){
  const cv=collectCV();
  if(!cv.name.trim()){ alert('اكتب اسمك أولاً'); return; }
  const b=$('submitBtn'); const o=b?b.innerHTML:''; if(b){ b.innerHTML='جاري الإرسال...'; b.disabled=true; }
  try{
    await fetch(SCRIPT_URL,{ method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ type:'حفظ_سيرة', token:TOKEN, name:cv.name, phone:cv.phone, email:cv.email, data:JSON.stringify(cv) }) });
    alert('تم إرسال سيرتك الذاتية للمعهد بنجاح ✓');
  }catch(e){ alert('تعذّر الإرسال — تأكد من الاتصال بالإنترنت'); }
  if(b){ b.innerHTML=o; b.disabled=false; }
}
function setState(cv){
  $('c_name').value=cv.name||''; $('c_title').value=cv.title||''; $('c_phone').value=cv.phone||'';
  $('c_email').value=cv.email||''; $('c_city').value=cv.city||''; $('c_summary').value=cv.summary||'';
  $('c_courses').value=cv.courses||''; $('c_certs').value=cv.certs||''; $('c_skills').value=cv.skills||'';
  $('c_logo').checked = cv.logo!==false; photo=cv.photo||null;
  edu=(cv.edu&&cv.edu.length)?cv.edu:[{deg:'',place:'',year:''}];
  exp=(cv.exp&&cv.exp.length)?cv.exp:[{role:'',org:'',period:'',desc:''}];
  buildEduForm(); buildExpForm(); renderCV();
}
async function loadFromRow(row){
  try{
    const url='https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent(CV_TAB)+'!A'+row+':F'+row+'?key='+API_KEY;
    const r=await fetch(url); const d=await r.json();
    const vals=(d.values&&d.values[0])||[]; const json=vals[5]||'';
    if(json){ setState(JSON.parse(json)); }
  }catch(e){}
}

function buildEduForm(){
  $('eduForm').innerHTML=edu.map((x,i)=>

    '<div class="fld" style="margin-bottom:8px;"><label>المؤهل / الدرجة</label><input value="'+esc(x.deg)+'" oninput="setEdu('+i+',\'deg\',this.value)" placeholder="بكالوريوس ..."></div>'+

}
function setEdu(i,k,val){edu[i][k]=val;renderCV();}

function cvHTML(){
  const name=esc(v('c_name')||'اسم المدرب');
  const title=esc(v('c_title'));
  const ct=[]; if(v('c_phone'))ct.push('☎ '+esc(v('c_phone'))); if(v('c_email'))ct.push('✉ '+esc(v('c_email'))); if(v('c_city'))ct.push('📍 '+esc(v('c_city')));
  const ph=photo?'<img class="photo" src="'+photo+'">':'<div class="photo"></div>';
  const summary=v('c_summary').trim();
  const eduH=edu.filter(x=>x.deg||x.place||x.year).map(x=>
    '<div class="cv-item"><div class="r1"><span class="t">'+esc(x.deg||'')+'</span><span class="y">'+esc(x.year||'')+'</span></div>'+(x.place?'<div class="p">'+esc(x.place)+'</div>':'')+'</div>').join('');
  const expH=exp.filter(x=>x.role||x.org||x.desc).map(x=>
    '<div class="cv-item"><div class="r1"><span class="t">'+esc(x.role||'')+'</span><span class="y">'+esc(x.period||'')+'</span></div>'+(x.org?'<div class="p">'+esc(x.org)+'</div>':'')+(x.desc?'<div class="d">'+esc(x.desc)+'</div>':'')+'</div>').join('');
  const courses=lines('c_courses'), certs=lines('c_certs');
  const skills=(v('c_skills')||'').split(/[،,]/).map(s=>s.trim()).filter(Boolean);
  const sec=(t,inner)=>inner?'<div class="cv-sec"><h3>'+t+'</h3>'+inner+'</div>':'';
  const list=arr=>'<ul class="cv-list">'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  const foot=$('c_logo').checked
    ? '<div class="cv-foot"><img src="'+TAMKEEN_LOGO+'"><div class="fx">معهد تمكين · إيديو كلاود للتدريب الأهلي<br>tamkeenkuw.com</div></div>'
    : '';
  return '<div class="cv-head">'+ph+'<div class="who"><div class="nm">'+name+'</div>'+(title?'<div class="rl">'+title+'</div>':'')+(ct.length?'<div class="ct">'+ct.map(x=>'<span>'+x+'</span>').join('')+'</div>':'')+'</div></div>'+
    '<div class="cv-body">'+
      sec('نبذة', summary?'<div class="summary">'+esc(summary)+'</div>':'')+
      sec('المؤهلات العلمية', eduH)+
      sec('الخبرات العملية', expH)+
      sec('الدورات التدريبية المقدَّمة', courses.length?list(courses):'')+
      sec('الشهادات والاعتمادات', certs.length?list(certs):'')+
      sec('المهارات', skills.length?'<div class="cv-tags">'+skills.map(s=>'<span>'+esc(s)+'</span>').join('')+'</div>':'')+
    '</div>'+foot;
}
function renderCV(){
  const paper=$('cvPaper'); paper.innerHTML=cvHTML();
  const wrap=$('cvScale'); const avail=wrap.parentNode.clientWidth;
  const s=Math.min(1, avail/794);
  wrap.style.transform='scale('+s+')';
  wrap.parentNode.style.height=(paper.offsetHeight*s)+'px';
}
function printCV(){ $('cvPrint').innerHTML='<div class="cv">'+cvHTML()+'</div>'; window.print(); }
async function downloadCV(){
  if(typeof html2canvas==='undefined' || !window.jspdf){ alert('مكتبة الـ PDF لم تُحمّل — تأكد من الاتصال'); return; }
  const paper=$('cvPaper');
  const canvas=await html2canvas(paper,{scale:2,useCORS:true,backgroundColor:'#ffffff'});
  const img=canvas.toDataURL('image/png');
  const { jsPDF }=window.jspdf;
  const pdf=new jsPDF('p','mm','a4');
  const pw=210, ph=canvas.height*210/canvas.width, page=297;
  if(ph<=page){ pdf.addImage(img,'PNG',0,0,pw,ph); }
  else { let pos=0; while(pos<ph){ pdf.addImage(img,'PNG',0,-pos,pw,ph); pos+=page; if(pos<ph) pdf.addPage(); } }
  pdf.save((v('c_name')||'السيرة-الذاتية')+'.pdf');
}
window.addEventListener('resize', ()=>renderCV());
buildEduForm(); buildExpForm(); renderCV();
(function(){
  var p=new URLSearchParams(location.search), row=p.get('row');
  if(row){
    var sb=$('submitBtn'); if(sb) sb.style.display='none';
    var t=document.querySelector('.top .ttl'); if(t) t.innerHTML='عرض السيرة الذاتية<small>معهد تمكين — وضع العرض والطباعة</small>';
    loadFromRow(parseInt(row,10));
  }
})();
