<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لقاء المدربين | معهد تمكين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--cr:#5C0F0F;--cr2:#7A1414;--cream:#FAF7F2;--cream2:#F0E9E0;--text:#1A0808;--muted:#7A6060}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--cr);min-height:100vh;padding:40px 20px 60px;position:relative}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0}

.wrap{position:relative;z-index:1;max-width:480px;margin:0 auto}

/* HEADER */
.header{text-align:center;margin-bottom:32px}
.logo{font-size:16px;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:20px}
.date-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;font-size:13px;font-weight:700;
  padding:8px 20px;border-radius:100px;margin-bottom:20px;
}
.date-dot{width:7px;height:7px;border-radius:50%;background:var(--cream2)}
.title{font-size:clamp(28px,7vw,40px);font-weight:900;color:#fff;line-height:1.2;margin-bottom:10px}
.subtitle{font-size:14px;color:rgba(255,255,255,.55);line-height:1.7}

/* CARD */
.card{background:var(--cream);border-radius:24px;padding:clamp(24px,5vw,36px);box-shadow:0 16px 48px rgba(0,0,0,.3)}

.field{margin-bottom:18px}
.field label{display:block;font-size:14px;font-weight:700;color:var(--text);margin-bottom:7px}
.field input,.field textarea{
  width:100%;background:#fff;border:1.5px solid rgba(92,15,15,.1);
  border-radius:14px;padding:14px 18px;
  font-family:'Cairo',sans-serif;font-size:15px;color:var(--text);
  outline:none;transition:all .25s;direction:rtl;
}
.field input:focus,.field textarea:focus{border-color:var(--cr);box-shadow:0 0 0 3px rgba(92,15,15,.06)}
.field input::placeholder,.field textarea::placeholder{color:rgba(122,96,96,.35)}
.field textarea{resize:vertical;min-height:110px;line-height:1.7}
.field input[type=email]{direction:ltr;text-align:right}

.btn{
  width:100%;background:var(--cr);color:#fff;
  font-family:'Cairo',sans-serif;font-size:17px;font-weight:900;
  padding:16px;border-radius:100px;border:none;cursor:pointer;
  transition:all .3s;box-shadow:0 6px 24px rgba(0,0,0,.25);
  margin-top:4px;display:flex;align-items:center;justify-content:center;gap:10px;
}
.btn:hover{background:var(--cr2);transform:translateY(-2px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* SUCCESS */
.success{text-align:center;padding:20px 0;display:none}
.succ-icon{font-size:56px;margin-bottom:16px}
.succ-title{font-size:24px;font-weight:900;color:var(--text);margin-bottom:8px}
.succ-desc{font-size:14px;color:var(--muted);line-height:1.8}

footer{text-align:center;margin-top:28px;position:relative;z-index:1}
footer p{font-size:11px;color:rgba(255,255,255,.25)}
footer a{color:rgba(255,255,255,.35);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="logo">معهد تمكين × عتيق العتيق</div>
    <div class="date-badge"><div class="date-dot"></div>الثلاثاء ١٢ مايو ٢٠٢٦</div>
    <h1 class="title">لقاء المدربين 🎓</h1>
    <p class="subtitle">خاص بمن أتم دورة إعداد مدرب معتمد — لقاء للمتابعة والتطوير</p>
  </div>

  <div class="card">
    <div id="formWrap">
      <div class="field">
        <label>الاسم الثلاثي *</label>
        <input type="text" id="name" placeholder="أدخل اسمك كاملاً">
      </div>
      <div class="field">
        <label>رقم الهاتف *</label>
        <input type="tel" id="phone" placeholder="XXXXXXXX">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@email.com">
      </div>
      <div class="field">
        <label>هل واجهت أي تحدي في مسيرتك التدريبية؟</label>
        <textarea id="challenge" placeholder="شاركنا تحدياتك أو أسئلتك — هذا يساعدنا نستعد للقاء..."></textarea>
      </div>
      <button class="btn" id="btn" onclick="submit()">
        <span id="btnTxt">تأكيد حضوري ←</span>
        <div class="spin" id="spin"></div>
      </button>
    </div>

    <div class="success" id="success">
      <div class="succ-icon">🎉</div>
      <div class="succ-title">تم تسجيلك!</div>
      <p class="succ-desc">نراك يوم الثلاثاء ١٢ مايو ٢٠٢٦<br>سيصلك تذكير قبل اللقاء إن شاء الله</p>
    </div>
  </div>

  <footer>
    <p>معهد تمكين — <a href="https://tamkeenkuw.com">tamkeenkuw.com</a></p>
  </footer>
</div>

<script>
const SCRIPT = 'https://script.google.com/macros/s/AKfycbzM1NDxxMK6gcP1CwNsGmJBFltz9oImKhcTFxGaQads0bOr6ak70VjUOG0yEtL-hnM/exec';

async function submit(){
  const name      = document.getElementById('name').value.trim();
  const phone     = document.getElementById('phone').value.trim();
  const email     = document.getElementById('email').value.trim();
  const challenge = document.getElementById('challenge').value.trim();

  if(!name||name.length<3){alert('أدخل اسمك الثلاثي');return}
  if(!phone||phone.length<7){alert('أدخل رقم هاتفك');return}

  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('btnTxt').style.display = 'none';
  document.getElementById('spin').style.display = 'block';

  try{
    await fetch(SCRIPT,{
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        type:      'لقاء_مدربين',
        name, phone, email,
        challenge: challenge || 'لا يوجد'
      })
    });
    document.getElementById('formWrap').style.display = 'none';
    document.getElementById('success').style.display = 'block';
  }catch(e){
    btn.disabled = false;
    document.getElementById('btnTxt').style.display = 'block';
    document.getElementById('spin').style.display = 'none';
    alert('حدث خطأ — حاول مجدداً');
  }
}
</script>
</body>
</html>
