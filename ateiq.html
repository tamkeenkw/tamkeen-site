<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبّع خطتك التدريبية | عتيق خالد العتيق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--crimson:#5C0F0F;--crimson-2:#6B1212;--cream:#FAF7F2;--cream-2:#F2EDE5;--text:#1A0808;--muted:#7A6060;--green:#2e7d32;--amber:#B85C00}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--text);overflow-x:hidden}
.nav{background:var(--crimson);padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
.nav span{font-size:19px;font-weight:900;color:#fff}
.nav a{color:rgba(255,255,255,.7);text-decoration:none;font-size:14px;font-weight:600}
.hero{background:var(--crimson);padding:48px 24px 64px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.025) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.025) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.025) 75%);background-size:48px 48px;background-position:0 0,0 24px,24px -24px,-24px 0}
.hero-in{position:relative;z-index:1;max-width:620px;margin:0 auto}
.hero-badge{display:inline-block;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85);font-size:13px;font-weight:700;padding:6px 20px;border-radius:100px;margin-bottom:18px}
.hero h1{font-size:clamp(26px,5vw,40px);font-weight:900;color:#fff;line-height:1.25;margin-bottom:12px}
.hero p{font-size:15px;color:rgba(255,255,255,.6);line-height:1.7}
.search-wrap{max-width:620px;margin:-32px auto 0;padding:0 20px;position:relative;z-index:5}
.search-card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 18px 48px rgba(92,15,15,.14);border:1.5px solid rgba(92,15,15,.06)}
.search-bar{display:flex;gap:10px}
.search-bar input{flex:1;padding:14px 18px;font-family:inherit;font-size:16px;border:1.5px solid rgba(92,15,15,.15);border-radius:14px;background:var(--cream);color:var(--text);outline:none;transition:border-color .2s}
.search-bar input:focus{border-color:var(--crimson)}
.search-btn{padding:14px 26px;background:var(--crimson);color:#fff;font-family:inherit;font-size:16px;font-weight:800;border:none;border-radius:14px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all .2s}
.search-btn:hover{background:var(--crimson-2)}
.search-btn:disabled{opacity:.55;cursor:not-allowed}
.search-btn svg{width:18px;height:18px;fill:#fff}
.search-hint{font-size:13px;color:var(--muted);margin-top:12px;text-align:center}
.container{max-width:620px;margin:0 auto;padding:28px 20px 60px}
.loading{text-align:center;padding:40px;display:none}
.loading.show{display:block}
.spinner{width:38px;height:38px;border:3px solid rgba(92,15,15,.12);border-top-color:var(--crimson);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#result{display:none}
#result.show{display:block}
.tcard{background:var(--crimson);border-radius:24px;overflow:hidden;position:relative;margin-bottom:18px}
.tcard::before{content:'';position:absolute;inset:0;background-image:linear-gradient(45deg,rgba(255,255,255,.03) 25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.03) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.03) 75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.03) 75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0}
.tcard-top{position:relative;z-index:1;padding:32px 28px 24px;text-align:center}
.tavatar{width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.15);border:3px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin:0 auto 14px}
.tname{font-size:clamp(20px,4vw,26px);font-weight:900;color:#fff;margin-bottom:6px}
.tsub{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:18px}
.tpill{display:inline-flex;align-items:center;gap:8px;padding:9px 22px;border-radius:100px;font-size:14px;font-weight:800;background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.28);color:#fff}
.dot{width:8px;height:8px;border-radius:50%}
.dot-on{background:#4caf50;box-shadow:0 0 6px rgba(76,175,80,.6)}
.dot-prog{background:#ffc107;box-shadow:0 0 6px rgba(255,193,7,.5)}
.tprog{position:relative;z-index:1;padding:0 28px 20px}
.tprog-track{height:8px;background:rgba(255,255,255,.15);border-radius:100px;overflow:hidden}
.tprog-fill{height:100%;background:#fff;border-radius:100px;transition:width .6s ease}
.tcard-bottom{position:relative;z-index:1;background:rgba(0,0,0,.18);padding:18px 28px;display:flex;justify-content:center;gap:48px}
.tc-n{font-size:22px;font-weight:900;color:#fff;line-height:1;margin-bottom:4px}
.tc-l{font-size:12px;color:rgba(255,255,255,.55)}
.path{background:#fff;border-radius:22px;border:1.5px solid rgba(92,15,15,.08);overflow:hidden}
.path-head{padding:18px 24px;border-bottom:1.5px solid rgba(92,15,15,.06);font-size:12px;font-weight:800;letter-spacing:2px;color:var(--crimson);text-transform:uppercase}
.path-body{padding:22px 20px}
.step{display:flex;align-items:flex-start;gap:14px}
.step-left{display:flex;flex-direction:column;align-items:center;flex-shrink:0;width:38px}
.circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex-shrink:0;z-index:1}
.circle.done{background:var(--green);color:#fff}
.circle.current{background:var(--crimson);color:#fff;outline:3px solid rgba(92,15,15,.18);outline-offset:2px}
.circle.none{background:var(--cream-2);color:var(--muted);border:1.5px solid rgba(92,15,15,.1)}
.circle svg{width:16px;height:16px}
.vline{width:2px;flex:1;min-height:20px;margin:4px 0}
.step-content{flex:1;padding-bottom:26px}
.step:last-child .step-content{padding-bottom:0}
.step-name{font-size:16px;font-weight:800;color:var(--text);line-height:1.3;margin-bottom:3px}
.step-name.muted{color:var(--muted);font-weight:600}
.step-tag{display:inline-block;margin-top:8px;font-size:12px;font-weight:800;padding:4px 13px;border-radius:100px}
.tag-done{background:#e8f5e9;color:var(--green)}
.tag-sched{background:#fff3e0;color:var(--amber)}
.tag-none{background:var(--cream-2);color:var(--muted)}
.notfound{text-align:center;padding:40px 24px;background:#fff;border-radius:18px;border:1.5px dashed rgba(92,15,15,.15)}
.notfound svg{width:44px;height:44px;fill:rgba(92,15,15,.18);margin:0 auto 14px;display:block}
.notfound p{font-size:16px;color:var(--muted);line-height:1.7}
footer{background:var(--crimson-2);padding:24px;text-align:center;margin-top:40px}
footer p{font-size:13px;color:rgba(255,255,255,.35)}
footer a{color:rgba(255,255,255,.55);text-decoration:none}
@media(max-width:520px){.search-bar{flex-direction:column}.search-btn{justify-content:center}.tcard-bottom{gap:32px}}
</style>
</head>
<body>
<nav class="nav"><span>تتبّع خطتك التدريبية</span><a href="/">← الرئيسية</a></nav>
<section class="hero">
  <div class="hero-in">
    <div class="hero-badge">معهد تمكين — عتيق خالد العتيق</div>
    <h1>تحقّق من خطتك التدريبية وإنجازك</h1>
    <p>ادخل برقم هاتفك لتشوف اسمك، دوراتك، وحالة إنجازك في المسار التدريبي</p>
  </div>
</section>
<div class="search-wrap">
  <div class="search-card">
    <div class="search-bar">
      <input type="text" id="q" placeholder="رقم هاتفك المسجّل..." maxlength="40" autocomplete="off">
      <button class="search-btn" id="goBtn" onclick="doSearch()">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        بحث
      </button>
    </div>
    <p class="search-hint">تقدر تبحث باسمك الكامل أو رقم هاتفك</p>
  </div>
</div>
<div class="container">
  <div class="loading" id="loading"><div class="spinner"></div><p style="color:var(--muted);font-size:14px">جاري البحث...</p></div>
  <div id="result"></div>
</div>
<footer><p>معهد تمكين — <a href="/">tamkeenkuw.com</a></p></footer>
<script>
const API = "https://script.google.com/macros/s/AKfycbyH7MT8kS93S_otXPhrGPdmyJRs3vzQF0qNtBCYZaGkLZ6qbLVB_wnKO2oQS8osE-UW/exec";
let DATA=null;
const toAr=s=>String(s).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function initials(n){return n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('');}
function esc(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function dateLabel(v){ // "2026-05-09" → "٩ مايو ٢٠٢٦"
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(v); if(!m) return esc(v);
  return toAr(parseInt(m[3],10))+' '+MONTHS[parseInt(m[2],10)-1]+' '+toAr(m[1]);
}
async function doSearch(){
  const q=document.getElementById('q').value.trim();
  if(!q){document.getElementById('q').focus();return;}
  const btn=document.getElementById('goBtn'),L=document.getElementById('loading'),R=document.getElementById('result');
  btn.disabled=true;L.classList.add('show');R.classList.remove('show');R.innerHTML='';
  try{
    const res=await fetch(API+'?q='+encodeURIComponent(q));
    DATA=await res.json();
    render();
  }catch(e){
    R.innerHTML=notFoundHTML('تعذّر الاتصال — حاول مرة ثانية');R.classList.add('show');
  }finally{btn.disabled=false;L.classList.remove('show');}
}
function notFoundHTML(msg){
  return '<div class="notfound"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><p>'+esc(msg)+'</p></div>';
}
function render(){
  const R=document.getElementById('result');
  if(!DATA||!DATA.found){R.innerHTML=notFoundHTML(DATA&&DATA.message||'لم يُعثر على بياناتك');R.classList.add('show');return;}
  const d=DATA,p=d.progress;
  const passed=p.done>=p.total&&p.total>0;
  const pill=passed?'<span class="tpill"><span class="dot dot-on"></span>أكمل خطته</span>':'<span class="tpill"><span class="dot dot-prog"></span>قيد التقدّم</span>';
  const firstCurrent=d.courses.findIndex(c=>c.status!=='done');
  const steps=d.courses.map((c,i)=>{
    const isLast=i===d.courses.length-1;
    let cls,inner,tag;
    if(c.status==='done'){
      cls='done';
      inner='<svg viewBox="0 0 24 24" fill="#fff"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
      tag='<span class="step-tag tag-done">تم الإنجاز ✓</span>';
    }else if(c.status==='scheduled'){
      cls=(i===firstCurrent)?'current':'none';
      inner=toAr(i+1);
      tag='<span class="step-tag tag-sched">تبدأ في '+dateLabel(c.value)+'</span>';
    }else{
      cls=(i===firstCurrent)?'current':'none';
      inner=toAr(i+1);
      tag='<span class="step-tag tag-none">لم تبدأ بعد</span>';
    }
    const lineColor=c.status==='done'?'var(--green)':'rgba(92,15,15,.1)';
    const vline=isLast?'':'<div class="vline" style="background:'+lineColor+'"></div>';
    const nameCls=(c.status==='none')?'step-name muted':'step-name';
    return '<div class="step"><div class="step-left"><div class="circle '+cls+'">'+inner+'</div>'+vline+'</div>'+
      '<div class="step-content"><div class="'+nameCls+'">'+esc(c.name)+'</div>'+tag+'</div></div>';
  }).join('');
  R.innerHTML=
    '<div class="tcard"><div class="tcard-top">'+
      '<div class="tavatar">'+esc(initials(d.name))+'</div>'+
      '<div class="tname">'+esc(d.name)+'</div>'+
      '<div class="tsub">'+(d.batch?('الدفعة '+toAr(d.batch)+' — '):'')+'معهد تمكين</div>'+pill+
    '</div>'+
    '<div class="tprog"><div class="tprog-track"><div class="tprog-fill" style="width:0%"></div></div></div>'+
    '<div class="tcard-bottom">'+
      '<div><div class="tc-n">'+toAr(p.pct)+'%</div><div class="tc-l">نسبة الإنجاز</div></div>'+
      '<div><div class="tc-n">'+toAr(p.done)+'/'+toAr(p.total)+'</div><div class="tc-l">الدورات المكتملة</div></div>'+
    '</div></div>'+
    '<div class="path"><div class="path-head">مسارك التدريبي</div><div class="path-body">'+steps+'</div></div>';
  R.classList.add('show');
  setTimeout(()=>{const f=R.querySelector('.tprog-fill');if(f)f.style.width=p.pct+'%';},100);
  R.scrollIntoView({behavior:'smooth',block:'start'});
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
</script>
</body>
</html>
