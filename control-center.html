<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مركز التحكم — تمكين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#5C0F0F;--crimson-2:#6B1212;--crimson-soft:#F4E7E5;
  --cream:#FAF7F2;--cream-2:#F2EDE5;--line:#E7DDD0;--card:#FFFFFF;
  --text:#1A0808;--muted:#7A6060;--green:#2E7D32;--green-soft:#E6F2E7;
  --amber:#A15C00;--amber-soft:#FBEFD9;--red:#B3261E;--red-soft:#FBE4E2;
  --radius:14px;--shadow:0 1px 2px rgba(60,10,10,.06),0 4px 14px rgba(60,10,10,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--text);font-family:'Cairo',system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--crimson)}
[hidden]{display:none!important}

/* ---------- الدخول ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:32px 26px;width:100%;max-width:380px;text-align:center}
.logo{width:56px;height:56px;border-radius:16px;background:var(--crimson);color:var(--cream);display:grid;place-items:center;font-weight:800;font-size:24px;margin:0 auto 14px}
.login-card h1{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 20px;color:var(--muted);font-size:13px}
.pin-input{width:100%;text-align:center;letter-spacing:10px;font-size:24px;font-weight:700;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--cream);direction:ltr}
.pin-input:focus{outline:none;border-color:var(--crimson)}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:10px}

/* ---------- أساسيات ---------- */
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--crimson);color:var(--cream);transition:.15s}
.btn:hover{background:var(--crimson-2)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--crimson);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--cream-2)}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.green{background:var(--green)}
.btn.block{width:100%;margin-top:14px;padding:12px}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:13px}
.icon-btn:hover{background:var(--cream-2);color:var(--crimson)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea,.inp{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--text);width:100%}
.field textarea{min-height:80px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{outline:none;border-color:var(--crimson)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--cream-2);color:var(--muted);white-space:nowrap}
.b-red{background:var(--red-soft);color:var(--red)}
.b-amber{background:var(--amber-soft);color:var(--amber)}
.b-green{background:var(--green-soft);color:var(--green)}
.b-crimson{background:var(--crimson-soft);color:var(--crimson)}
.muted{color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13.5px}

/* ---------- الهيدر ---------- */
.demo-bar{background:var(--amber-soft);color:var(--amber);text-align:center;font-size:12.5px;font-weight:700;padding:6px 12px}
header{background:var(--crimson);color:var(--cream);padding:14px 20px}
.hdr{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr .logo{width:40px;height:40px;font-size:18px;margin:0;background:var(--cream);color:var(--crimson);border-radius:12px}
.hdr h1{margin:0;font-size:18px}
.hdr small{display:block;opacity:.75;font-size:12px;font-weight:400}
.hdr .sp{flex:1}
.hdr .btn.ghost{color:var(--cream);border-color:rgba(250,247,242,.35)}
.hdr .btn.ghost:hover{background:rgba(250,247,242,.12)}

.wrap{max-width:1240px;margin:0 auto;padding:16px}
.depts{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--text);display:flex;gap:6px;align-items:center}
.chip .n{background:var(--cream-2);border-radius:999px;padding:0 7px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--crimson);border-color:var(--crimson);color:var(--cream)}
.chip.on .n{background:rgba(250,247,242,.2);color:var(--cream)}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tab.on{color:var(--crimson);border-bottom-color:var(--crimson)}
.tab .n{font-size:11px;background:var(--crimson);color:var(--cream);border-radius:999px;padding:0 6px;margin-right:4px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 12px;font-size:15.5px;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:1.4fr 1fr}
.g-dept{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}

.kpi{padding:14px 16px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--green)} .kpi.crimson .v{color:var(--crimson)}

.dept-card{display:flex;flex-direction:column;gap:10px;cursor:default}
.dept-card .top{display:flex;align-items:center;gap:8px}
.dept-card .top b{font-size:16px}
.dept-card .top .sp{flex:1}
.mrow{display:flex;flex-wrap:wrap;gap:6px}
.m{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-width:72px}
.m b{display:block;font-size:17px}
.m span{font-size:11.5px;color:var(--muted)}
.topq{font-size:12.5px;background:var(--crimson-soft);color:var(--crimson);border-radius:10px;padding:7px 10px}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:1fr 46px;gap:10px;align-items:center;font-size:13px}
.bar-label{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar-label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:var(--cream-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--crimson);border-radius:99px}
.bar-row b{text-align:left}

.spark{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:6px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.spark i{display:block;width:100%;background:var(--crimson);border-radius:5px 5px 2px 2px;min-height:2px;opacity:.85}
.spark small{font-size:10px;color:var(--muted)}

/* ---------- المهام ---------- */
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.form-grid .wide{grid-column:span 2}
.form-grid .full{grid-column:1/-1}
@media(max-width:800px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .wide{grid-column:1/-1}}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .inp{width:auto;min-width:140px;flex:1}
.task{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin-bottom:10px}
.task.over{border-right:4px solid var(--red)}
.task.done{opacity:.7}
.task .t-title{font-weight:800;font-size:15px}
.task .t-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.task .t-details{grid-column:1/-1;font-size:13.5px;color:#4a3030;white-space:pre-wrap}
.task .t-note{grid-column:1/-1;font-size:13px;background:var(--green-soft);color:#1f4d22;border-radius:8px;padding:7px 10px}
.task .t-act{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.task .t-act select{border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font-weight:700;background:#fff}

/* ---------- الأسئلة ---------- */
.faq{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
.faq.pending{border-color:#E9C88E;background:#FFFCF5}
.faq-h{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.faq-rank{width:30px;height:30px;border-radius:9px;background:var(--crimson-soft);color:var(--crimson);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.faq-q{flex:1;font-weight:700;min-width:0}
.faq-q small{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-weight:600}
.faq-cnt{text-align:center;flex:none}
.faq-cnt b{display:block;font-size:20px;color:var(--crimson);line-height:1}
.faq-cnt span{font-size:10.5px;color:var(--muted)}
.faq-b{border-top:1px dashed var(--line);padding:12px 14px;background:var(--cream)}
.faq-a{white-space:pre-wrap;font-size:14px;margin-bottom:10px}
.faq-actions{display:flex;gap:6px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;color:var(--muted);font-size:12px;font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl-wrap{overflow-x:auto}

.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;background:var(--cream);border:1px solid var(--line);text-decoration:none;color:var(--text);font-weight:600;font-size:13.5px}
.lnk:hover{border-color:var(--crimson);color:var(--crimson)}

/* ---------- الحضور والتقارير ---------- */
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--crimson);color:var(--cream)}
.team-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.team-bar .sp{flex:1}
.who{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.dot.in{background:var(--green)} .dot.out{background:#9a8a8a} .dot.no{background:var(--red)}
.time{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
tr.click{cursor:pointer} tr.click:hover td{background:var(--cream)}
.rep{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;overflow:hidden}
.rep-h{display:flex;gap:8px;align-items:center;padding:11px 14px;cursor:pointer;flex-wrap:wrap}
.rep-h b{flex:1;min-width:140px}
.rep-b{border-top:1px dashed var(--line);padding:12px 14px;background:var(--cream);display:grid;gap:10px}
.rep-f h5{margin:0 0 4px;font-size:12.5px;color:var(--crimson)}
.rep-f .v{white-space:pre-wrap;font-size:13.5px}
.rep-f table{background:#fff;border-radius:8px;font-size:12.5px}
.rep-f td,.rep-f th{padding:6px 8px}
.notice{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 14px;font-size:13.5px;font-weight:600}

/* ---------- الدورات والمدربين ---------- */
.rank{list-style:none;margin:0;padding:0}
.rank li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.rank li:last-child{border:0}
.rank .pos{width:26px;height:26px;border-radius:50%;background:var(--cream-2);color:var(--crimson);display:grid;place-items:center;font-weight:800;font-size:12.5px;flex:none}
.rank li:first-child .pos{background:var(--crimson);color:var(--cream)}
.rank .nm{flex:1;min-width:0}
.rank .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .nm span{font-size:12px;color:var(--muted)}
.rank .val{font-weight:800;color:var(--crimson);white-space:nowrap}
.rank .val small{font-weight:600;color:var(--muted);font-size:11px}
.num{text-align:center}
.tr-layout{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.tr-side{position:sticky;top:12px;max-height:calc(100vh - 40px);display:flex;flex-direction:column}
.tr-list{overflow-y:auto;flex:1;margin:0 -8px;padding:0 8px}
.tr-item{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;border-radius:10px;padding:8px;cursor:pointer;text-align:right;color:var(--text)}
.tr-item:hover{background:var(--cream)}
.tr-item.on{background:var(--crimson-soft)}
.tr-av{width:32px;height:32px;border-radius:50%;background:var(--cream-2);color:var(--crimson);display:grid;place-items:center;font-weight:800;flex:none}
.tr-item.on .tr-av{background:var(--crimson);color:var(--cream)}
.tr-nm{flex:1;min-width:0}
.tr-nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-nm small{font-size:11px;color:var(--muted)}
.tr-metric{font-size:12px;font-weight:800;color:var(--crimson);white-space:nowrap}
.tr-hero{background:var(--crimson);color:var(--cream);border:0}
.tr-hero h2{margin:0;font-size:20px}
.tr-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.tr-kpis div{background:rgba(250,247,242,.12);border-radius:10px;padding:9px 4px;text-align:center}
.tr-kpis b{display:block;font-size:20px}
.tr-kpis span{font-size:11px;opacity:.8}
.tl-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.tl-row:last-child{border:0}
.tl-date{width:44px;text-align:center;background:var(--cream);border-radius:9px;padding:4px 0;flex:none}
.tl-row.up .tl-date{background:var(--green-soft);color:var(--green)}
.tl-date b{display:block;font-size:17px;line-height:1.1}
.tl-date small{font-size:10px;color:var(--muted)}
.tl-body{flex:1;min-width:0;font-size:14px}
.tl-stats{display:flex;gap:12px;align-items:center;flex:none;font-size:11px;color:var(--muted);text-align:center}
.tl-stats b{display:block;font-size:14px;color:var(--text)}
@media(max-width:900px){.tr-layout{grid-template-columns:1fr}.tr-side{position:static;max-height:none}.tr-list{max-height:280px}.tr-kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.tl-row{flex-wrap:wrap}.tl-stats{width:100%;padding-right:56px}}

/* ---------- نافذة ---------- */
#modal{position:fixed;inset:0;background:rgba(26,8,8,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal-box{background:#fff;border-radius:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:20px}
.modal-box h3{margin:0 0 14px}
.modal-box .grid{grid-template-columns:1fr 1fr}
.modal-box .full{grid-column:1/-1}
.modal-foot{display:flex;gap:8px;justify-content:flex-start;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--cream);padding:10px 18px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
#toast.show{opacity:1}
.loading{opacity:.5;pointer-events:none}
</style>
</head>
<body>

<!-- ======================== الدخول ======================== -->
<section id="login">
  <div class="login-card">
    <div class="logo">ت</div>
    <h1>مركز التحكم</h1>
    <p id="loginHint">للمدير فقط — أدخل الرمز السري</p>
    <form id="loginForm" autocomplete="off">
      <input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="12" placeholder="••••••" required>
      <button class="btn block" id="loginBtn">دخول</button>
    </form>
    <div class="err" id="loginErr"></div>
  </div>
</section>

<!-- ======================== اللوحة ======================== -->
<section id="app" hidden>
  <div class="demo-bar" id="demoBar" hidden>وضع تجريبي — بيانات وهمية للمعاينة (رمز الدخول: 123456)</div>
  <header>
    <div class="hdr">
      <div class="logo">ت</div>
      <div><h1>مركز التحكم</h1><small id="hdrSub">كل الأقسام في مكان واحد</small></div>
      <div class="sp"></div>
      <button class="btn ghost sm" id="refreshBtn">↻ تحديث</button>
      <button class="btn ghost sm" id="logoutBtn">خروج</button>
    </div>
  </header>

  <div class="wrap">
    <div class="depts" id="depts"></div>
    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="overview">نظرة عامة</button>
      <button class="tab" data-tab="courses">الدورات والمدربين</button>
      <button class="tab" data-tab="tasks">المهام</button>
      <button class="tab" data-tab="faq">الأسئلة الشائعة</button>
      <button class="tab" data-tab="team">الحضور والتقارير</button>
      <button class="tab" data-tab="staff">الموظفين</button>
      <button class="tab" data-tab="links">روابط الأقسام</button>
    </nav>
    <main id="view"></main>
  </div>
</section>

<div id="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
/* ======================================================
   الإعدادات — الصق رابط ControlCenter.gs بعد النشر هنا
   ====================================================== */
const CONFIG = {
  API_URL: '',
  STAFF_PAGE: 'https://tamkeenkuw.com/staff-attendance.html',
  SITE: 'https://tamkeenkuw.com/',
  LINKS: {
    'تمكين': [
      ['لوحة العمليات','operations.html'],['لوحة المالك','admin.html'],['حضور الموظفين','staff-attendance.html'],
      ['داش بورد المدربين','trainer-dashboard.html'],['حجز الدورات','booking.html'],['الترشيحات الحكومية','nominations-admin.html'],
      ['إعداد الاستشارات','consultation-setup.html'],['استشارات الأعضاء','member-consultation.html'],['حضور الجلسات','attendance.html'],
      ['الصفحة الرئيسية','index.html']
    ],
    'مسار': [
      ['داش بورد مسار','masar-dashboard.html'],['الدورات المجانية','masar-free.html'],['باقة الذكاء الاصطناعي','masar-ai.html'],
      ['باقة الإدارة','masar-leadership.html'],['الدورات الخاصة','masar-private.html'],['ملف المتدرب','masar-profile.html'],
      ['تأكيد الحضور','masar-attend.html'],['روابط مسار','bymasar.html']
    ],
    'إيديو كلاود': [],
    'نوت كلاود': [],
    'عام': [['صفحة الموظفين (حضور، مهام، تقارير)','staff-attendance.html']]
  }
};

const DEMO = !CONFIG.API_URL || new URLSearchParams(location.search).has('demo');

/* ======================================================
   محرك تجريبي (يشتغل بس لما ما فيه رابط سكربت)
   ====================================================== */
const Demo = (() => {
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const day = off => { const d = new Date(); d.setDate(d.getDate()+off); return fmt(d); };

   ====================================================== */
const session = { pin: '' };
try { session.pin = sessionStorage.getItem('cc_pin') || ''; } catch(e) {}

async function api(action, payload = {}) {
  const body = Object.assign({ action, pin: session.pin }, payload);
  if (DEMO) return Demo.handle(body);
  const r = await fetch(CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'صار خطأ');
  return j;
}

async function run(btn, fn) {
  const el = btn || $('#view');
  el.classList?.add('loading'); if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message || 'صار خطأ'); }
  finally { el.classList?.remove('loading'); if (btn) btn.disabled = false; }
}
function setData(d) {
  const deptOf = {}; (d.staff||[]).forEach(s => { deptOf[s.name] = s.dept; });
  (d.tasks||[]).forEach(t => { t.dept = deptOf[t.employee] || 'عام'; t.staffName = t.employee; });

  state.data = d; render();

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pin = $('#pin').value.trim();
  $('#loginErr').textContent = '';
  session.pin = pin;
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'جاري الدخول...';
  try {
    const d = await api('login');
    try { sessionStorage.setItem('cc_pin', pin); } catch(e) {}
    enter(d);
    if (d.firstSetup) toast('تم تعيين رمزك السري ✅ احفظه زين');
  } catch (err) {
    $('#loginErr').textContent = err.message;
    session.pin = '';
  } finally { btn.disabled = false; btn.textContent = 'دخول'; }
});

  $('#login').hidden = true; $('#app').hidden = false;

const normName = n => String(n||'').replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();

/* ---------- حساب الدوام: غياب / تأخير / خروج مبكر ---------- */
const DAY_NAMES = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const toMin = s => { if (!s) return null; const [h,m] = s.split(':').map(Number); return h*60+m; };
const dowOf = d => { const [y,m,dd] = d.split('-').map(Number); return new Date(Date.UTC(y,m-1,dd)).getUTCDay(); };
const DEF_SCHED = { def:{days:[0,1,2,3,4],start:'08:00',end:'14:00',grace:15}, staff:{}, holidays:[], from:'' };
const schedOf = t => t.schedule || DEF_SCHED;
function shiftFor(sc, name) {
  const k = Object.keys(sc.staff||{}).find(n => normName(n) === normName(name));
  return k ? sc.staff[k] : sc.def;
}
const holidayOn = (sc, d) => (sc.holidays||[]).find(h => h.date === d);
function trackFrom(t, name) {
  const fs = (t.attendance.firstSeen||{})[normName(name)] || '';
  const from = schedOf(t).from || '';
  if (!fs && !from) return '';
  return fs > from ? fs : from;
}
function mergeRecs(rows) {
  const m = {};
  rows.forEach(r => {
    const k = normName(r.name) + '|' + r.date;
    const o = m[k];
    if (!o) { m[k] = Object.assign({}, r); return; }
    if (r.inT && (!o.inT || r.inT < o.inT)) o.inT = r.inT;
    if (r.outT && (!o.outT || r.outT > o.outT)) o.outT = r.outT;
    o.mins = (o.mins || 0) + (r.mins || 0) || null;
  });
  return m;
}
/** حالة موظف في يوم معيّن */
function dayInfo(t, name, date, rec) {
  const sc = schedOf(t), sh = shiftFor(sc, name), hol = holidayOn(sc, date);
  const required = !hol && sh.days.includes(dowOf(date));
  const lateLimit = toMin(sh.start) + Number(sh.grace||0);
  if (rec) {
    const inM = toMin(rec.inT), outM = toMin(rec.outT);
    const late = required && inM != null && inM > lateLimit;
    const early = required && outM != null && outM < toMin(sh.end);
    return { status: required ? 'present' : 'extra', required, rec, sh, hol,
      late, lateMin: late ? inM - toMin(sh.start) : 0,
      early, earlyMin: early ? toMin(sh.end) - outM : 0,
      noOut: !rec.outT && date < t.today };
  }
  if (hol) return { status:'holiday', required:false, sh, hol };
  if (!required) return { status:'off', required:false, sh };
  const from = trackFrom(t, name);
  if (!from || date < from) return { status:'na', required:false, sh };
  if (date > t.today) return { status:'future', required:false, sh };
  if (date === t.today) return toMin(t.now) > lateLimit ? { status:'absentToday', required:true, sh } : { status:'pending', required:false, sh };
  return { status:'absent', required:true, sh };
}
function trackedNames(t, extra) {
  const base = (t.staffNames && t.staffNames.length ? t.staffNames : t.attendance.names) || [];
  const all = {}; base.concat(extra||[]).forEach(n => { if (n && !all[normName(n)]) all[normName(n)] = n; });
  return Object.values(all).filter(nameInDept);
}
const minsTxt = m => m >= 60 ? `${Math.floor(m/60)} س ${m%60} د` : `${m} د`;
const shiftTxt = sh => `${sh.start} – ${sh.end}`;

function teamToday(t) {

  const list = names.map(n => ({ name:n, info: dayInfo(t, n, t.today, recs[normName(n)+'|'+t.today]) }));
  const order = { present:0, extra:1, absentToday:2, pending:3, off:4, holiday:5, na:6, future:7 };

    <div class="tbl-wrap"><table>

      <tbody>${list.length ? list.map(x => `<tr>

        <td class="muted"><span class="time">${shiftTxt(x.info.sh)}</span></td>

      </tr>`).join('') : '<tr><td colspan="6" class="empty">ما فيه موظفين</td></tr>'}</tbody>

function monthDates(t) {
  const [y,m] = state.teamMonth.split('-').map(Number);
  const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const out = [];
  for (let d = 1; d <= last; d++) { const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; if (ds <= t.today) out.push(ds); }
  return out;
}

function monthStats(t) {
  const a = t.attendance;
  const recs = mergeRecs(a.rows);
  const names = trackedNames(t, a.rows.map(r => r.name));
  const dates = monthDates(t);
  const afterEnd = n => toMin(t.now) > toMin(shiftFor(schedOf(t), n).end);
  return names.map(n => {
    const o = { name:n, required:0, present:0, absent:0, late:0, lateMin:0, early:0, noOut:0, extra:0, mins:0, days:[] };
    dates.forEach(d => {
      const i = dayInfo(t, n, d, recs[normName(n)+'|'+d]);
      if (i.status === 'absentToday' && !afterEnd(n)) i.status = 'absentTodaySoft';
      o.days.push({ date:d, info:i });
      if (i.status === 'present') { o.required++; o.present++; }
      if (i.status === 'absent' || (i.status === 'absentToday')) { o.required++; o.absent++; }
      if (i.status === 'extra') o.extra++;
      if (i.late) { o.late++; o.lateMin += i.lateMin; }
      if (i.early) o.early++;
      if (i.noOut) o.noOut++;
      if (i.rec && i.rec.mins) o.mins += i.rec.mins;
    });
    o.pct = o.required ? Math.round(o.present / o.required * 100) : null;
    return o;
  });
}

function repValue(v) {
  const s = String(v).trim();
  if (/^[\[{]/.test(s)) {
    try {
      const j = JSON.parse(s);
      const arr = Array.isArray(j) ? j : [j];
      if (arr.length && arr.every(x => x && typeof x === 'object' && !Array.isArray(x))) {
        const keys = [...new Set(arr.flatMap(Object.keys))];
        return `<div class="tbl-wrap"><table><thead><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${arr.map(x=>`<tr>${keys.map(k=>`<td>${esc(typeof x[k]==='object'?JSON.stringify(x[k]):x[k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      }
      if (Array.isArray(j)) return `<div class="v">${esc(j.join('\n'))}</div>`;
    } catch (e) {}
  }
  return `<div class="v">${esc(s)}</div>`;
}

  const seg = state.crsSeg;
  const d = state.crs[state.crsMonth];
  const months = (d && d.months) || state.crsMonths || [state.crsMonth];
  if (d && d.months) state.crsMonths = d.months;
  const bar = `<div class="team-bar">
    <div class="seg" id="cseg">
      <button data-s="courses" class="${seg==='courses'?'on':''}">الدورات</button>
      <button data-s="demand" class="${seg==='demand'?'on':''}">الأكثر طلباً</button>
      <button data-s="trainers" class="${seg==='trainers'?'on':''}">المدربين</button>
    </div><div class="sp"></div>
    ${seg!=='trainers'?`<select class="inp" id="cmonth" style="width:auto;min-width:170px">${months.map(m=>`<option value="${m}" ${m===state.crsMonth?'selected':''}>${monthLabel(m)}</option>`).join('')}<option value="all" ${state.crsMonth==='all'?'selected':''}>كل الفترات</option></select>`:''}
  </div>`;
  if (seg === 'trainers') {
    if (!state.trn) { loadTrainers(); return bar + '<div class="card empty">جاري تحميل المدربين...</div>'; }
    return bar + vTrainers();
  }
  if (!d) { loadCourses(); return bar + '<div class="card empty">جاري تحميل الدورات...</div>'; }
  if (d.error) return bar + `<div class="notice">${esc(d.error)}</div>`;
  return bar + (seg === 'demand' ? vDemand(d) : vCourseList(d)) + `<p class="muted" style="font-size:12px;margin-top:10px">من شيت مسار: الدورات + التسجيلات + إصدار الشهادات.</p>`;
}

async function loadCourses() {
  const m = state.crsMonth;
  if (loadCourses.busy === m) return; loadCourses.busy = m;
  try { state.crs[m] = await api('courses', { month: m }); }
  catch (e) { state.crs[m] = { error: e.message }; }
  finally { loadCourses.busy = null; }
  if (state.tab === 'courses') renderView();
}
async function loadTrainers() {
  if (loadTrainers.busy) return; loadTrainers.busy = true;
  try {
    const d = await api('trainers');
    const today = state.data.today;
    d.trainers.forEach(t => {
      const past = t.courses.filter(c => c.date && c.date <= today), next = t.courses.filter(c => c.date && c.date > today);
      t.rate = t.regs ? Math.round(t.attended*100/t.regs) : 0;
      t.avg = t.count ? Math.round(t.regs/t.count) : 0;
      t.last = past.length ? past.map(c=>c.date).sort().pop() : '';
      t.first = t.courses.map(c=>c.date).filter(Boolean).sort()[0] || '';
      t.upcoming = next.length;
      const days = t.last ? daysAgo(t.last) : 9999;
      t.status = t.upcoming ? 'قادم' : days <= 60 ? 'نشط' : 'متوقف';
    });
    state.trn = d;
  } catch (e) { state.trn = { trainers: [], error: e.message }; }
  finally { loadTrainers.busy = false; }
  if (state.tab === 'courses') renderView();
}

function rankList(items, field, label, emptyMsg) {
  if (!items.length) return `<div class="empty">${emptyMsg}</div>`;
  const max = Math.max(...items.map(x => x[field])) || 1;
  return '<ul class="rank">' + items.map((c,i) => `<li><div class="pos">${i+1}</div>
    <div class="nm"><b>${esc(c.name)}</b><span>${esc([c.trainer, c.date?fmtD(c.date):'', c.sub].filter(Boolean).join(' · '))}</span>
      <div class="bar-track" style="margin-top:5px"><div class="bar-fill" style="width:${Math.round(c[field]*100/max)}%"></div></div></div>
    <div class="val">${c[field]} <small>${label}</small></div></li>`).join('') + '</ul>';
}

function vCourseList(d) {
  const t = d.totals;
  return `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi crimson"><div class="v">${t.courses}</div><div class="l">دورة · ${t.online} أونلاين · ${t.onsite} حضوري</div></div>
    <div class="card kpi"><div class="v">${t.regs}</div><div class="l">تسجيل</div></div>
    <div class="card kpi green"><div class="v">${t.attended}</div><div class="l">حضروا · نسبة ${t.rate}%</div></div>
    <div class="card kpi"><div class="v">${t.certs}</div><div class="l">شهادة صادرة</div></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-bottom:14px">
    <div class="card"><h3>الأعلى حضوراً <span class="badge">${monthLabel(d.month)}</span></h3>${rankList(d.topAttendance,'attended','حاضر','ما فيه حضور مسجّل')}</div>
    <div class="card"><h3>الأكثر شهادات <span class="badge">${monthLabel(d.month)}</span></h3>${rankList(d.topCerts,'certs','شهادة','ما صدرت شهادات')}</div>
  </div>
  <div class="card"><h3>كل الدورات <span class="badge">${d.courses.length} دورة</span></h3>
    ${d.courses.length ? `<div class="tbl-wrap"><table><thead><tr><th>الدورة</th><th>المدرب</th><th>التاريخ</th><th>النظام</th><th class="num">مسجلين</th><th class="num">حضروا</th><th class="num">النسبة</th><th class="num">شهادات</th></tr></thead><tbody>
      ${d.courses.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.trainer)}</td><td style="white-space:nowrap">${fmtD(c.date)}</td><td>${modeBadge(c.mode)}</td>
        <td class="num">${c.regs}</td><td class="num">${c.attended}</td><td class="num">${rateBadge(c.rate)}</td><td class="num">${c.certs}</td></tr>`).join('')}
    </tbody></table></div>` : '<div class="empty">ما فيه دورات بهالفترة</div>'}
  </div>${diagBox(d)}`;
}

function diagBox(d) {
  const g = d.diag; if (!g) return '';
  const miss = (g.regMissing||[]).length + (g.certMissing||[]).length;
  if (d.totals.regs > 0 && !miss) return '';
  const li = arr => arr.map(x => `<span class="badge" style="margin:2px">${esc(x.name)} · ${x.n}</span>`).join('');
  return `<div class="notice" style="margin-top:14px;line-height:1.9">
    <b>فحص الربط</b> — التسجيلات: ${g.regRows||0} صف · انربط ${g.regMatched||0} · مستثنى ${g.regSkipped||0} · الشهادات: ${g.certRows||0} صف · انربط ${g.certMatched||0}
    ${(g.regMissing||[]).length ? `<br>أسماء بالتسجيلات ما لقيت لها دورة: ${li(g.regMissing)}` : ''}
    ${(g.certMissing||[]).length ? `<br>أسماء بالشهادات ما لقيت لها دورة: ${li(g.certMissing)}` : ''}
  </div>`;
}

function vDemand(d) {
  const list = d.demand.map(c => Object.assign({}, c, { sub: `انطرحت ${c.times} ${c.times>1?'مرات':'مرة'} · حضر ${c.attended} (${c.regs?Math.round(c.attended*100/c.regs):0}%)` }));
  return `<div class="card"><h3>الدورات الأكثر طلباً <span class="badge">حسب عدد التسجيلات · ${monthLabel(d.month)}</span></h3>
    ${rankList(list, 'regs', 'تسجيل', 'ما فيه تسجيلات بهالفترة')}</div>`;
}

function vTrainers() {
  const D = state.trn;
  if (D.error) return `<div class="notice">${esc(D.error)}</div>`;
  const q = normName(state.trQ).toLowerCase();
  const all = D.trainers;
  const S = state.trSort;
  const f = all.filter(t => !q || normName(t.name).toLowerCase().includes(q)).sort((a,b) =>
    S === 'last' ? (b.last||'').localeCompare(a.last||'') : S === 'rate' ? (b.rate-a.rate)||(b.regs-a.regs) : (b[S]-a[S])||(b.regs-a.regs));
  if (!state.trSel || !f.some(t => t.name === state.trSel)) state.trSel = f[0] ? f[0].name : '';
  const metric = t => S==='regs' ? t.regs+' مسجل' : S==='rate' ? t.rate+'%' : S==='last' ? (t.last?fmtD(t.last):'—') : t.count+' دورة';
  const ini = n => esc(String(n).replace(/^(د|أ|م)\.\s*/,'').trim()[0] || '؟');
  const t = all.find(x => x.name === state.trSel);
  return `<div class="tr-layout">
    <aside class="card tr-side">
      <input class="inp" id="trQ" placeholder="🔍 ابحث عن مدرب…" value="${esc(state.trQ)}" style="margin-bottom:8px">
      <div class="seg" id="trSort" style="display:grid;grid-template-columns:1fr 1fr;margin-bottom:8px">
        ${[['count','الأكثر دورات'],['regs','الأكثر مسجلين'],['rate','أعلى حضور'],['last','الأحدث']].map(([k,l]) => `<button data-k="${k}" class="${S===k?'on':''}" style="font-size:12px;padding:6px 4px">${l}</button>`).join('')}
      </div>
      <div class="muted" style="font-size:12px;margin-bottom:6px">${f.length} مدرب${q?` من ${all.length}`:''}</div>
      <div class="tr-list" id="trList">${f.map((x,i) => `<button class="tr-item ${x.name===state.trSel?'on':''}" data-tr="${all.indexOf(x)}">
        <span class="tr-av">${ini(x.name)}</span>
        <span class="tr-nm"><b>${esc(x.name)}</b><small>${x.status==='نشط'?'🟢':x.status==='قادم'?'🔵':'⚪'} ${x.status}</small></span>
        <span class="tr-metric">${metric(x)}</span></button>`).join('') || '<div class="empty">ما فيه مدرب بهالاسم</div>'}</div>
    </aside>
    <section id="trDetail">${t ? trDetail(t) : ''}</section>
  </div>`;
}

function courseRow(c) {
  const up = c.date > state.data.today;
  return `<div class="tl-row ${up?'up':''}">
    <div class="tl-date"><b>${c.date ? +c.date.slice(8) : '—'}</b><small>${c.date ? AR_MONTHS[+c.date.slice(5,7)-1] : ''}</small></div>
    <div class="tl-body"><b>${esc(c.name)}</b><div style="margin-top:3px">${modeBadge(c.mode)} ${up?'<span class="badge b-green">قادمة</span>':''} ${c.time?`<span class="muted" style="font-size:12px">${esc(c.time)}</span>`:''}</div></div>
    <div class="tl-stats"><span><b>${c.regs}</b>مسجل</span>${up?'':`<span><b>${c.attended}</b>حضر</span><span><b>${c.certs}</b>شهادة</span>${rateBadge(c.rate)}`}</div>
  </div>`;
}

function trDetail(t) {
  const today = state.data.today;
  const upcoming = t.courses.filter(c => c.date > today).sort((a,b) => a.date.localeCompare(b.date));
  const past = t.courses.filter(c => !(c.date > today));
  const best = past.filter(c => c.attended > 0).slice().sort((a,b) => b.attended - a.attended).slice(0,3);
  const groups = {}; past.forEach(c => { const k = c.date ? c.date.slice(0,7) : 'بدون تاريخ'; (groups[k] ||= []).push(c); });
  const gKeys = Object.keys(groups).sort().reverse();
  const rep = {}; t.courses.forEach(c => rep[c.name] = (rep[c.name]||0) + 1);
  const repList = Object.keys(rep).sort((a,b) => rep[b]-rep[a]);
  return `
  <div class="card tr-hero" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <div style="flex:1;min-width:0"><h2>${esc(t.name)}</h2><div style="opacity:.8;font-size:13px">${t.first?'من '+fmtD(t.first):''}${t.last?' · آخر دورة '+fmtD(t.last):''}</div></div>
      <span class="badge" style="background:rgba(250,247,242,.18);color:var(--cream)">${t.status}</span>
    </div>
    <div class="tr-kpis">
      <div><b>${t.count}</b><span>دورة</span></div><div><b>${t.unique}</b><span>عنوان مختلف</span></div>
      <div><b>${t.regs}</b><span>مسجل</span></div><div><b>${t.avg}</b><span>متوسط/دورة</span></div>
      <div><b>${t.rate}%</b><span>نسبة الحضور</span></div><div><b>${t.certs}</b><span>شهادة</span></div>
    </div>
  </div>
  ${upcoming.length ? `<div class="card" style="margin-bottom:14px"><h3>دورات قادمة <span class="badge">${upcoming.length}</span></h3>${upcoming.map(courseRow).join('')}</div>` : ''}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:14px">
    <div class="card"><h3>أبرز دوراته <span class="badge">حسب الحضور</span></h3>${rankList(best.map(c=>Object.assign({},c,{trainer:''})),'attended','حاضر','ما فيه حضور مسجّل')}</div>
    <div class="card"><h3>العناوين اللي يقدمها <span class="badge">${repList.length}</span></h3><div class="links">${repList.map(n => `<span class="badge" style="font-size:12.5px;padding:5px 10px">${esc(n)}${rep[n]>1?` <b style="color:var(--crimson)">×${rep[n]}</b>`:''}</span>`).join('')}</div></div>
  </div>
  <div class="card"><h3>سجل الدورات <span class="badge">${past.length} دورة</span></h3>
    ${gKeys.length ? gKeys.map(k => `<div style="display:flex;align-items:center;gap:8px;margin:12px 0 4px;color:var(--crimson);font-weight:800;font-size:13.5px">${k==='بدون تاريخ'?k:monthLabel(k)}<i style="flex:1;height:1px;background:var(--line)"></i><span class="badge">${groups[k].length}</span></div>${groups[k].map(courseRow).join('')}`).join('') : '<div class="empty">ما قدّم دورات للحين</div>'}
  </div>`;
}

/* ---------- الروابط ---------- */
function vLinks() {
  const d = state.data;
  const deps = state.dept==='الكل' ? d.depts : [state.dept];
  return `<div class="grid g-dept">${deps.map(dep => {
    const l = (CONFIG.LINKS[dep]||[]).map(([n,u]) => `<a class="lnk" href="${CONFIG.SITE+u}" target="_blank">${esc(n)} ↗</a>`);
    const sh = (d.sheets||[]).filter(x=>x.dept===dep).map(x => `<a class="lnk" href="${esc(x.url)}" target="_blank">📊 ${esc(x.label)}</a>`);
    const all = sh.concat(l);
    return `<div class="card"><h3>${esc(dep)}</h3>${all.length?`<div class="links">${all.join('')}</div>`:'<div class="muted" style="font-size:13px">ما فيه روابط للحين — تنضاف في CONFIG.LINKS داخل الصفحة</div>'}</div>`;
  }).join('')}</div>`;
}

/* ======================================================
   ربط الأحداث
   ====================================================== */
const bind = {
  overview() {
    $('#view').onclick = e => { const b = e.target.closest('[data-open]'); if (b) { state.dept = b.dataset.open; render(); } };
  },
  tasks() {
    $('#taskForm').onsubmit = e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      const wa = !!fd.wa; delete fd.wa;
      const link = wa ? waLink(fd.employee, fd) : null;
      const win = link ? window.open('', '_blank') : null;
      run(e.submitter, async () => {
        try { setData(await api('addTask', { task: fd })); }
        catch (err) { if (win) win.close(); throw err; }
        toast('تم إرسال المهمة ✅');
        if (win) win.location = link;
        else if (wa) toast('ما فيه رقم جوال لهالموظف — المهمة انرسلت بس بدون واتساب');
      });
    };
    $('#tq').oninput = e => { state.tf.q = e.target.value.trim(); clearTimeout(bind._t); bind._t = setTimeout(()=>{ renderView(); const i=$('#tq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }, 300); };
    $('#tstaff').onchange = e => { state.tf.staff = e.target.value; renderView(); };
    $('#tstatus').onchange = e => { state.tf.status = e.target.value; renderView(); };
    $('#taskList').onchange = e => {
      if (e.target.dataset.act !== 'status') return;
      const id = e.target.closest('.task').dataset.id;
      run(null, async () => { setData(await api('setTaskStatus', { id, status: e.target.value })); toast('تم تحديث الحالة'); });
    };
    $('#taskList').onclick = e => {
      const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
      const id = b.closest('.task').dataset.id;
      const t = state.data.tasks.find(x => x.id === id);
      if (b.dataset.act === 'wa') { const l = waLink(t.employee, t); l ? window.open(l, '_blank') : toast('ما فيه رقم جوال للموظف'); }
      if (b.dataset.act === 'del' && confirm(`حذف المهمة "${t.title}"؟ بتنشال من صفحة الموظف بعد.`)) run(null, async () => { setData(await api('deleteTask', { id })); toast('تم الحذف'); });
    };
  },
  faq() {
    $('#faqForm').onsubmit = e => {
      e.preventDefault();
      const fd = Object.fromEntries(new FormData(e.target));
      run(e.submitter, async () => { setData(await api('saveFaq', { faq: fd })); toast('تمت الإضافة ✅'); });
    };
    $('#fq').oninput = e => { state.faqQ = e.target.value.trim(); clearTimeout(bind._f); bind._f = setTimeout(()=>{ renderView(); const i=$('#fq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }, 300); };
    $('#fsort').onchange = e => { state.faqSort = e.target.value; renderView(); };
    $('#fch').onchange = e => { state.channel = e.target.value; };
    $('#faqList').onclick = e => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const box = b.closest('.faq'); const id = box.dataset.id;
      const f = state.data.faqs.find(x => x.id === id);
      const act = b.dataset.act;
      if (act === 'toggle') { const body = box.querySelector('.faq-b'); body.hidden = !body.hidden; return; }
      if (act === 'copy') { navigator.clipboard?.writeText(f.answer).then(()=>toast('تم نسخ الرد 📋'), ()=>toast('ما قدرت أنسخ')); return; }
      if (act === 'edit') return faqModal(f);
      if (act === 'log') return run(b, async () => { setData(await api('logInquiry', { faqId:id, channel: state.channel })); toast('تم تسجيل التكرار +١'); reopen(id); });
      if (act === 'del' && confirm('حذف هالسؤال؟')) run(null, async () => { setData(await api('deleteFaq', { id })); toast('تم الحذف'); });
    };
  },
  team() {
    $('#tseg').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; state.teamSeg = b.dataset.s; renderView(); };
    const tm = $('#tmonth'); if (tm) tm.onchange = e => { if (e.target.value) { state.teamMonth = e.target.value; state.teamWho = ''; renderView(); } };
    $('#view').onclick = e => {
      const sc = state.schedDraft;
      const dy = e.target.closest('[data-day]');
      if (dy && sc) {
        const sh = dy.dataset.scope === '__def' ? sc.def : sc.staff[dy.dataset.scope];
        const d = Number(dy.dataset.day);
        sh.days = sh.days.includes(d) ? sh.days.filter(x => x !== d) : sh.days.concat(d).sort();
        dy.classList.toggle('on'); return;
      }
      const cu = e.target.closest('[data-custom]');
      if (cu && sc) {
        const n = cu.dataset.custom; const k = Object.keys(sc.staff).find(x => normName(x) === normName(n));
        if (k) delete sc.staff[k]; else sc.staff[n] = JSON.parse(JSON.stringify(sc.def));
        renderView(); return;
      }
      if (e.target.closest('#holAdd') && sc) {
        const d = $('#holDate').value; if (!d) { toast('اختر التاريخ'); return; }
        if (!sc.holidays.some(h => h.date === d)) sc.holidays.push({ date:d, name:$('#holName').value.trim() });
        sc.holidays.sort((a,b) => a.date.localeCompare(b.date)); renderView(); return;
      }
      const dh = e.target.closest('[data-delhol]');
      if (dh && sc) { sc.holidays.splice(Number(dh.dataset.delhol), 1); renderView(); return; }
      if (e.target.closest('#schReset')) { state.schedDraft = null; renderView(); return; }
      const sv = e.target.closest('#schSave');
      if (sv && sc) {
        run(sv, async () => {
          const r = await api('saveSchedule', { schedule: sc });
          state.team = {}; state.schedDraft = null;
          state.teamSeg = 'month'; renderView(); toast('تم حفظ أوقات الدوام ✅');
        });
        return;
      }
      const w = e.target.closest('[data-who]'); if (w) { state.teamWho = w.dataset.who === state.teamWho ? '' : w.dataset.who; renderView(); return; }
      const h = e.target.closest('[data-rep]'); if (h) { const b = h.nextElementSibling; b.hidden = !b.hidden; }
    };
    $('#view').oninput = e => {
      const sc = state.schedDraft; if (!sc) return;
      const f = e.target.dataset.f;
      if (f) { const sh = e.target.dataset.scope === '__def' ? sc.def : sc.staff[e.target.dataset.scope]; sh[f] = f === 'grace' ? Number(e.target.value || 0) : e.target.value; }
      if (e.target.id === 'schFrom') sc.from = e.target.value;
    };
    const rw = $('#repWho'); if (rw) rw.onchange = e => { state.repWho = e.target.value; renderView(); };
    const rt = $('#repType'); if (rt) rt.onchange = e => { state.repType = e.target.value; renderView(); };
  },
  staff() {
    $('#view').onchange = e => {
      if (e.target.dataset.act !== 'dept') return;
      const name = e.target.closest('tr').dataset.name;
      run(null, async () => { setData(await api('setStaffDept', { name, dept: e.target.value })); toast('تم حفظ القسم'); });
    };
    $('#view').onclick = e => {
      const b = e.target.closest('[data-act="tasks"]'); if (!b) return;
      state.tf = { staff: b.closest('tr').dataset.name, status:'open', q:'' }; state.tab = 'tasks';
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab==='tasks')); renderView();
    };
    $('#pinForm').onsubmit = e => {
      e.preventDefault();
      const newPin = new FormData(e.target).get('newPin').trim();
      run(e.submitter, async () => {
        await api('changePin', { newPin });
        session.pin = newPin; try { sessionStorage.setItem('cc_pin', newPin); } catch(err) {}
        e.target.reset(); toast('تم تغيير الرمز ✅');
      });
    };
  },
  courses() {
    $('#cseg').onclick = e => { const b = e.target.closest('[data-s]'); if (!b) return; state.crsSeg = b.dataset.s; renderView(); };
    const cm = $('#cmonth'); if (cm) cm.onchange = e => { state.crsMonth = e.target.value; renderView(); };
    const tq = $('#trQ'); if (tq) tq.oninput = e => { state.trQ = e.target.value; clearTimeout(bind._r); bind._r = setTimeout(() => { renderView(); const i = $('#trQ'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 250); };
    const ts = $('#trSort'); if (ts) ts.onclick = e => { const b = e.target.closest('[data-k]'); if (!b) return; state.trSort = b.dataset.k; renderView(); };
    const tl = $('#trList'); if (tl) tl.onclick = e => {
      const b = e.target.closest('[data-tr]'); if (!b) return;
      state.trSel = state.trn.trainers[+b.dataset.tr].name;
      document.querySelectorAll('.tr-item').forEach(x => x.classList.toggle('on', x === b));
      $('#trDetail').innerHTML = trDetail(state.trn.trainers[+b.dataset.tr]);
      if (window.innerWidth < 900) $('#trDetail').scrollIntoView({ behavior:'smooth', block:'start' });
    };
  },
  links() {}
};

function reopen(id) { const b = document.querySelector(`.faq[data-id="${id}"] .faq-b`); if (b) b.hidden = false; }

/* ---------- نافذة عامة ---------- */
function openModal(title, html, onSave) {
  $('#modalBox').innerHTML = `<h3>${esc(title)}</h3><form id="mForm">${html}<div class="modal-foot"><button class="btn">حفظ</button><button type="button" class="btn ghost" id="mClose">إلغاء</button></div></form>`;
  $('#modal').hidden = false;
  const close = () => { $('#modal').hidden = true; };
  $('#mClose').onclick = close;
  $('#modal').onclick = e => { if (e.target.id === 'modal') close(); };
  $('#mForm').onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(e.target));
    run(e.submitter, async () => { await onSave(v); close(); toast('تم الحفظ ✅'); });
  };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });

/* ---------- دخول تلقائي لو الجلسة محفوظة ---------- */
if (DEMO) $('#loginHint').textContent = 'وضع تجريبي — الرمز: 123456';
if (session.pin) {
  api('login').then(enter).catch(() => { session.pin = ''; try { sessionStorage.removeItem('cc_pin'); } catch(e) {} });
}
</script>
</body>
