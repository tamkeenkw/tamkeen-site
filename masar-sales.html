<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مساحة المبيعات — أكاديمية مسار</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#5C0F0F; --crimson-2:#7A1515; --cream:#FAF7F2; --cream-2:#F2EDE5;
  --text:#1A0808; --muted:#7A6060;
  --green:#2E7D32; --green-bg:#E8F5E9;
  --yellow:#B26A00; --yellow-bg:#FFF3D6;
  --blue:#1565C0; --blue-bg:#E3F2FD;
  --purple:#7B1FA2; --purple-bg:#F3E5F5;
  --red:#C62828;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;background:var(--cream);}

#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;}
.login-logo{font-size:26px;font-weight:900;color:var(--crimson);}
.login-sub{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:3px;margin-top:4px;margin-bottom:34px;}
.login-card{background:#fff;border-radius:22px;padding:30px 24px;width:100%;box-shadow:0 8px 30px rgba(92,15,15,.08);border:1.5px solid rgba(92,15,15,.06);}
.login-card h2{font-size:18px;font-weight:900;margin-bottom:6px;text-align:center;}
.login-card p{font-size:13px;color:var(--muted);text-align:center;margin-bottom:22px;}
.pin-input{width:100%;text-align:center;font-size:26px;font-weight:900;letter-spacing:10px;padding:16px;border:1.5px solid rgba(92,15,15,.12);border-radius:14px;background:var(--cream);color:var(--text);outline:none;font-family:'Tajawal',sans-serif;}
.pin-input:focus{border-color:var(--crimson);background:#fff;}
.btn{width:100%;background:var(--crimson);color:#fff;font-family:'Tajawal',sans-serif;font-size:16px;font-weight:900;padding:15px;border:none;border-radius:14px;cursor:pointer;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{background:var(--crimson-2);}
.btn[disabled]{opacity:.6;}
.login-err{color:var(--red);font-size:13px;font-weight:700;text-align:center;margin-top:14px;min-height:18px;}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

#app{display:none;padding-bottom:78px;}
.header{background:var(--crimson);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;}
.header .h-title{font-size:17px;font-weight:900;color:#fff;}
.header .h-emp{font-size:11px;color:rgba(255,255,255,.6);font-weight:700;margin-top:2px;}
.header .h-badge{background:rgba(255,255,255,.12);color:rgba(255,255,255,.85);padding:6px 13px;border-radius:100px;font-size:12px;font-weight:800;border:1px solid rgba(255,255,255,.15);}

.view{display:none;padding:18px 16px;}
.view.active{display:block;}

.progress-card{background:linear-gradient(135deg,var(--crimson),var(--crimson-2));border-radius:22px;padding:24px;color:#fff;box-shadow:0 8px 24px rgba(92,15,15,.18);}
.pc-label{font-size:13px;font-weight:700;opacity:.8;}
.pc-num{font-size:46px;font-weight:900;line-height:1;margin:6px 0;}
.pc-num small{font-size:18px;font-weight:700;opacity:.7;}
.pbar{height:10px;background:rgba(255,255,255,.2);border-radius:100px;overflow:hidden;margin-top:14px;}
.pbar > div{height:100%;background:#fff;border-radius:100px;transition:width .6s;}
.pc-foot{font-size:12px;font-weight:700;opacity:.85;margin-top:10px;}
.mini-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.mini{background:#fff;border-radius:16px;padding:16px;text-align:center;border:1.5px solid rgba(92,15,15,.06);box-shadow:0 2px 12px rgba(92,15,15,.04);}
.mini .n{font-size:26px;font-weight:900;color:var(--crimson);}
.mini .l{font-size:12px;font-weight:700;color:var(--muted);margin-top:2px;}
.sect-title{font-size:15px;font-weight:900;margin:22px 4px 12px;}
.milestones{display:flex;flex-direction:column;gap:10px;}
.ms{background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border:1.5px solid rgba(92,15,15,.06);}
.ms .ms-l{font-size:14px;font-weight:800;}
.ms .ms-r{font-size:13px;font-weight:800;color:var(--muted);}
.ms.hit{background:var(--green-bg);border-color:rgba(46,125,50,.2);}
.ms.hit .ms-r{color:var(--green);}

.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.search{flex:1;min-width:150px;background:#fff;border:1.5px solid rgba(92,15,15,.1);border-radius:12px;padding:11px 14px;font-family:'Tajawal',sans-serif;font-size:14px;outline:none;}
.search:focus{border-color:var(--crimson);}
.filter{background:#fff;border:1.5px solid rgba(92,15,15,.1);border-radius:12px;padding:11px 12px;font-family:'Tajawal',sans-serif;font-size:13px;font-weight:700;color:var(--text);outline:none;}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:1.5px solid rgba(92,15,15,.06);box-shadow:0 2px 12px rgba(92,15,15,.04);}
.c-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.c-name{font-size:16px;font-weight:900;}
.c-meta{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px;line-height:1.6;}
.c-meta b{color:var(--text);font-weight:800;}
.badge{padding:4px 11px;border-radius:100px;font-size:11.5px;font-weight:800;white-space:nowrap;}
.b-reg{background:var(--blue-bg);color:var(--blue);}
.b-pkg{background:var(--purple-bg);color:var(--purple);}
.c-controls{margin-top:13px;display:flex;flex-direction:column;gap:9px;}
.sel,.note{width:100%;background:var(--cream);border:1.5px solid rgba(92,15,15,.1);border-radius:11px;padding:10px 12px;font-family:'Tajawal',sans-serif;font-size:13.5px;color:var(--text);outline:none;}
.note{resize:vertical;min-height:42px;}
.sel:focus,.note:focus{border-color:var(--crimson);background:#fff;}
.c-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
.c-actions.two{grid-template-columns:1fr 1fr;}
.act{padding:11px;border-radius:11px;font-family:'Tajawal',sans-serif;font-size:13.5px;font-weight:800;border:none;cursor:pointer;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;}
.a-wa{background:var(--crimson);color:#fff;}
.a-call{background:var(--cream-2);color:var(--crimson);}
.a-save{background:var(--blue-bg);color:var(--blue);}
.a-paid{background:var(--green);color:#fff;}
.a-link{background:#F3E9F7;color:var(--purple);}
.act:active{opacity:.8;}
.last-c{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:8px;}

.empty{text-align:center;padding:50px 20px;color:var(--muted);}
.empty .ico{width:46px;height:46px;margin:0 auto 12px;opacity:.4;}
.empty .t{font-size:15px;font-weight:800;color:var(--text);}
.empty .s{font-size:13px;margin-top:5px;}

.form-card{background:#fff;border-radius:18px;padding:20px;border:1.5px solid rgba(92,15,15,.06);box-shadow:0 2px 12px rgba(92,15,15,.04);}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px;}
.fld input,.fld select{width:100%;background:var(--cream);border:1.5px solid rgba(92,15,15,.1);border-radius:12px;padding:13px 14px;font-family:'Tajawal',sans-serif;font-size:14.5px;color:var(--text);outline:none;}
.fld input:focus,.fld select:focus{border-color:var(--crimson);background:#fff;}
.result-box{background:var(--cream-2);border-radius:14px;padding:16px;margin-top:16px;display:none;}
.result-box.show{display:block;}
.result-box .lbl{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px;}
.result-box .lnk{font-size:13px;font-weight:700;color:var(--crimson);word-break:break-all;background:#fff;padding:10px;border-radius:10px;border:1px solid rgba(92,15,15,.1);}
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}

.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 22px;border-radius:100px;font-size:13.5px;font-weight:800;z-index:60;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.2);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
.toast.ok{background:var(--green);}
.toast.err{background:var(--red);}

.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:#fff;border-top:1.5px solid rgba(92,15,15,.08);display:grid;grid-template-columns:repeat(4,1fr);z-index:40;box-shadow:0 -4px 20px rgba(92,15,15,.05);}
.nav-item{padding:9px 4px 11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);position:relative;}
.nav-item svg{width:23px;height:23px;}
.nav-item span{font-size:10.5px;font-weight:800;}
.nav-item.active{color:var(--crimson);}
.nav-dot{position:absolute;top:6px;left:calc(50% + 9px);background:var(--red);color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:100px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="login">
    <div class="login-logo">أكاديمية مسار</div>
    <div class="login-sub">مساحة المبيعات</div>
    <div class="login-card">
      <h2>تسجيل الدخول</h2>
      <p>أدخل رقمك السري للدخول إلى قائمة الاستهداف</p>
      <input id="pinInput" class="pin-input" type="tel" inputmode="numeric" placeholder="••••" maxlength="10" autocomplete="off">
      <button id="loginBtn" class="btn" onclick="doLogin()">دخول</button>
      <div id="loginErr" class="login-err"></div>
    </div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="header">
      <div>
        <div class="h-title">مساحة المبيعات</div>
        <div class="h-emp" id="hEmp"></div>
      </div>
      <div class="h-badge">@bymasar</div>
    </div>

    <!-- HOME -->
    <div class="view active" id="view-home">
      <div class="progress-card">
        <div class="pc-label">بيعاتك هذا الشهر</div>
        <div class="pc-num" id="pcNum">0 <small>/ 50</small></div>
        <div class="pbar"><div id="pcBar" style="width:0%"></div></div>
        <div class="pc-foot" id="pcFoot">الهدف الأساسي ٥٠ بيعة</div>
      </div>
      <div class="mini-row">
        <div class="mini"><div class="n" id="mAssigned">0</div><div class="l">عملاء للمتابعة</div></div>
        <div class="mini"><div class="n" id="mCycles">0</div><div class="l">دفعات مفتوحة</div></div>
      </div>
      <div class="sect-title">المكافآت والمعالم</div>
      <div class="milestones" id="milestones"></div>
    </div>

    <!-- TARGETS -->
    <div class="view" id="view-targets">
      <div class="toolbar">
        <input id="tSearch" class="search" placeholder="ابحث باسم أو رقم..." oninput="renderTargets()">
        <select id="tFilter" class="filter" onchange="renderTargets()">
          <option value="">الكل</option>
          <option value="تسجيل">تسجيلات</option>
          <option value="باقة">باقات</option>
        </select>
      </div>
      <div id="targetsList"></div>
    </div>

    <!-- LINK -->
    <div class="view" id="view-link">
      <div class="sect-title">توليد رابط دفع</div>
      <div class="form-card">
        <div class="fld"><label>اسم العميل</label><input id="lkName" placeholder="اسم العميل"></div>
        <div class="fld"><label>رقم الواتساب</label><input id="lkPhone" type="tel" inputmode="numeric" placeholder="مثال: 99887766"></div>
        <div class="fld"><label>المبلغ (د.ك)</label>
          <select id="lkAmount">
            <option value="15">شهادة تدريبية — ١٥ د.ك</option>
            <option value="45">باقة تدريبية — ٤٥ د.ك</option>
            <option value="40">اشتراك ٦ أشهر — ٤٠ د.ك</option>
            <option value="70">اشتراك ١٢ شهر — ٧٠ د.ك</option>
          </select>
        </div>
        <div class="fld"><label>وصف (اختياري)</label><input id="lkDesc" placeholder="شهادة تدريبية - أكاديمية مسار"></div>
        <button class="btn" id="lkBtn" onclick="genLink()">توليد الرابط</button>
        <div class="result-box" id="lkResult">
          <div class="lbl">رابط الدفع:</div>
          <div class="lnk" id="lkUrl"></div>
          <div class="result-actions">
            <button class="act a-save" onclick="copyLink()">نسخ الرابط</button>
            <button class="act a-wa" onclick="sendLinkWa()">إرسال واتساب</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ADD -->
    <div class="view" id="view-add">
      <div class="sect-title">إضافة عميل جديد</div>
      <div class="form-card">
        <div class="fld"><label>الاسم</label><input id="adName" placeholder="اسم العميل"></div>
        <div class="fld"><label>رقم الواتساب</label><input id="adPhone" type="tel" inputmode="numeric" placeholder="99887766"></div>
        <div class="fld"><label>الدورة / الخدمة</label><input id="adCourse" placeholder="اسم الدورة"></div>
        <div class="fld"><label>يبي شهادة؟</label>
          <select id="adCert"><option value="">غير محدد</option><option value="نعم">نعم</option><option value="لا">لا</option></select>
        </div>
        <div class="fld"><label>حالة الدفع</label>
          <select id="adPay"><option value="قيد الدفع">قيد الدفع</option><option value="لم يدفع">لم يدفع</option><option value="تم الدفع">تم الدفع</option></select>
        </div>
        <div class="fld"><label>ملاحظة (اختياري)</label><input id="adNote" placeholder="ملاحظة"></div>
        <button class="btn" id="adBtn" onclick="addClient()">إضافة العميل</button>
      </div>
    </div>

    <!-- NAV -->
    <div class="nav">
      <div class="nav-item active" data-tab="home" onclick="switchTab('home')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/></svg>
        <span>لوحتي</span>
      </div>
      <div class="nav-item" data-tab="targets" onclick="switchTab('targets')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></svg>
        <span>استهدافي</span>
        <span class="nav-dot" id="navDot" style="display:none">0</span>
      </div>
      <div class="nav-item" data-tab="link" onclick="switchTab('link')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a4 4 0 0 0 5.6 0l2.4-2.4a4 4 0 0 0-5.6-5.6L11 6.3"/><path d="M14 11a4 4 0 0 0-5.6 0L6 13.4a4 4 0 0 0 5.6 5.6L13 17.7"/></svg>
        <span>رابط دفع</span>
      </div>
      <div class="nav-item" data-tab="add" onclick="switchTab('add')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        <span>إضافة</span>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzYWuZ_NmulpprbueA0GXuwfi9KO2z55J5v330BfT7E_4jUNvbP5aTklkegjjnZ7a16/exec';
const STATUSES = ['تم التواصل','مهتم','غير مهتم','يحتاج متابعة','مغلق'];
let state = { employee:'', pin:'', stats:null, leads:[] };
let lastLink='', lastLinkPhone='';

async function api(body){
  const r = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body) });
  return r.json();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function digits(s){ return String(s||'').replace(/\D/g,''); }
function waNum(p){ let d=digits(p); if(d.length===8) d='965'+d; return d; }
function toast(msg,type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='toast show'+(type?(' '+type):''); setTimeout(()=>{t.className='toast'+(type?(' '+type):'');},2400); }

document.getElementById('pinInput').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

async function doLogin(){
  const pin=document.getElementById('pinInput').value.trim();
  const err=document.getElementById('loginErr'); const btn=document.getElementById('loginBtn');
  err.textContent='';
  if(!pin){ err.textContent='اكتب رقمك السري'; return; }
  btn.disabled=true; btn.innerHTML='<div class="spinner"></div>';
  try{
    const res=await api({type:'salesWorkspace', pin});
    if(!res||!res.ok){ err.textContent=(res&&res.error)?res.error:'تعذّر الدخول'; }
    else{ state.pin=pin; applyWorkspace(res); document.getElementById('login').style.display='none'; document.getElementById('app').style.display='block'; }
  }catch(e){ err.textContent='تعذّر الاتصال بالخادم'; }
  btn.disabled=false; btn.innerHTML='دخول';
}

function applyWorkspace(res){
  state.employee=res.employee||''; state.stats=res.stats||{}; state.leads=res.leads||[];
  document.getElementById('hEmp').textContent='أهلاً '+state.employee;
  renderAll();
}
async function refresh(){ try{ const res=await api({type:'salesWorkspace', pin:state.pin}); if(res&&res.ok) applyWorkspace(res); }catch(e){} }

function renderAll(){ renderHome(); renderTargets(); }

function renderHome(){
  const s=state.stats||{}; const pts=s.salesPoints||0; const target=s.target||50;
  const inCycle=pts%target; const pct=Math.min(100,Math.round((inCycle/target)*100));
  document.getElementById('pcNum').innerHTML=pts+' <small>/ '+(s.nextMilestone||target)+'</small>';
  document.getElementById('pcBar').style.width=pct+'%';
  document.getElementById('pcFoot').textContent = s.nextMilestone ? ('باقي '+(s.nextMilestone-pts)+' بيعة للمعلم القادم ('+s.nextMilestone+')') : ('الهدف الأساسي '+target+' بيعة');
  document.getElementById('mAssigned').textContent=s.assigned||0;
  document.getElementById('mCycles').textContent=(s.cycles||0)+1;
  const ms=[{n:50,t:'الهدف الأساسي'},{n:75,t:'مكافأة ٥٠٪ (٦٢.٥ د.ك)'},{n:100,t:'مكافأة ١٠٠٪ (١٢٥ د.ك)'},{n:150,t:'مكافأة ٢٠٠٪ (٢٥٠ د.ك)'}];
  document.getElementById('milestones').innerHTML=ms.map(m=>{const hit=pts>=m.n;return '<div class="ms'+(hit?' hit':'')+'"><div class="ms-l">'+m.t+'</div><div class="ms-r">'+(hit?'تحقق ✓':m.n+' بيعة')+'</div></div>';}).join('');
}

function typeBadge(t){ return t==='باقة' ? '<span class="badge b-pkg">باقة</span>' : '<span class="badge b-reg">شهادة</span>'; }

function leadCard(c){
  const opts=STATUSES.map(s=>'<option'+(c.status===s?' selected':'')+'>'+s+'</option>').join('');
  const wa=waNum(c.phone);
  const paidLabel = c.type==='باقة' ? 'تم الدفع ×٣' : 'تم الدفع';
  return '<div class="card">'
    + '<div class="c-top"><div><div class="c-name">'+esc(c.name||'—')+'</div>'
    + '<div class="c-meta"><b>'+esc(c.item||'—')+'</b>'+(c.date?(' · '+esc(c.date)):'')+'<br>'+esc(c.phone||'')+'</div></div>'
    + typeBadge(c.type)+'</div>'
    + '<div class="c-controls">'
    + '<select class="sel" id="st-'+c.row+'"><option value="">— حالة العميل —</option>'+opts+'</select>'
    + '<textarea class="note" id="nt-'+c.row+'" placeholder="ملاحظة...">'+esc(c.note||'')+'</textarea>'
    + '</div>'
    + (c.lastContact?'<div class="last-c">آخر تواصل: '+esc(c.lastContact)+'</div>':'')
    + '<div class="c-actions">'
    + '<a class="act a-wa" href="https://wa.me/'+wa+'" target="_blank">واتساب</a>'
    + '<a class="act a-call" href="tel:'+digits(c.phone)+'">اتصال</a>'
    + '<button class="act a-save" onclick="saveClient('+c.row+')">حفظ</button>'
    + '</div>'
    + '<div class="c-actions two" style="margin-top:8px">'
    + '<button class="act a-link" onclick="linkFor('+c.row+')">رابط دفع</button>'
    + '<button class="act a-paid" onclick="markPaid('+c.row+')">'+paidLabel+'</button>'
    + '</div></div>';
}

function renderTargets(){
  const q=(document.getElementById('tSearch').value||'').trim();
  const f=document.getElementById('tFilter').value;
  let list=state.leads.slice();
  if(f) list=list.filter(c=>c.type===f);
  if(q){ const qd=digits(q); list=list.filter(c=> (c.name||'').includes(q) || digits(c.phone).includes(qd)); }
  const el=document.getElementById('targetsList');
  el.innerHTML = list.length ? list.map(leadCard).join('') : emptyState('لا يوجد عملاء في القائمة','كله مغلق أو ما في استهداف بعد');
  const dot=document.getElementById('navDot'); const n=state.leads.length;
  if(n>0){ dot.style.display='flex'; dot.textContent=n; } else { dot.style.display='none'; }
}

function emptyState(t,s){ return '<div class="empty"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg><div class="t">'+t+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }

async function saveClient(row){
  const status=document.getElementById('st-'+row).value;
  const note=document.getElementById('nt-'+row).value;
  const res=await api({type:'salesUpdateClient', row, status, note});
  if(res&&res.ok){ const c=state.leads.find(x=>x.row===row); if(c){ c.status=status; c.note=note; c.lastContact=new Date().toISOString().slice(0,10);} toast('تم الحفظ','ok'); }
  else toast('تعذّر الحفظ','err');
}

async function markPaid(row){
  const c=state.leads.find(x=>x.row===row);
  if(!confirm('تأكيد أن العميل دفع؟ سيُسجّل كبيعة لك ويُنقل للأرشيف.')) return;
  const res=await api({type:'salesMarkPaid', row, employee:state.employee});
  if(res&&res.ok){ toast('تم تسجيل البيعة','ok'); await refresh(); }
  else toast('تعذّر التحديث','err');
}

function linkFor(row){
  const c=state.leads.find(x=>x.row===row); if(!c) return;
  document.getElementById('lkName').value=c.name||'';
  document.getElementById('lkPhone').value=digits(c.phone);
  document.getElementById('lkAmount').value = c.type==='باقة' ? '45' : '15';
  document.getElementById('lkDesc').value = c.item || '';
  document.getElementById('lkResult').className='result-box';
  switchTab('link');
}

async function genLink(){
  const name=document.getElementById('lkName').value.trim();
  const phone=digits(document.getElementById('lkPhone').value);
  const amount=document.getElementById('lkAmount').value;
  const desc=document.getElementById('lkDesc').value.trim()||'أكاديمية مسار';
  const btn=document.getElementById('lkBtn');
  if(!phone){ toast('اكتب رقم الواتساب','err'); return; }
  btn.disabled=true; btn.innerHTML='<div class="spinner"></div>';
  try{
    const res=await api({type:'salesTapLink', name, phone, amount, desc});
    if(res&&res.ok&&res.url){ lastLink=res.url; lastLinkPhone=waNum(phone); document.getElementById('lkUrl').textContent=res.url; document.getElementById('lkResult').className='result-box show'; toast('تم توليد الرابط','ok'); }
    else toast('تعذّر توليد الرابط','err');
  }catch(e){ toast('خطأ بالاتصال','err'); }
  btn.disabled=false; btn.innerHTML='توليد الرابط';
}
function copyLink(){ if(!lastLink) return; navigator.clipboard.writeText(lastLink).then(()=>toast('تم نسخ الرابط','ok')).catch(()=>toast('انسخه يدوياً','err')); }
function sendLinkWa(){ if(!lastLink) return; const msg='مرحباً، رابط الدفع الخاص بك من أكاديمية مسار:\n'+lastLink; window.open('https://wa.me/'+lastLinkPhone+'?text='+encodeURIComponent(msg),'_blank'); }

async function addClient(){
  const name=document.getElementById('adName').value.trim();
  const phone=digits(document.getElementById('adPhone').value);
  const course=document.getElementById('adCourse').value.trim();
  const wantCert=document.getElementById('adCert').value;
  const payment=document.getElementById('adPay').value;
  const note=document.getElementById('adNote').value.trim();
  const btn=document.getElementById('adBtn');
  if(!name||!phone){ toast('الاسم والرقم مطلوبان','err'); return; }
  btn.disabled=true; btn.innerHTML='<div class="spinner"></div>';
  try{
    const res=await api({type:'salesAddClient', name, phone, course, wantCert, payment, note, employee:state.employee});
    if(res&&res.ok){ toast('تمت إضافة العميل','ok'); ['adName','adPhone','adCourse','adNote'].forEach(id=>document.getElementById(id).value=''); await refresh(); switchTab('targets'); }
    else toast('تعذّرت الإضافة','err');
  }catch(e){ toast('خطأ بالاتصال','err'); }
  btn.disabled=false; btn.innerHTML='إضافة العميل';
}

function switchTab(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.tab===name));
  window.scrollTo(0,0);
}
</script>
</body>
</html>
