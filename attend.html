<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>تحضير الطلبة | EDUCLOUD</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#0D5C48;--teallt:#15705A;--accent:#1A8F6F;--accentlt:#22B08A;
 --bg:#040d09;--card:rgba(255,255,255,.045);--bd:rgba(255,255,255,.08);
 --muted:rgba(255,255,255,.38);--muted2:rgba(255,255,255,.62);
 --warn:#D6781E;--warnbg:rgba(214,120,30,.14);--red:#D65454}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:#fff;min-height:100vh;
 padding:18px 16px 110px;position:relative;-webkit-text-size-adjust:100%}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(ellipse 80% 50% at 15% 0%,#0d5c48 0%,transparent 60%),
            radial-gradient(ellipse 60% 40% at 85% 100%,#093d2e 0%,transparent 55%),var(--bg)}
.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto}

/* ═══ الدخول ═══ */
.gate{max-width:360px;margin:12vh auto;text-align:center}
.gate .lg{width:52px;height:52px;background:rgba(255,255,255,.08);border:1.5px solid var(--bd);
 border-radius:15px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.gate .lg svg{width:27px;height:27px}
.gate h1{font-size:20px;font-weight:900;margin-bottom:7px}
.gate p{font-size:12.5px;color:var(--muted);margin-bottom:24px}
.gate input{width:100%;background:rgba(255,255,255,.05);border:1.5px solid var(--bd);border-radius:14px;
 padding:15px 18px;font-family:'Cairo',sans-serif;font-size:16px;color:#fff;outline:none;text-align:center;letter-spacing:1px}
.gate input:focus{border-color:var(--accentlt)}
.gate .err{font-size:12.5px;color:var(--red);font-weight:700;margin-top:12px;min-height:18px}

.btn{background:var(--teal);color:#fff;font-family:'Cairo',sans-serif;font-size:15px;font-weight:900;
 border:none;border-radius:100px;padding:14px 22px;cursor:pointer;transition:.25s;
 display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--teallt)}
.btn:disabled{opacity:.55;cursor:default}
.btn.lg{width:100%;padding:16px;font-size:16px;margin-top:14px}
.btn.sm{font-size:12.5px;padding:10px 16px;border-radius:12px}
.btn.gh{background:rgba(255,255,255,.06);border:1.5px solid var(--bd)}

/* ═══ الترويسة ═══ */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.htitle{display:flex;align-items:center;gap:12px}
.htitle .lg{width:42px;height:42px;background:rgba(255,255,255,.07);border:1.5px solid var(--bd);
 border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.htitle .lg svg{width:22px;height:22px}
.htitle b{display:block;font-size:17px;font-weight:900;line-height:1.4}
.htitle span{display:block;font-size:11.5px;color:var(--muted);font-weight:700}
.hacts{display:flex;gap:8px;flex-wrap:wrap}

/* ═══ شريط اليوم ═══ */
.daybar{background:linear-gradient(135deg,rgba(13,92,72,.45),rgba(26,143,111,.14));
 border:1.5px solid rgba(34,176,138,.26);border-radius:18px;padding:16px 18px;margin-bottom:14px}
.daybar .top{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.daybar .d{flex:1;min-width:140px}
.daybar .d b{display:block;font-size:20px;font-weight:900;line-height:1.3}
.daybar .d span{display:block;font-size:12px;color:var(--muted2);font-weight:700;margin-top:3px}
.daybar input[type=date]{background:rgba(255,255,255,.07);border:1.5px solid var(--bd);
 border-radius:12px;padding:11px 14px;font-family:'Cairo',sans-serif;font-size:14px;color:#fff;
 outline:none;color-scheme:dark;direction:ltr;text-align:right}
.daybar input[type=date]:focus{border-color:var(--accentlt)}
.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.dq{font-size:12px;font-weight:800;color:var(--muted2);background:rgba(255,255,255,.07);
 border:1.5px solid var(--bd);border-radius:10px;padding:8px 14px;cursor:pointer;transition:.2s}
.dq.on{background:rgba(34,176,138,.16);border-color:var(--accentlt);color:var(--accentlt)}

/* ═══ بطاقات الدورات ═══ */
.courses{display:flex;flex-direction:column;gap:9px}
.cc{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--bd);
 border-radius:16px;padding:15px;cursor:pointer;transition:.18s;-webkit-tap-highlight-color:transparent}
.cc:hover{border-color:rgba(34,176,138,.35)}
.cc.done{border-color:rgba(34,176,138,.4);background:rgba(34,176,138,.06)}
.cc .tm{min-width:62px;text-align:center;background:rgba(255,255,255,.06);border-radius:11px;padding:8px 5px}
.cc .tm b{display:block;font-size:14px;font-weight:900;direction:ltr;line-height:1.25}
.cc .tm span{display:block;font-size:10px;color:var(--muted);font-weight:700;direction:ltr}
.cc .inf{flex:1;min-width:0}
.cc .inf b{display:block;font-size:15px;font-weight:900;line-height:1.45}
.cc .inf span{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:3px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .cnt{text-align:center;white-space:nowrap}
.cc .cnt b{display:block;font-size:17px;font-weight:900;color:var(--accentlt)}
.cc .cnt span{display:block;font-size:10px;color:var(--muted);font-weight:700}
.cc .ar{width:9px;height:14px;flex-shrink:0;opacity:.35}
.badge{font-size:10px;font-weight:800;border-radius:100px;padding:3px 9px;white-space:nowrap;display:inline-block}
.b-ok{background:rgba(34,176,138,.16);color:var(--accentlt)}
.b-w{background:var(--warnbg);color:var(--warn)}

/* ═══ كشف الحضور ═══ */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:800;
 color:var(--muted2);background:rgba(255,255,255,.06);border:1.5px solid var(--bd);
 border-radius:100px;padding:10px 18px;cursor:pointer;margin-bottom:13px}
.back:hover{color:#fff}
.chead{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px;margin-bottom:13px}
.chead b{display:block;font-size:17px;font-weight:900}
.chead span{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px;line-height:1.8}

.bar2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cnt2{flex:1;min-width:130px;font-size:14px;font-weight:900}
.cnt2 small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
.saved{font-size:10.5px;font-weight:800;color:var(--accentlt);background:rgba(34,176,138,.12);
 border:1px solid rgba(34,176,138,.3);border-radius:100px;padding:5px 12px}

.list{display:flex;flex-direction:column;gap:8px}
.st{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--bd);
 border-radius:15px;padding:14px;cursor:pointer;transition:.18s;user-select:none;
 -webkit-tap-highlight-color:transparent}
.st.on{border-color:rgba(34,176,138,.45);background:rgba(34,176,138,.08)}
.st .bx{width:32px;height:32px;border-radius:10px;border:2px solid var(--bd);
 background:rgba(255,255,255,.04);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.18s}
.st .bx svg{width:18px;height:18px;stroke:#fff;opacity:0}
.st.on .bx{background:var(--accent);border-color:var(--accent)}
.st.on .bx svg{opacity:1}
.st .nm{flex:1;min-width:0}
.st .nm b{display:block;font-size:15px;font-weight:900;line-height:1.45}
.st .nm a{display:inline-block;font-size:12.5px;color:var(--muted2);font-weight:800;
 margin-top:3px;direction:ltr;text-decoration:none}
.st .nm a:hover{color:var(--accentlt)}
.st .nm .x{font-size:10.5px;color:var(--muted);font-weight:700}
.st .tag{font-size:10px;font-weight:800;border-radius:100px;padding:4px 10px;white-space:nowrap}
.t-abs{background:rgba(214,84,84,.13);color:#E08A8A}
.t-prs{background:rgba(34,176,138,.14);color:var(--accentlt)}
.t-exp{background:var(--warnbg);color:var(--warn)}

.savebar{position:fixed;bottom:0;right:0;left:0;z-index:40;background:rgba(4,13,9,.94);
 backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding:13px 16px;
 transform:translateY(130%);transition:.3s}
.savebar.show{transform:translateY(0)}
.savebar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:11px}
.savebar .c{flex:1;font-size:13px;font-weight:900}
.savebar .c span{display:block;font-size:11px;color:var(--muted);font-weight:700}

.empty{text-align:center;padding:52px 20px;color:var(--muted);font-size:13px;font-weight:700;line-height:2}
.toast{position:fixed;bottom:96px;right:50%;transform:translateX(50%) translateY(20px);z-index:60;
 background:var(--teal);color:#fff;font-size:13px;font-weight:800;padding:12px 24px;border-radius:100px;
 opacity:0;pointer-events:none;transition:.28s;box-shadow:0 8px 28px rgba(0,0,0,.45);max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.toast.bad{background:#8A2F2F}
.spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;
 border-radius:50%;animation:sp .8s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.loading{text-align:center;padding:50px 0}
.loading .s{width:30px;height:30px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--accentlt);
 border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 13px}
.loading p{font-size:13px;color:var(--muted);font-weight:700}
#app{display:none}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">

  <!-- ═══ الدخول ═══ -->
  <div class="gate" id="gate">
    <div class="lg">
      <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
      </svg>
    </div>
    <h1>تحضير الطلبة</h1>
    <p>أدخل كودك للمتابعة</p>
    <input type="password" id="keyIn" placeholder="كود الموظف" autocomplete="off">
    <button class="btn lg" id="loginBtn" onclick="login()">
      <span id="loginTxt">دخول</span><div class="spin" id="loginSpin"></div>
    </button>
    <div class="err" id="gateErr"></div>
  </div>

  <!-- ═══ اللوحة ═══ -->
  <div id="app">
    <div class="head">
      <div class="htitle">
        <div class="lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </div>
        <div><b>تحضير الطلبة</b><span id="whoTxt">—</span></div>
      </div>
      <div class="hacts" id="nav"></div>
    </div>

    <!-- ── اختيار اليوم ── -->
    <div id="viewDay">
      <div class="daybar">
        <div class="top">
          <div class="d"><b id="dName">—</b><span id="dSub">—</span></div>
          <input type="date" id="fDate" onchange="loadDay()">
        </div>
        <div class="quick">
          <div class="dq" onclick="setDay(0)">اليوم</div>
          <div class="dq" onclick="setDay(-1)">أمس</div>
          <div class="dq" onclick="setDay(-2)">قبل يومين</div>
        </div>
      </div>

      <div class="loading hide" id="dLoading"><div class="s"></div><p>جاري تحميل دورات اليوم...</p></div>
      <div class="courses" id="courses"></div>
      <div class="empty hide" id="dEmpty"></div>
    </div>

    <!-- ── كشف الحضور ── -->
    <div id="viewRoster" class="hide">
      <div class="back" onclick="backToDay()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        رجوع لدورات اليوم
      </div>

      <div class="chead">
        <b id="cName">—</b>
        <span id="cMeta">—</span>
      </div>

      <div class="loading hide" id="rLoading"><div class="s"></div><p>جاري تحميل الطلاب...</p></div>

      <div id="rosterWrap" class="hide">
        <div class="bar2">
          <div class="cnt2" id="cnt">—</div>
          <span class="saved hide" id="savedTag">محفوظ مسبقاً</span>
          <button class="btn sm gh" onclick="allOn(true)">الكل حاضر</button>
          <button class="btn sm gh" onclick="allOn(false)">الكل غائب</button>
        </div>
        <div class="list" id="list"></div>
      </div>

      <div class="empty hide" id="rEmpty"></div>
    </div>
  </div>
</div>

<div class="savebar" id="savebar">
  <div class="in">
    <div class="c"><span id="sbTop">—</span><span id="sbSub"></span></div>
    <button class="btn" id="saveBtn" onclick="save()" style="padding:13px 26px">
      <span id="saveTxt">حفظ الحضور</span><div class="spin" id="saveSpin"></div>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STAFF_URL = 'https://script.google.com/macros/s/AKfycbwzFj5x3jJTep0wm6NET-05i5vAm1a_foecHOBjH3YfjggI4bcHHJpAB67XZPcXR_yOiQ/exec';

const NAVS = [
  ['students','students.html','الطلاب'],
  ['reception','reception.html','التسجيل'],
  ['teachers','staff-edu.html','المعلمين'],
  ['admin','admin.html','الصلاحيات']
];

let KEY='', USER='', PERMS=[];
let DAYSECS=[], CUR=null, ROSTER=[], present=new Set();
let wasSaved=false, dirty=false;

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const J   = v => String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const arN = n => String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);

/* ══════════ الاتصال ══════════ */
const READ_ACTIONS = ['ping','attend-day','attend-get'];

function call(params){
  const act=String(params.action||'');
  return READ_ACTIONS.indexOf(act)>-1 ? jsonp(params) : post(params);
}

async function post(params){
  const body=Object.assign({},params);
  if(KEY) body.key=KEY;
  let res;
  try{
    res=await fetch(STAFF_URL,{ method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(body) });
  }catch(e){ throw new Error('ما وصل الطلب للخادم — تأكد من الإنترنت'); }
  if(!res.ok) throw new Error('الخادم رد بخطأ '+res.status+' — راجع نشر السكربت');
  const txt=await res.text();
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error('رد غير مفهوم من الخادم: '+txt.slice(0,120)); }
}

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='__at_'+Math.random().toString(36).slice(2);
    let done=false;
    const t=setTimeout(()=>{ if(!done){done=true;clean();reject(new Error('انتهت المهلة — الخادم ما رد'));} },30000);
    function clean(){ try{delete window[cb];}catch(e){} const s=document.getElementById(cb); if(s)s.remove(); clearTimeout(t); }
    window[cb]=r=>{ if(done)return; done=true; clean(); resolve(r); };
    const extra={callback:cb,_:Date.now()};
    if(KEY) extra.key=KEY;
    const qs=new URLSearchParams(Object.assign({},params,extra));
    const s=document.createElement('script');
    s.id=cb; s.src=STAFF_URL+'?'+qs.toString();
    s.onerror=()=>{ if(!done){done=true;clean();reject(new Error('تعذّر تحميل البيانات — تأكد من رابط السكربت ونشره'));} };
    document.head.appendChild(s);
  });
}

/* ══════════ الدخول ══════════ */
async function login(){
  const v=document.getElementById('keyIn').value.trim();
  if(!v) return;
  KEY=v;
  const b=document.getElementById('loginBtn'); b.disabled=true;
  document.getElementById('loginTxt').textContent='جاري التحقق...';
  document.getElementById('loginSpin').style.display='block';
  document.getElementById('gateErr').textContent='';
  try{
    const r=await call({action:'ping'});
    if(!r||!r.ok) throw new Error(r&&r.msg?r.msg:'كود غير صحيح');
    PERMS=r.perms||[];
    if(PERMS.indexOf('admin')===-1 && PERMS.indexOf('attendance')===-1)
      throw new Error('ما عندك صلاحية التحضير');
    USER=r.user||'موظف';
    document.getElementById('whoTxt').textContent=USER;
    try{ sessionStorage.setItem('staff_key',KEY); }catch(e){}
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    paintNav(); setDay(0);
  }catch(e){ KEY=''; document.getElementById('gateErr').textContent=e.message; }
  b.disabled=false;
  document.getElementById('loginTxt').textContent='دخول';
  document.getElementById('loginSpin').style.display='none';
}

function logout(){
  KEY='';DAYSECS=[];ROSTER=[];present.clear();CUR=null;
  try{ sessionStorage.removeItem('staff_key'); }catch(e){}
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='block';
  document.getElementById('keyIn').value='';
  document.getElementById('savebar').classList.remove('show');
}
document.getElementById('keyIn').addEventListener('keydown',e=>{ if(e.key==='Enter') login(); });

function paintNav(){
  const adm=PERMS.indexOf('admin')>-1;
  let h=NAVS.filter(n=>adm||PERMS.indexOf(n[0])>-1)
    .map(n=>'<a class="btn sm gh" href="'+n[1]+'" style="text-decoration:none">'+n[2]+'</a>').join('');
  h+='<button class="btn sm gh" onclick="logout()">خروج</button>';
  document.getElementById('nav').innerHTML=h;
}

/* ══════════ اليوم ══════════ */
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function setDay(off){
  const d=new Date(); d.setDate(d.getDate()+off);
  document.getElementById('fDate').value=iso(d);
  [].slice.call(document.querySelectorAll('.dq')).forEach((e,i)=>
    e.classList.toggle('on', i===Math.abs(off)));
  loadDay();
}

async function loadDay(){
  const date=document.getElementById('fDate').value;
  if(!date) return;
  backToDay(true);
  document.getElementById('dLoading').classList.remove('hide');
  document.getElementById('courses').innerHTML='';
  document.getElementById('dEmpty').classList.add('hide');
  try{
    const r=await call({action:'attend-day', date:date});
    if(!r||!r.ok) throw new Error(r&&r.msg?r.msg:'تعذّر التحميل');
    DAYSECS=r.sections||[];
    document.getElementById('dName').textContent=(r.dayName||'')+' · '+(r.date||'');
    const tot=DAYSECS.reduce((a,s)=>a+s.count,0);
    const done=DAYSECS.filter(s=>s.saved).length;
    document.getElementById('dSub').textContent= DAYSECS.length
      ? arN(DAYSECS.length)+' دورة · '+arN(tot)+' طالب'+(done?' · حُضّر '+arN(done):'')
      : 'ما في دورات بهذا اليوم';
    paintCourses();
  }catch(e){ toast(e.message,true); }
  document.getElementById('dLoading').classList.add('hide');
}

function paintCourses(){
  const C=document.getElementById('courses'), E=document.getElementById('dEmpty');
  if(!DAYSECS.length){
    C.innerHTML='';
    E.textContent='ما في دورات مجدولة بهذا اليوم فيها طلاب مسجّلين.\n'+
      'تأكد من أيام الشعبة بصفحة الصلاحيات، أو اختر يوم ثاني.';
    E.classList.remove('hide');
    return;
  }
  E.classList.add('hide');
  C.innerHTML=DAYSECS.map((s,i)=>
    '<div class="cc '+(s.saved?'done':'')+'" onclick="openSec('+i+')">'+
      '<div class="tm">'+(s.from
        ? '<b>'+esc(s.from)+'</b><span>'+esc(s.to||'')+'</span>'
        : '<b>—</b><span>بلا وقت</span>')+'</div>'+
      '<div class="inf"><b>'+esc(s.name)+'</b><span>'+
        esc(s.stage||'')+(s.teacher?' · '+esc(s.teacher):'')+
        (s.subs?' · '+esc(s.subs):'')+
        (s.anyDay?' · <span class="badge b-w">بلا أيام محددة</span>':'')+
        (s.saved?' · <span class="badge b-ok">حُضّر '+arN(s.present)+'/'+arN(s.marked)+'</span>':'')+
      '</span></div>'+
      '<div class="cnt"><b>'+arN(s.count)+'</b><span>طالب</span></div>'+
      '<svg class="ar" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>'+
    '</div>').join('');
}

/* ══════════ كشف الحضور ══════════ */
function backToDay(silent){
  if(!silent && dirty && ROSTER.length &&
     !confirm('في تحضير ما انحفظ. تبي ترجع بدون حفظ؟')) return;
  CUR=null; ROSTER=[]; present=new Set(); dirty=false;
  document.getElementById('viewRoster').classList.add('hide');
  document.getElementById('viewDay').classList.remove('hide');
  document.getElementById('savebar').classList.remove('show');
  if(!silent) loadDay();
}

async function openSec(i){
  const s=DAYSECS[i]; if(!s) return;
  CUR=s;
  const date=document.getElementById('fDate').value;

  document.getElementById('viewDay').classList.add('hide');
  document.getElementById('viewRoster').classList.remove('hide');
  document.getElementById('rosterWrap').classList.add('hide');
  document.getElementById('rEmpty').classList.add('hide');
  document.getElementById('rLoading').classList.remove('hide');
  document.getElementById('cName').textContent=s.name;
  document.getElementById('cMeta').textContent=
    [s.stage, s.teacher, (s.from?s.from+' - '+s.to:''), document.getElementById('dName').textContent]
    .filter(Boolean).join(' · ');
  window.scrollTo({top:0,behavior:'smooth'});

  try{
    const r=await call({action:'attend-get', section:s.name, date:date});
    if(!r||!r.ok) throw new Error(r&&r.msg?r.msg:'تعذّر التحميل');
    ROSTER=r.students||[];
    wasSaved=!!r.saved; dirty=false;
    present=new Set();
    if(wasSaved){
      ROSTER.forEach(x=>{ if((r.marks||{})[x.sid]==='حاضر') present.add(x.sid); });
    }else{
      ROSTER.forEach(x=>present.add(x.sid));   /* الافتراضي: الكل حاضر */
      dirty=true;
    }
    if(!ROSTER.length){
      document.getElementById('rEmpty').textContent='ما في طلاب نشطين بهذي الدورة.';
      document.getElementById('rEmpty').classList.remove('hide');
    }else{
      document.getElementById('rosterWrap').classList.remove('hide');
      document.getElementById('savedTag').classList.toggle('hide',!wasSaved);
      paint();
    }
  }catch(e){
    toast(e.message,true);
    document.getElementById('rEmpty').textContent=e.message;
    document.getElementById('rEmpty').classList.remove('hide');
  }
  document.getElementById('rLoading').classList.add('hide');
}

function daysLeft(to){
  const m=String(to||'').match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if(!m) return null;
  const end=new Date(m[3]+'-'+m[2]+'-'+m[1]+'T00:00:00');
  const now=new Date(); now.setHours(0,0,0,0);
  return Math.round((end-now)/86400000);
}

function paint(){
  document.getElementById('list').innerHTML=ROSTER.map(s=>{
    const on=present.has(s.sid);
    const dl=daysLeft(s.to);
    let tag='';
    if(dl!==null && dl<0)       tag='<span class="tag t-exp">اشتراك منتهي</span>';
    else if(dl!==null && dl<=5) tag='<span class="tag t-exp">باقي '+arN(dl)+' يوم</span>';
    else tag='<span class="tag '+(on?'t-prs':'t-abs')+'">'+(on?'حاضر':'غائب')+'</span>';
    const ph=s.phone||'';
    return '<div class="st '+(on?'on':'')+'" onclick="tg(\''+J(s.sid)+'\')">'+
      '<div class="bx"><svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>'+
      '<div class="nm"><b>'+esc(s.name)+'</b>'+
        (ph?'<a href="tel:'+esc(ph)+'" onclick="event.stopPropagation()">'+esc(ph)+'</a>'
           :'<span class="x">بدون رقم</span>')+
      '</div>'+tag+
    '</div>';
  }).join('');
  sync();
}

function tg(sid){
  if(present.has(sid)) present.delete(sid); else present.add(sid);
  dirty=true;
  paint();
}
function allOn(v){
  present = v ? new Set(ROSTER.map(s=>s.sid)) : new Set();
  dirty=true;
  paint();
}

function sync(){
  const n=present.size, t=ROSTER.length;
  document.getElementById('cnt').innerHTML=
    arN(n)+' حاضر · '+arN(t-n)+' غائب<small>من '+arN(t)+' طالب</small>';
  document.getElementById('sbTop').textContent=arN(n)+' حاضر من '+arN(t);
  document.getElementById('sbSub').textContent=
    (CUR?CUR.name:'')+' · '+document.getElementById('fDate').value;
  document.getElementById('savebar').classList.toggle('show', t>0 && dirty);
}

/* ══════════ الحفظ ══════════ */
async function save(){
  if(!CUR || !ROSTER.length) return;
  const date=document.getElementById('fDate').value;
  const b=document.getElementById('saveBtn'); b.disabled=true;
  document.getElementById('saveSpin').style.display='block';
  document.getElementById('saveTxt').textContent='جاري الحفظ...';
  try{
    const r=await call({ action:'attend-set', section:CUR.name, date:date,
      present:[...present].join(',') });
    if(!r||!r.ok) throw new Error(r&&r.msg?r.msg:'ما تم الحفظ');
    toast(r.msg||'تم حفظ الحضور');
    wasSaved=true; dirty=false;
    document.getElementById('savedTag').classList.remove('hide');
    sync();
  }catch(e){ toast(e.message,true); }
  b.disabled=false;
  document.getElementById('saveSpin').style.display='none';
  document.getElementById('saveTxt').textContent='حفظ الحضور';
}

window.addEventListener('beforeunload',e=>{
  if(dirty && ROSTER.length){ e.preventDefault(); e.returnValue=''; }
});

let tT;
function toast(m,bad){
  const el=document.getElementById('toast');
  el.textContent=m; el.className='toast show'+(bad?' bad':'');
  clearTimeout(tT); tT=setTimeout(()=>el.className='toast'+(bad?' bad':''),3200);
}

(function(){
  let s='';
  try{ s=sessionStorage.getItem('staff_key')||''; }catch(e){}
  if(s){ document.getElementById('keyIn').value=s; login(); }
})();
</script>
</body>
</html>
